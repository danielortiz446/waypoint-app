<title>Waypoint — Trip Planner</title>
<meta name="waypoint-version" content="4.3.5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1D30; --ink-2:#081525; --teal:#123B3B;
  --brass:#C9A227; --brass-light:#EFCB5E; --paper:#F6EFDF; --paper-dim:#EAE0C8;
  --coral:#C1502E; --green:#4C9A6A;
  --ink-text:#EDF1F4; --muted:rgba(237,241,244,0.56);
  --paper-text:#20261F; --paper-muted:#5b5646;
  --radius:16px;
  --font-display:'Big Shoulders Display',sans-serif;
  --font-body:'IBM Plex Sans',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--ink);color:var(--ink-text);font-family:var(--font-body);min-height:100vh;-webkit-font-smoothing:antialiased;}
body::before{content:"";position:fixed;inset:0;
  background:radial-gradient(circle at 12% 6%, rgba(201,162,39,0.12), transparent 38%),
             radial-gradient(circle at 92% 18%, rgba(76,154,106,0.07), transparent 40%),
             radial-gradient(circle at 50% 100%, rgba(18,59,59,0.55), transparent 55%),
             linear-gradient(180deg, #0B1D30 0%, #081525 100%);
  pointer-events:none;z-index:0;}
#app{position:relative;z-index:1;max-width:720px;margin:0 auto;padding-bottom:40px;min-height:100vh;}
h1,h2,h3,.display{font-family:var(--font-display);font-weight:700;letter-spacing:0.01em;}
button{font-family:var(--font-body);cursor:pointer;}
input,select,textarea{font-family:var(--font-body);}
main{padding:0 18px 24px;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 40%, #163049, #081525 75%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  animation:splashOut .5s ease .9s forwards;}
#splash .smark{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--brass),var(--brass-light));
  display:flex;align-items:center;justify-content:center;animation:splashPop .5s cubic-bezier(.2,1.4,.4,1);box-shadow:0 14px 40px rgba(201,162,39,0.35);}
#splash .sname{font-family:var(--font-display);font-size:25px;letter-spacing:0.08em;color:var(--paper);}
@keyframes splashPop{0%{transform:scale(0.4) rotate(-14deg);opacity:0;}100%{transform:scale(1) rotate(-6deg);opacity:1;}}
@keyframes splashOut{to{opacity:0;visibility:hidden;pointer-events:none;}}

/* ---------- header ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;row-gap:8px;
  padding-top:calc(14px + env(safe-area-inset-top, 0px));
  padding-right:calc(16px + env(safe-area-inset-right, 0px));
  padding-bottom:14px;
  padding-left:calc(16px + env(safe-area-inset-left, 0px));
  min-height:calc(62px + env(safe-area-inset-top, 0px));
  background:rgba(11,29,48,0.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,0.07);}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brass),var(--brass-light));
  display:flex;align-items:center;justify-content:center;transform:rotate(-6deg);flex:0 0 auto;}
.brand-mark svg{width:18px;height:18px;}
.brand h1{font-size:20px;margin:0;line-height:1;color:var(--paper);}
.header-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.icon-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink-text);overflow:hidden;}
.icon-btn:hover{background:rgba(255,255,255,0.13);}
.lang-toggle{display:flex;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:3px;gap:2px;}
.lang-toggle button{border:none;background:transparent;color:var(--muted);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;}
.lang-toggle button.active{background:var(--brass);color:var(--ink);}
@media(max-width:380px){.lang-toggle button{padding:5px 9px;font-size:10.5px;}.brand h1{font-size:17px;}}

.back-row{display:flex;align-items:center;gap:10px;padding:14px 16px 0;}
.back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--brass-light);font-size:13px;font-weight:600;padding:6px 4px;}

.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 14px;flex-wrap:wrap;gap:10px;}
.section-head h2{font-size:26px;margin:0;color:var(--paper);}
.section-head p.sub{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin:2px 0 0;letter-spacing:0.03em;}

.btn{border-radius:9px;padding:10px 18px;font-weight:600;font-size:13.5px;border:none;display:inline-flex;align-items:center;gap:6px;transition:transform .12s, background .15s;}
.btn:active{transform:scale(0.96);}
.btn-brass{background:var(--brass);color:var(--ink);}
.btn-brass:hover{background:var(--brass-light);}
.btn-ghost{background:rgba(255,255,255,0.07);color:var(--ink-text);border:1px solid rgba(255,255,255,0.15);}
.btn-ghost:hover{background:rgba(255,255,255,0.13);}
.btn-danger{background:rgba(193,80,46,0.16);color:#E8A186;border:1px solid rgba(193,80,46,0.4);}
.btn-sm{padding:7px 12px;font-size:12px;}
.btn-block{width:100%;justify-content:center;}

.panel{background:var(--teal);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr;}}
.stat{background:var(--teal);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius);padding:14px 16px;}
.stat .label{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);}
.stat .value{font-family:var(--font-display);font-size:28px;color:var(--paper);margin-top:3px;line-height:1;}
.stat .value.green{color:var(--green);} .stat .value.coral{color:var(--coral);}
.stat .foot{font-size:11px;color:var(--muted);margin-top:5px;}

/* trip card */
.pass{display:flex;background:linear-gradient(180deg,var(--paper),var(--paper-dim));border-radius:var(--radius);overflow:hidden;
  margin-bottom:14px;box-shadow:0 10px 24px rgba(0,0,0,0.26);transition:transform .15s;cursor:pointer;}
.pass:hover{transform:translateY(-2px);}
.pass-main{flex:1;padding:16px 18px;position:relative;color:var(--paper-text);min-width:0;}
.trip-header{background:linear-gradient(180deg,var(--paper),var(--paper-dim));box-shadow:0 10px 24px rgba(0,0,0,0.26);}
.pass-main.has-cover{color:#fff;background-size:cover;background-position:center;}
.pass-main.has-cover .route,.pass-main.has-cover .dates{color:rgba(246,239,223,0.8);}
.pass-main.has-cover h3{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,0.4);}
.pass-main.has-cover .kebab-btn{background:rgba(0,0,0,0.35);color:#fff;}
.route{font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--paper-muted);margin-bottom:3px;}
.shared-badge{background:rgba(76,154,106,0.16);color:#3f8f60;border:1px solid rgba(76,154,106,0.35);border-radius:5px;padding:2px 6px;font-size:9.5px;letter-spacing:0.04em;}
.pass-main.has-cover .shared-badge{background:rgba(76,154,106,0.85);color:#fff;border-color:transparent;}
.pass-main h3{font-size:23px;margin:0 0 5px;}
.dates{font-family:var(--font-mono);font-size:11.5px;color:var(--paper-muted);}
.kebab-btn{position:absolute;top:10px;right:10px;z-index:5;width:28px;height:28px;border-radius:8px;background:rgba(0,0,0,0.07);
  border:none;color:var(--paper-muted);font-size:15px;display:flex;align-items:center;justify-content:center;}
.pass-stub{width:120px;flex:0 0 120px;background:var(--brass);color:var(--ink);padding:14px 12px;display:flex;flex-direction:column;justify-content:center;position:relative;}
.pass-stub::before{content:"";position:absolute;left:-8px;top:0;bottom:0;width:16px;
  background-image:radial-gradient(circle,var(--ink) 4px,transparent 4.1px);background-size:16px 16px;background-position:center;}
.countdown-num{font-family:var(--font-display);font-size:32px;line-height:0.9;font-weight:800;}
.countdown-label{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:0.08em;margin-top:3px;}
.passport-warn{margin-top:6px;font-size:10.5px;font-weight:600;color:#C1502E;background:rgba(193,80,46,0.12);
  border:1px solid rgba(193,80,46,0.3);border-radius:6px;padding:4px 7px;display:inline-block;}
.pass-main.has-cover .passport-warn{background:rgba(193,80,46,0.85);color:#fff;border-color:transparent;}

.pbar{height:8px;border-radius:5px;background:rgba(255,255,255,0.1);overflow:hidden;}
.pbar > div{height:100%;border-radius:5px;background:var(--green);transition:width .4s;}
.pbar.over > div{background:var(--coral);}

.field{margin-bottom:12px;}

.field input,.field select,.field textarea{width:100%;background:rgba(255,255,255,0.09);border:1px solid rgba(255,255,255,0.22);border-radius:8px;padding:10px 11px;color:var(--ink-text);font-size:14px;}
.field select{-webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%23EDF1F4'><path d='M5.5 7.5l4.5 4.5 4.5-4.5' stroke='%23EDF1F4' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;background-size:15px;padding-right:34px;}
.field select option{background:#132A42;color:#EDF1F4;}
.field textarea{resize:vertical;min-height:56px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brass);outline-offset:1px;}
.field-hint{font-size:10.5px;color:var(--muted);margin:4px 0 0;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

.form-actions{display:flex;gap:10px;margin-top:6px;}

.row-list{display:flex;flex-direction:column;gap:2px;}
.li{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,0.07);}
.li:last-child{border-bottom:none;}
.li .main{display:flex;flex-direction:column;min-width:0;}
.li .main .t{font-size:13.5px;font-weight:600;}
.li .main .s{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);}
.li .amt{font-family:var(--font-mono);font-weight:600;font-size:13.5px;white-space:nowrap;}
.li .amt.neg{color:var(--coral);}
.li button.del{background:none;border:none;color:var(--muted);font-size:15px;padding:2px 6px;}
.li button.del:hover{color:var(--coral);}

.empty{padding:34px 18px;text-align:center;color:var(--muted);}
.empty .ic{font-size:32px;display:block;margin-bottom:10px;}
.empty h3{color:var(--paper);font-size:18px;margin:0 0 6px;}
.empty p{font-size:13px;margin:0 0 16px;}

.chk{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid rgba(255,255,255,0.07);}
.chk input[type=checkbox]{width:18px;height:18px;accent-color:var(--brass);}
.chk .txt{flex:1;font-size:13.5px;}
.chk .txt.done{text-decoration:line-through;color:var(--muted);}

.seg{display:flex;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:11px;padding:3px;gap:2px;}
.seg button{flex:1;border:none;background:transparent;color:var(--muted);padding:9px 6px;border-radius:8px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;}
.seg button .ic{font-size:15px;}
.seg button.active{background:var(--brass);color:var(--ink);}

.trip-cover-preview{width:76px;height:52px;border-radius:9px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.16);
  display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;flex:0 0 auto;}
.trip-cover-preview img{width:100%;height:100%;object-fit:cover;display:block;}
.hidden-file{display:none;}

.day-card{background:var(--teal);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:13px 15px;margin-bottom:11px;}
.day-card .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;gap:8px;}
.day-card .dh .lbl{font-family:var(--font-display);font-size:18px;color:var(--paper);}
.day-card .dh .ctl{display:flex;gap:4px;flex:0 0 auto;}
.day-card .dh .ctl button{width:26px;height:26px;padding:0;border-radius:7px;justify-content:center;}
.act-row{display:flex;align-items:center;gap:9px;padding:7px 2px;border-bottom:1px solid rgba(255,255,255,0.06);}
.act-row:last-child{border-bottom:none;}
.act-row .time{font-family:var(--font-mono);font-size:11px;color:var(--brass-light);min-width:48px;}
.act-row .title{flex:1;font-size:13px;}
.add-act-row{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap;}
.add-act-row input{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.16);border-radius:7px;color:var(--ink-text);padding:7px 9px;font-size:12px;min-width:0;}
.add-act-row input.time-in{width:68px;flex:0 0 68px;}
.add-act-row input.title-in{flex:1 1 120px;min-width:0;}
.add-act-row button{flex:0 0 auto;}
.time12-picker{display:flex;align-items:center;gap:5px;flex:0 0 auto;}
.time12-picker select{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.16);
  border-radius:7px;
  color:var(--ink-text);
  padding:7px 6px;
  font-size:12px;
  min-width:0;
}
.time12-picker select option{background:#132A42;color:#EDF1F4;}
.time12-picker .hour{width:52px;}
.time12-picker .minute{width:56px;}
.time12-picker .ampm{width:58px;}
@media(max-width:520px){
  .time12-picker{width:100%;}
  .time12-picker select{flex:1;}
}


.chip{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);border-radius:999px;padding:6px 11px;font-size:12px;display:inline-flex;align-items:center;gap:7px;margin:0 6px 6px 0;}
.chip button{background:none;border:none;color:var(--muted);font-size:12px;}
.chip button:hover{color:var(--coral);}
.chips-wrap{display:flex;flex-wrap:wrap;}

.theme-grid{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
.theme-opt{width:70px;text-align:center;cursor:pointer;}
.theme-swatch{width:70px;height:42px;border-radius:9px;border:2px solid transparent;margin-bottom:5px;}
.theme-opt.sel .theme-swatch{border-color:var(--paper);}
.theme-opt .lbl{font-size:10px;color:var(--muted);}

.avatar-grid{display:flex;gap:9px;flex-wrap:wrap;margin:6px 0;}
.avatar-opt{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.06);border:2px solid transparent;
  display:flex;align-items:center;justify-content:center;font-size:18px;}
.avatar-opt.sel{border-color:var(--brass);background:rgba(201,162,39,0.16);}
.photo-circle{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.16);
  display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;flex:0 0 auto;}
.photo-circle img{width:100%;height:100%;object-fit:cover;}

.fab{position:fixed;bottom:24px;right:20px;z-index:40;width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,var(--brass),var(--brass-light));color:var(--ink);border:none;font-size:25px;font-weight:700;
  box-shadow:0 10px 26px rgba(201,162,39,0.42);display:flex;align-items:center;justify-content:center;}
.fab:active{transform:scale(0.94);}

#toast-container{position:fixed;left:0;right:0;bottom:22px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none;}
.toast{pointer-events:auto;background:var(--ink-2);border:1px solid rgba(255,255,255,0.15);color:var(--ink-text);
  padding:11px 14px;border-radius:10px;font-size:13px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 22px rgba(0,0,0,0.35);animation:toastIn .2s ease;}
.toast.out{animation:toastOut .3s ease forwards;}
@keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px);}}
.toast button{background:none;border:none;color:var(--brass-light);font-weight:700;font-size:12px;}

.modal-bg{position:fixed;inset:0;background:rgba(6,15,25,0.72);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s ease;}
@media(min-width:640px){.modal-bg{align-items:center;}}
.modal{background:var(--ink-2);border:1px solid rgba(255,255,255,0.12);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;}
@media(min-width:640px){.modal{border-radius:16px;}}
.modal h3{margin:0 0 14px;font-size:20px;color:var(--paper);}

.hero-path{width:100%;height:36px;margin-top:10px;display:block;}
.hero-path .dash{stroke-dasharray:5 7;animation:dashMove 3.2s linear infinite;}
@keyframes dashMove{to{stroke-dashoffset:-24;}}

/* themes */
[data-theme="sunset"]{--ink:#2B1710;--ink-2:#20110C;--teal:#4A2A1C;--brass:#E07A3F;--brass-light:#F4A15F;--green:#4C9A6A;--coral:#D9432B;}
[data-theme="sunset"] body::before{background:radial-gradient(circle at 12% 6%, rgba(224,122,63,0.15), transparent 38%),radial-gradient(circle at 92% 18%, rgba(76,154,106,0.08), transparent 40%),radial-gradient(circle at 50% 100%, rgba(74,42,28,0.6), transparent 55%),linear-gradient(180deg,#2B1710 0%,#20110C 100%);}
[data-theme="forest"]{--ink:#0E1F16;--ink-2:#0A1710;--teal:#1B3A29;--brass:#B7A345;--brass-light:#D8C56B;--green:#5EAE7C;--coral:#C1502E;}
[data-theme="forest"] body::before{background:radial-gradient(circle at 12% 6%, rgba(183,163,69,0.13), transparent 38%),radial-gradient(circle at 92% 18%, rgba(94,174,124,0.09), transparent 40%),radial-gradient(circle at 50% 100%, rgba(27,58,41,0.6), transparent 55%),linear-gradient(180deg,#0E1F16 0%,#0A1710 100%);}
[data-theme="rose"]{--ink:#2A1930;--ink-2:#1E1224;--teal:#432A4E;--brass:#D68FB0;--brass-light:#F0B8D0;--green:#4C9A6A;--coral:#C1502E;}
[data-theme="rose"] body::before{background:radial-gradient(circle at 12% 6%, rgba(214,143,176,0.14), transparent 38%),radial-gradient(circle at 92% 18%, rgba(76,154,106,0.06), transparent 40%),radial-gradient(circle at 50% 100%, rgba(67,42,78,0.6), transparent 55%),linear-gradient(180deg,#2A1930 0%,#1E1224 100%);}
body{transition:background .3s;}

/* collaboration */
.collab-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:rgba(76,154,106,.12);border:1px solid rgba(76,154,106,.3);border-radius:12px;padding:10px 12px;margin:0 0 14px;}
.collab-status{font-size:12px;color:var(--ink-text);display:flex;align-items:center;gap:7px;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(76,154,106,.12);}
.sync-dot.off{background:var(--muted);box-shadow:none;}

/* enhanced preparation + packing */
.prep-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.prep-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:rgba(255,255,255,.035);}
.prep-item .prep-icon{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:0 0 24px;font-size:12px;font-weight:800;background:rgba(255,255,255,.08);color:var(--muted);}
.prep-item.done .prep-icon{background:rgba(76,154,106,.2);color:#8fd1a7;}
.prep-item.partial .prep-icon{background:rgba(201,162,39,.18);color:var(--brass-light);}
.prep-item .prep-copy{flex:1;min-width:0;}
.prep-item .prep-title{font-size:12.5px;font-weight:650;}
.prep-item .prep-sub{font-size:10.5px;color:var(--muted);margin-top:2px;}
.prep-item button{border:0;background:none;color:var(--brass-light);font-size:11px;font-weight:700;padding:4px 0;}
.packing-summary{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;}
.packing-count{font-family:var(--font-display);font-size:28px;color:var(--paper);line-height:1;}
.packing-group{margin-bottom:12px;}
.packing-group-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 7px;}
.packing-group-title{font-size:12px;font-weight:700;color:var(--paper);}
.packing-group-count{font-family:var(--font-mono);font-size:10px;color:var(--muted);}
.packing-item{display:flex;align-items:center;gap:9px;padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.07);}
.packing-item:last-child{border-bottom:none;}
.packing-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--brass);}
.packing-item .packing-text{flex:1;font-size:13.5px;min-width:0;}
.packing-item .packing-text.done{text-decoration:line-through;color:var(--muted);}
.qty-badge{font-family:var(--font-mono);font-size:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);border-radius:999px;padding:3px 7px;color:var(--muted);}
.packing-add-grid{display:grid;grid-template-columns:minmax(0,1fr) 130px 72px auto;gap:8px;align-items:end;}
@media(max-width:600px){.packing-add-grid{grid-template-columns:1fr 1fr;}.packing-add-grid .packing-name{grid-column:1/-1;}.packing-add-grid .packing-add-btn{grid-column:1/-1;}}

/* ---------- printable itinerary preview ---------- */
#print-preview-root{position:fixed;inset:0;z-index:150;background:#eef1f4;color:#16202a;display:flex;flex-direction:column;}
.print-preview-toolbar{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px 14px;background:var(--ink-2);color:var(--ink-text);border-bottom:1px solid rgba(255,255,255,.12);flex-wrap:wrap;}
.print-preview-title{font-family:var(--font-display);font-size:20px;color:var(--paper);}
.print-preview-actions{display:flex;gap:8px;flex-wrap:wrap;}
.print-preview-scroll{overflow:auto;flex:1;padding:20px;}
.print-sheet{background:#fff;max-width:820px;margin:0 auto;padding:36px 42px;box-shadow:0 8px 30px rgba(0,0,0,.16);min-height:90vh;}
.print-hero{border-bottom:3px solid #C9A227;padding-bottom:18px;margin-bottom:22px}.print-brand{font-size:12px;letter-spacing:.18em;font-weight:700;color:#8a6d10}.print-hero h1{font-family:Arial,sans-serif;font-size:30px;margin:6px 0}.print-meta{font-size:14px;color:#59636d;display:flex;gap:16px;flex-wrap:wrap}.print-section{break-inside:avoid;margin:0 0 24px}.print-section h2{font-family:Arial,sans-serif;font-size:18px;margin:0 0 6px;border-bottom:1px solid #ddd;padding-bottom:6px}.print-date,.print-muted,.print-loc{color:#68737d;font-size:12px}.print-date{margin-bottom:8px}.print-sheet table{width:100%;border-collapse:collapse}.print-sheet td{padding:8px 6px;border-bottom:1px solid #ececec;vertical-align:top;font-size:13px}.print-time{width:78px;font-weight:700;color:#8a6d10}.print-footer{margin-top:30px;padding-top:12px;border-top:1px solid #ddd;font-size:10px;color:#7a838c;text-align:center}
@media(max-width:600px){.print-preview-toolbar{align-items:stretch}.print-preview-title{order:-1;width:100%}.print-preview-actions{width:100%}.print-preview-actions .btn{flex:1}.print-preview-scroll{padding:10px}.print-sheet{padding:24px 18px}.print-hero h1{font-size:25px}}

/* print */
@media print{
  body.print-preview-active{background:#fff !important;}
  body.print-preview-active::before, body.print-preview-active #app, body.print-preview-active #toast-container, body.print-preview-active .print-preview-toolbar{display:none !important;}
  body.print-preview-active #print-preview-root{display:block !important;position:static !important;background:#fff !important;}
  body.print-preview-active .print-preview-scroll{display:block !important;overflow:visible !important;padding:0 !important;}
  body.print-preview-active .print-sheet{display:block !important;max-width:none !important;margin:0 !important;padding:0 !important;box-shadow:none !important;min-height:0 !important;}
  body:not(.print-preview-active)::before, body:not(.print-preview-active) .topbar, body:not(.print-preview-active) .fab, body:not(.print-preview-active) #toast-container, body:not(.print-preview-active) .kebab-btn, body:not(.print-preview-active) .add-act-row{display:none !important;}
}

/* ===== Waypoint V2 enhancements ===== */
.seg{overflow-x:auto;justify-content:flex-start;scrollbar-width:none;}
.seg::-webkit-scrollbar{display:none;}
.seg button{min-width:86px;flex:1 0 auto;}
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
@media(max-width:620px){.metric-grid{grid-template-columns:1fr 1fr;}}
.metric-card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:13px;}
.metric-card .k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.metric-card .v{font-family:var(--font-display);font-size:24px;color:var(--paper);margin-top:3px;}

.booking-type{font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--brass-light);}
.booking-title{font-weight:700;margin-top:3px;}
.booking-meta{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5;}
.activity-meta{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:2px;}
.activity-meta a{color:var(--brass-light);text-decoration:none;}
.add-act-row .place-in{flex:1 1 150px;}
.progress-line{height:7px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-top:8px;}

.readiness-card{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:16px;margin-bottom:14px;}
.readiness-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px;}

/* live collaboration chat */

/* participants view v6.0.4 */
.participants-modal{max-width:560px;}
.participant-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.participant-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);}
.participant-main{display:flex;align-items:center;gap:10px;min-width:0;}
.participant-avatar{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:rgba(201,162,39,.14);color:var(--brass-light);font-weight:850;}
.participant-name{font-size:12px;font-weight:800;color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.participant-last{font:9px var(--font-mono);color:var(--muted);margin-top:3px;}
.participant-role{flex:0 0 auto;}
.participant-summary{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;}


/* Waypoint V7 collaboration + travel pro */
.sync-state{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:999px;font:9px var(--font-mono);background:rgba(255,255,255,.055);color:var(--muted)}
.sync-state.ok{color:#75d6a1}.sync-state.pending{color:var(--brass-light)}.sync-state.offline{color:var(--coral)}
.invite-list,.security-list,.notify-list,.pinned-list{display:flex;flex-direction:column;gap:8px}
.invite-row,.security-row,.notify-row,.pinned-row{padding:10px 11px;border-radius:11px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}
.invite-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.security-row,.notify-row{display:grid;grid-template-columns:30px 1fr;gap:9px;align-items:flex-start}
.security-icon,.notify-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:rgba(201,162,39,.11)}
.chat-pin{font-size:9px;color:var(--brass-light);margin-bottom:4px}
.mention{color:var(--brass-light);font-weight:800}
.chat-msg.edited .chat-meta::after{content:" · edited";font-size:8px;color:var(--muted)}
.travel-mode-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;margin-bottom:12px;border-radius:11px;background:rgba(68,185,120,.08);border:1px solid rgba(68,185,120,.17)}
.practical-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.practical-card{padding:11px;border-radius:11px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}
.practical-card .k{font:9px var(--font-mono);color:var(--muted);text-transform:uppercase}
.practical-card .v{font-size:12px;font-weight:750;margin-top:5px;color:var(--paper)}
.budget-cap{height:6px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:5px}
.budget-cap>span{display:block;height:100%;background:currentColor}
.center-badge{position:relative}
.center-badge .chat-badge{position:absolute;top:-6px;right:-7px}
.skip-link{position:fixed;left:8px;top:-50px;z-index:999;background:#fff;color:#000;padding:8px 10px;border-radius:8px}
.skip-link:focus{top:8px}
@media(max-width:759px){
  .invite-row{flex-direction:column}
}


/* Waypoint 7.0.1 compact navigation + collaboration */
.trip-nav-wrap{position:relative;margin-bottom:16px}
.trip-nav-primary{display:flex;align-items:stretch;gap:2px;overflow-x:auto;scrollbar-width:none;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:2px;background:rgba(255,255,255,.025)}
.trip-nav-primary::-webkit-scrollbar{display:none}
.trip-nav-primary>button,.trip-nav-primary>.trip-more>summary{min-width:88px;min-height:70px;border:0;background:transparent;color:var(--muted);border-radius:11px;padding:9px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-weight:750;cursor:pointer;white-space:nowrap}
.trip-nav-primary>button.active,.trip-nav-primary>.trip-more.active>summary{background:var(--brass);color:#071522}
.trip-nav-primary .ic{font-size:14px}
.trip-more{position:relative;flex:0 0 auto}
.trip-more>summary,.collab-menu>summary{list-style:none}
.trip-more>summary::-webkit-details-marker,.collab-menu>summary::-webkit-details-marker{display:none}
.trip-menu,.collab-popup{position:absolute;right:0;top:calc(100% + 7px);z-index:55;min-width:225px;padding:7px;border-radius:12px;background:#10283b;border:1px solid rgba(255,255,255,.13);box-shadow:0 18px 45px rgba(0,0,0,.38)}
.trip-menu button,.collab-popup button{display:block;width:100%;border:0;background:transparent;color:var(--ink-text);text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:11px}
.trip-menu button:hover,.trip-menu button.active,.collab-popup button:hover{background:rgba(201,162,39,.11);color:var(--brass-light)}
.collab-popup .danger{color:#ff9a86}
.trip-global-collab.compact-collab{padding:10px 12px;gap:9px}
.collab-summary{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.collab-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.collab-menu{position:relative}
.collab-count-btn{min-width:48px}
.smart-place{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-top:8px;padding:8px 9px;border-radius:9px;background:rgba(91,145,190,.09);border:1px solid rgba(91,145,190,.15);font-size:10px;color:var(--muted)}
@media(max-width:759px){
  .trip-nav-primary>button,.trip-nav-primary>.trip-more>summary{min-width:78px;min-height:62px;padding:8px 9px;font-size:10px}
  .compact-collab .left{width:100%}
  .collab-actions{width:100%;justify-content:flex-end}
  .collab-actions .text-label{display:none}
  .collab-popup,.trip-menu{position:fixed;left:12px;right:12px;top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));min-width:0;max-height:68dvh;overflow:auto}
}


/* Waypoint 7.0.2 reliable More menu */
.trip-more-btn{flex:0 0 auto}
.trip-more-menu-portal{position:absolute;right:0;top:calc(100% + 7px);z-index:80;min-width:230px;padding:7px;border-radius:12px;background:#10283b;border:1px solid rgba(255,255,255,.13);box-shadow:0 18px 45px rgba(0,0,0,.42)}
.trip-more-menu-portal button{display:block;width:100%;border:0;background:transparent;color:var(--ink-text);text-align:left;padding:10px;border-radius:8px;cursor:pointer;font-size:11px}
.trip-more-menu-portal button:hover,.trip-more-menu-portal button.active{background:rgba(201,162,39,.11);color:var(--brass-light)}
@media(max-width:759px){
  .trip-more-menu-portal{position:fixed;left:12px;right:12px;top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));min-width:0;max-height:70dvh;overflow:auto;z-index:120}
}


/* Waypoint 7.0.4 iOS More bottom sheet */
.trip-more-backdrop{
  position:fixed;inset:0;z-index:109;
  background:rgba(2,10,18,.56);
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
}
.trip-more-sheet{
  position:fixed;z-index:110;
  left:50%;transform:translateX(-50%);
  width:min(92vw,360px);
  top:auto;bottom:auto;
  padding:8px;
  border-radius:14px;
  background:#10283b;
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 18px 45px rgba(0,0,0,.42);
}
.trip-more-sheet-head{display:none}
.trip-more-sheet button{
  display:block;width:100%;
  border:0;background:transparent;color:var(--ink-text);
  text-align:left;padding:10px 11px;border-radius:9px;
  cursor:pointer;font-size:11px;
}
.trip-more-sheet button:hover,.trip-more-sheet button.active{
  background:rgba(201,162,39,.11);color:var(--brass-light)
}
@media(min-width:760px){
  .trip-more-backdrop{display:none}
  .trip-more-sheet{
    position:absolute;left:auto;right:0;transform:none;
    top:calc(100% + 7px);bottom:auto;
    width:230px;
  }
}
@media(max-width:759px){
  body.trip-more-open{overflow:hidden}
  .trip-more-sheet{
    left:0;right:0;bottom:0;top:auto;transform:none;
    width:auto;max-height:78dvh;overflow:auto;
    padding:8px 12px calc(14px + env(safe-area-inset-bottom,0px));
    border-radius:22px 22px 0 0;
    border-left:0;border-right:0;border-bottom:0;
    box-shadow:0 -18px 50px rgba(0,0,0,.42);
    animation:waypointSheetUp .22s ease-out;
  }
  .trip-more-sheet-head{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:2px 2px 9px;
  }
  .trip-more-sheet-title{
    font-size:14px;font-weight:850;color:var(--paper);
  }
  .trip-more-grabber{
    width:42px;height:5px;border-radius:999px;
    background:rgba(255,255,255,.22);
    margin:2px auto 10px;
  }
  .trip-more-sheet .sheet-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:8px;
  }
  .trip-more-sheet button{
    min-height:58px;
    padding:12px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.06);
    font-size:12px;font-weight:750;
  }

    background:rgba(201,162,39,.16);

  }

    width:38px;min-height:38px;padding:0;

    font-size:18px;border-radius:11px;
  }
}
@keyframes waypointSheetUp{
  from{transform:translateY(22px);opacity:0}
  to{transform:translateY(0);opacity:1}
}


/* Waypoint 7.0.6 destination resolver */
.destination-search-row{display:flex;gap:7px;align-items:center}
.destination-search-row input{flex:1}
.destination-results{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.destination-option{
  width:100%;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  text-align:left;padding:10px 11px;border-radius:10px;cursor:pointer;
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);color:var(--ink-text)
}
.destination-option:hover,.destination-option.selected{background:rgba(201,162,39,.10);border-color:rgba(201,162,39,.25)}
.destination-option .main{font-size:11px;font-weight:800;color:var(--paper)}
.destination-option .sub{font-size:9px;color:var(--muted);margin-top:3px}
.destination-selected{
  margin-top:8px;padding:8px 10px;border-radius:9px;
  background:rgba(68,185,120,.08);border:1px solid rgba(68,185,120,.17);
  font-size:10px;color:var(--muted)
}
.destination-error{
  margin-top:8px;padding:8px 10px;border-radius:9px;
  background:rgba(220,80,80,.09);border:1px solid rgba(220,80,80,.16);
  font-size:10px;color:var(--ink-text)
}

  .destination-search-row{align-items:stretch}

}


/* Waypoint 8.0 travel intelligence */
.schedule-alert{padding:9px 10px;border-radius:10px;background:rgba(255,140,90,.09);border:1px solid rgba(255,140,90,.20);font-size:10px;margin:8px 0}

.day-tools{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 12px}
.activity-duration{font:9px var(--font-mono);color:var(--muted);margin-top:3px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calendar-cell{min-height:74px;padding:7px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
.calendar-cell .n{font:9px var(--font-mono);color:var(--muted)}
.calendar-cell.has-events{border-color:rgba(201,162,39,.22);background:rgba(201,162,39,.055)}
.doc-important{border-color:rgba(201,162,39,.25)!important;background:rgba(201,162,39,.055)!important}
.diag-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)}

.status-ok{color:#75d6a1}.status-warn{color:#f0c66d}.status-bad{color:#ff927d}

}

    grid-column:1/-1;

}

/* ===================== storage ===================== */
if (typeof window.storage === 'undefined') {
  window.storage = {
    async get(key, shared){
      const k = (shared?'shared:':'priv:') + key;
      const v = window.localStorage.getItem(k);
      if (v === null) throw new Error('not found');
      return {key, value: v, shared: !!shared};
    },
    async set(key, value, shared){
      const k = (shared?'shared:':'priv:') + key;
      window.localStorage.setItem(k, value);
      return {key, value, shared: !!shared};
    },
    async delete(key, shared){
      const k = (shared?'shared:':'priv:') + key;
      window.localStorage.removeItem(k);
      return {key, deleted: true, shared: !!shared};
    },
    async list(prefix, shared){
      const pfx = (shared?'shared:':'priv:') + (prefix||'');
      const keys = Object.keys(window.localStorage).filter(k=>k.startsWith(pfx)).map(k=>k.slice((shared?'shared:':'priv:').length));
      return {keys};
    }
  };
}

function escapeICS(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');}
function icsDate(date,time='00:00'){
  const [y,m,d]=String(date||'').split('-'),[hh,mm]=String(time||'00:00').split(':');
  if(!y||!m||!d)return '';
  return `${y}${m}${d}T${String(hh||'00').padStart(2,'0')}${String(mm||'00').padStart(2,'0')}00`;
}
function exportTripCalendar(tripId){
  const tr=tripById(tripId);if(!tr)return;
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Waypoint//Trip Calendar//EN','CALSCALE:GREGORIAN'];
  for(const d of state.itineraries[tripId]||[])for(const a of d.activities||[]){
    if(!d.date)continue;
    lines.push('BEGIN:VEVENT',`UID:${escapeICS(a.id||uid())}@waypoint`,`DTSTART;TZID=${escapeICS(tripTimezone(tr))}:${icsDate(d.date,a.time||'00:00')}`,`SUMMARY:${escapeICS(a.title||'Waypoint activity')}`,a.location?`LOCATION:${escapeICS(a.location)}`:'',`DESCRIPTION:${escapeICS(tr.name||'')}`,'END:VEVENT');
  }
  for(const b of state.bookings[tripId]||[]){
    if(!b.date)continue;
    lines.push('BEGIN:VEVENT',`UID:${escapeICS(b.id||uid())}@waypoint`,`DTSTART;TZID=${escapeICS(tripTimezone(tr))}:${icsDate(b.date,b.time||'00:00')}`,`SUMMARY:${escapeICS(b.title||b.provider||'Waypoint booking')}`,b.location?`LOCATION:${escapeICS(b.location)}`:'',`DESCRIPTION:${escapeICS(b.confirmation?`Confirmation: ${b.confirmation}`:'')}`,'END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  const blob=new Blob([lines.filter(Boolean).join('\r\n')],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${safeFilename(tr.name||'waypoint-trip')}.ics`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ===================== image resize ===================== */
function resizeImageFile(file, maxSize, cb){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      let w=img.width, h=img.height;
      if(w>=h){ if(w>maxSize){ h=Math.round(h*maxSize/w); w=maxSize; } } else { if(h>maxSize){ w=Math.round(w*maxSize/h); h=maxSize; } }
      const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg',0.85));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function searchDestinationCandidates(autoSave=false){
  const input=document.getElementById('f-dest');
  const results=document.getElementById('destination-results');
  if(!input||!results)return false;
  const q=String(input.value||'').trim();
  const es=state.lang==='es';
  if(q.length<2){
    results.innerHTML=`<div class="destination-error">${es?'Escribe al menos 2 caracteres.':'Enter at least 2 characters.'}</div>`;
    return false;
  }
  results.innerHTML=`<div class="field-hint">${es?'Buscando ubicaciones…':'Searching locations…'}</div>`;
  try{
    const r=await fetch(`/api/destination/search?q=${encodeURIComponent(q)}`,{cache:'no-store'});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||j.error)throw new Error(j.error||'search failed');
    const rows=Array.isArray(j.results)?j.results:[];
    if(!rows.length){
      results.innerHTML=`<div class="destination-error">${es?'No encontramos una coincidencia. Prueba con ciudad + país, por ejemplo “Medellín, Colombia”.':'No match found. Try city + country, for example “Medellín, Colombia”.'}</div>`;
      return false;
    }
    if(rows.length===1){
      selectDestinationCandidate(rows[0],autoSave);
      return true;
    }
    results.innerHTML=`<div class="field-hint" style="margin-bottom:3px">${es?'Selecciona la ubicación correcta:':'Select the correct location:'}</div>`+
      rows.map((x,i)=>`<button type="button" class="destination-option" onclick='selectDestinationCandidate(${JSON.stringify(x).replace(/'/g,"&#39;")},false)'>
        <div><div class="main">${escapeHtml(x.name||'')}</div><div class="sub">${escapeHtml([x.region,x.country].filter(Boolean).join(', '))}</div></div>
        <span>›</span>
      </button>`).join('');
    if(autoSave){
      results.insertAdjacentHTML('afterbegin',`<div class="destination-error">${es?'Hay varias coincidencias. Elige una antes de guardar el viaje.':'There are multiple matches. Choose one before saving the trip.'}</div>`);
    }
    return false;
  }catch(e){
    results.innerHTML=`<div class="destination-error">${es?'No se pudo validar el destino en este momento. Revisa la conexión e inténtalo nuevamente.':'Could not validate the destination right now. Check your connection and try again.'}</div>`;
    return false;
  }
}

async function saveTripForm(destinationResolved=false){
  const editingId=ui.editingTrip||null;
  const existingBefore=editingId?tripById(editingId):null;
  const previousDestination=String(existingBefore?.destination||'');
  const previousLat=Number(existingBefore?.destinationLat);
  const previousLon=Number(existingBefore?.destinationLon);
  if(existingBefore&&collabRole(existingBefore)==='viewer'){
    showToast(state.lang==='es'?'Este viaje es solo lectura.':'This trip is view-only.');
    return;
  }
  const g=id=>document.getElementById(id)?.value||'';
  const typedDestination=g('f-dest').trim();
  const latRaw=g('f-dest-lat'),lonRaw=g('f-dest-lon');
  const lat=latRaw===''?NaN:Number(latRaw),lon=lonRaw===''?NaN:Number(lonRaw);
  const hasResolved=Number.isFinite(lat)&&Number.isFinite(lon);
  const existingStillMatches=Boolean(
    existingBefore&&typedDestination===previousDestination&&
    Number.isFinite(previousLat)&&Number.isFinite(previousLon)
  );

  if(typedDestination&&!hasResolved&&!existingStillMatches&&!destinationResolved){
    const unique=await searchDestinationCandidates(true);
    if(!unique)return;
    return;
  }
  if(typedDestination&&!hasResolved&&!existingStillMatches){
    showToast(state.lang==='es'?'Selecciona una ubicación válida antes de guardar.':'Select a valid destination before saving.');
    return;
  }

  const resolvedLat=hasResolved?lat:previousLat;
  const resolvedLon=hasResolved?lon:previousLon;
  const canonical=g('f-dest-canonical').trim()||typedDestination;
  const data={
    name:g('f-name').trim()||(state.lang==='es'?'Viaje sin nombre':'Untitled trip'),
    destination:typedDestination,
    destinationCanonical:canonical,
    destinationName:g('f-dest-name').trim()||existingBefore?.destinationName||'',
    destinationRegion:g('f-dest-region').trim()||existingBefore?.destinationRegion||'',
    destinationCountry:g('f-dest-country').trim()||existingBefore?.destinationCountry||'',
    destinationLat:resolvedLat,
    destinationLon:resolvedLon,
    tripType:g('f-type'),
    start:g('f-start'),
    end:g('f-end'),
    budgetGoal:parseFloat(g('f-budget'))||0,
    currency:readCurrencyField('f-currency')||'USD',
    passportExpiry:g('f-passport'),
    timezone:g('f-timezone').trim(),
    localCurrency:g('f-local-currency').trim().toUpperCase(),
    localLanguage:g('f-language').trim(),
    emergencyInfo:g('f-emergency').trim(),
    powerInfo:g('f-power').trim(),
    notes:g('f-notes').trim()
  };

  let savedTrip;
  if(editingId){
    savedTrip=tripById(editingId);
    Object.assign(savedTrip,data);
  }else{
    savedTrip={...data,id:uid(),coverPhoto:ui.newTripCover||''};
    state.trips.push(savedTrip);
    ui.newTripCover='';
  }

  const destinationChanged=Boolean(
    editingId&&savedTrip&&(
      savedTrip.destination!==previousDestination||
      Number(savedTrip.destinationLat)!==previousLat||
      Number(savedTrip.destinationLon)!==previousLon
    )
  );
  if(destinationChanged){
    savedTrip.timezone='';
    savedTrip.localCurrency='';
    savedTrip.localLanguage='';
    savedTrip.emergencyInfo='';
    savedTrip.powerInfo='';
    delete savedTrip.autoTimezone;
    delete savedTrip.autoPractical;
    delete savedTrip.resolvedLocation;
    delete savedTrip.detectedCountry;
    delete savedTrip.practicalUpdatedAt;
    if(ui.weatherCache)delete ui.weatherCache[savedTrip.id];
  }

  ui.modal=null;
  ui.editingTrip=null;
  await saveState();
  render();

  if(savedTrip?.destination&&(destinationChanged||!savedTrip.autoPractical)){
    setTimeout(()=>loadTripWeather(savedTrip.id,true),80);
  }
}
function duplicateTrip(id){

  ['shareId','editKey','viewKey','ownerKey','syncServer','syncRevision','lastSyncedAt','collabParticipants','collabParticipantId','collabParticipantName','chatUnread','collabDeleted'].forEach(k=>delete copy[k]);

  state.reminders[newId]={enabled:false,leadMinutes:30};state.categoryBudgets[newId]=JSON.parse(JSON.stringify(state.categoryBudgets[id]||{}));
  state.expenses.push(...state.expenses.filter(e=>e.tripId===id).map(e=>({...JSON.parse(JSON.stringify(e)),id:uid(),tripId:newId})));
  state.settlements.push(...state.settlements.filter(e=>e.tripId===id).map(e=>({...JSON.parse(JSON.stringify(e)),id:uid(),tripId:newId})));
  saveState();render();showToast(state.lang==='es'?'Viaje duplicado como plantilla':'Trip duplicated as a template');

async function copyTextRobust(text){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}
  try{
    const ta=document.createElement('textarea');
    ta.value=text; ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.left='-9999px'; ta.style.top='0';
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,ta.value.length);
    const ok=document.execCommand('copy'); ta.remove();
    return !!ok;
  }catch(e){ return false; }
}

function downloadEditableItinerary(id){
  const tr=tripById(id); if(!tr) return;
  const payload=buildItineraryPayload(tr);
  const json=JSON.stringify(payload,null,2);
  const slug=(tr.name||'trip').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')||'trip';
  const blob=new Blob([json],{type:'application/json'});
  downloadItineraryBlob(blob,`${slug}-itinerary.json`,true);
}
function ensureShareId(tr){
  if(!tr.shareId){ tr.shareId = 'wp-'+uid(); saveState(); }
  return tr.shareId;
}
function buildItineraryPayload(tr){
  return {
    waypointShare: 3,

function waypointLang(){

  const htmlLang=String(document.documentElement.lang||'').toLowerCase();
  if(htmlLang.startsWith('es')) return 'es';

async function loadGiphyResults(query){
  const grid=document.getElementById('gif-grid'); if(!grid)return;
  const es=state.lang==='es';
  grid.innerHTML=`<div class="gif-loading">${es?'Cargando GIFs…':'Loading GIFs…'}</div>`;

  }

    const base=q?'https://api.giphy.com/v1/gifs/search':'https://api.giphy.com/v1/gifs/trending';
    const p=new URLSearchParams({api_key:cfg.apiKey,limit:'18',rating:'pg',lang:state.lang==='es'?'es':'en',customer_id:giphyCustomerId()});
    if(q)p.set('q',q);

      return;
    }

      const src=g.images?.fixed_width_small?.url||g.images?.fixed_width?.url||g.images?.downsized?.url||'';
      return `<button type="button" class="gif-item" onclick="sendChatGif('${ui.chatTripId}',${i})" aria-label="${escapeHtml(g.title||'GIF')}"><img loading="lazy" src="${escapeHtml(src)}" alt="${escapeHtml(g.title||'GIF')}"></button>`;
    }).join('');
  }catch(e){
    console.error('GIPHY search failed',e);
    grid.innerHTML=`<div class="gif-empty">${es?'No se pudieron cargar los GIFs. Inténtalo de nuevo.':'Could not load GIFs. Try again.'}</div>`;
  }
}


async function resolveChatGifs(){
  const ids=[...new Set((ui.chatMessages||[]).filter(m=>m.kind==='gif'&&m.gifId).map(m=>m.gifId))];
  if(!ids.length)return;
  const cfg=await getGiphyConfig();
  if(!cfg.enabled||!cfg.apiKey)return;
  ui.chatGifMap=ui.chatGifMap||{};
  const missing=ids.filter(id=>!ui.chatGifMap[id]).slice(0,100);
  if(!missing.length)return;
  try{
    const p=new URLSearchParams({api_key:cfg.apiKey,ids:missing.join(','),rating:'pg',customer_id:giphyCustomerId()});
    const r=await fetch(`https://api.giphy.com/v1/gifs?${p.toString()}`);
    const j=await r.json();
    for(const g of (j.data||[])){
      ui.chatGifMap[g.id]={url:g.images?.fixed_width?.url||g.images?.downsized?.url||g.images?.original?.url||'',alt:g.title||'GIF'};
    }
    renderChatMessagesInPlace();
  }catch(e){console.error('GIPHY resolve failed',e);}
}
async function sendChatGif(tripId,index){
  const tr=tripById(tripId), g=(ui.chatGifSearchResults||[])[index];
  if(!tr||!g||ui.chatSending||collabRole(tr)==='viewer')return;
  const participantId=tr.collabParticipantId||chatParticipantId();
  const clientMessageId='c-'+randomKey();
  ui.chatSending=true;
  try{
    const r=await fetch(`${tr.syncServer}/api/trips/${encodeURIComponent(tr.shareId)}/chat`,{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Edit-Key':tr.editKey},
      body:JSON.stringify({kind:'gif',gifId:g.id,gifTitle:String(g.title||'GIF').slice(0,160),participantId,clientMessageId,replyToId:ui.chatReplyTo?.id||null})
    });
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||`chat ${r.status}`);
    ui.chatGifMap=ui.chatGifMap||{};
    ui.chatGifMap[g.id]={url:g.images?.fixed_width?.url||g.images?.downsized?.url||g.images?.original?.url||'',alt:g.title||'GIF'};
    if(j.message)ui.chatMessages=[...(ui.chatMessages||[]).filter(x=>x.id!==j.message.id),j.message];
    ui.chatReplyTo=null; closeChatMediaPickers(); renderChatMessagesInPlace();
  }catch(e){
    console.error(e); showToast(state.lang==='es'?'No se pudo enviar el GIF.':'Could not send the GIF.');
  }finally{ui.chatSending=false;}
}

function chatDayLabel(iso){
  try{
    const d=new Date(iso), now=new Date();
    const a=new Date(d.getFullYear(),d.getMonth(),d.getDate()), b=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    const diff=Math.round((b-a)/86400000);
    if(diff===0) return state.lang==='es'?'Hoy':'Today';
    if(diff===1) return state.lang==='es'?'Ayer':'Yesterday';
    return d.toLocaleDateString(state.lang==='es'?'es-ES':'en-US',{month:'short',day:'numeric',year:d.getFullYear()!==now.getFullYear()?'numeric':undefined});
  }catch(e){return '';}
}

function chatHubItems(messages,activity){

function chatReadersForMessage(tr,m){
  const me=tr?.collabParticipantId||chatParticipantId();
  const created=Date.parse(m?.createdAt||0);
  if(!created)return [];
  return (tr?.collabParticipants||[]).filter(p=>{
    if(!p||p.participantId===me)return false;
    const read=Date.parse(p.lastReadAt||0);
    return read>=created;
  });
}
function chatReadReceiptHtml(tr,m,es){
  if(!tr||m.participantId!==(tr.collabParticipantId||chatParticipantId()))return '';
  const readers=chatReadersForMessage(tr,m);
  if(!readers.length)return `<div class="chat-status">${es?'Enviado':'Sent'} ✓</div>`;
  const names=readers.map(x=>x.name).filter(Boolean);
  const others=(tr.collabParticipants||[]).filter(p=>p.participantId!==(tr.collabParticipantId||chatParticipantId()));
  if(others.length>0&&readers.length>=others.length){
    return `<div class="chat-read"><span class="checks">✓✓</span>${es?'Leído por todos':'Read by everyone'}</div>`;
  }
  const shown=names.slice(0,2).join(', ');
  const extra=names.length>2?` +${names.length-2}`:'';
  return `<div class="chat-read"><span class="checks">✓✓</span>${es?'Leído por':'Read by'} ${escapeHtml(shown)}${extra}</div>`;
}

async function compressChatPhoto(file){
  const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});
  const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=data;});
  const max=1000, scale=Math.min(1,max/Math.max(img.width,img.height)), w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
  let out=c.toDataURL('image/jpeg',.72);
  if(out.length>390000)out=c.toDataURL('image/jpeg',.48);
  if(out.length>440000)throw new Error('too large');
  return out;
}

async function loadTripChat(tripId,quiet=false){

  try{
    const accessKey=collabAccessKey(tr);
    const r=await fetch(`${tr.syncServer}/api/trips/${encodeURIComponent(tr.shareId)}/chat?key=${encodeURIComponent(accessKey)}`,{cache:'no-store'});
    if(r.status===404){ showToast(state.lang==='es'?'Este viaje ya no se comparte.':'This trip is no longer shared.'); return false; }
    if(!r.ok) throw new Error('chat '+r.status);
    const j=await r.json();
    ui.chatTripId=tripId; ui.chatMessages=Array.isArray(j.messages)?j.messages:[]; ui.chatActivity=Array.isArray(j.activity)?j.activity:[]; ui.chatLoading=false; ui.chatError='';
    tr.chatUnread=0;

    await markTripChatRead(tripId);

  }catch(e){

async function sendTripChat(tripId){

  if(!tr||!input||ui.chatSending||collabRole(tr)==='viewer') return;

      method:'POST',headers:{'Content-Type':'application/json','X-Edit-Key':tr.editKey},

    renderChatMessagesInPlace();

function participantRoleLabel(role,es){
  if(role==='owner')return es?'Propietario':'Owner';
  if(role==='viewer')return es?'Solo lectura':'Viewer';
  return es?'Editor':'Editor';
}
function participantInitials(name){
  const parts=String(name||'?').trim().split(/\s+/).filter(Boolean);
  return (parts.slice(0,2).map(x=>x[0]).join('')||'?').toUpperCase();
}
function participantLastSeenLabel(value,es){
  const ts=Date.parse(value||''); if(!Number.isFinite(ts))return es?'Sin actividad reciente':'No recent activity';
  const diff=Math.max(0,Date.now()-ts);
  if(diff<90000)return es?'Activo ahora':'Active now';
  const mins=Math.floor(diff/60000);
  if(mins<60)return es?`Hace ${mins} min`:`${mins} min ago`;
  const hrs=Math.floor(mins/60);
  if(hrs<24)return es?`Hace ${hrs} h`:`${hrs}h ago`;
  const days=Math.floor(hrs/24);
  if(days<30)return es?`Hace ${days} d`:`${days}d ago`;
  try{return new Intl.DateTimeFormat(es?'es':'en',{month:'short',day:'numeric',year:'numeric'}).format(new Date(ts));}catch(e){return '';}
}

async function createIndividualInvite(tripId,role='viewer'){
  const tr=tripById(tripId);if(!tr?.collabOwner)return;
  const es=state.lang==='es';
  const label=(prompt(es?'Nombre o etiqueta para esta invitación:':'Name or label for this invitation:','')||'').trim().slice(0,60);
  if(!label)return;
  const days=Number(prompt(es?'¿Cuántos días debe durar? (0 = sin vencimiento)':'How many days should it last? (0 = no expiration)','7')||7);
  try{
    const r=await fetch(`${tr.syncServer}/api/trips/${encodeURIComponent(tr.shareId)}/invites`,{method:'POST',headers:{'Content-Type':'application/json','X-Owner-Key':tr.ownerKey},body:JSON.stringify({label,role,expiresDays:Math.max(0,Math.min(365,days))})});
    const j=await r.json();if(!r.ok)throw new Error(j.error||'invite');
    const base=location.origin+location.pathname;
    const link=`${base}#collab=${encodeURIComponent(tr.shareId)}&key=${encodeURIComponent(j.token)}&server=${encodeURIComponent(tr.syncServer)}`;
    try{if(navigator.share)await navigator.share({title:tr.name,text:`Waypoint · ${label}`,url:link});else await copyTextRobust(link);}catch(e){if(e?.name!=='AbortError')await copyTextRobust(link);}
    showToast(es?'Invitación individual creada.':'Individual invitation created.');
    await refreshTripParticipants(tripId);
  }catch(e){showToast(es?'No se pudo crear la invitación.':'Could not create invitation.');}
}

async function stopLiveCollaboration(tripId){
  const tr=tripById(tripId); if(!tr) return;
  const es=waypointLang()==='es';
  if(!tr.collabOwner||!tr.ownerKey){
    showToast(es?'Solo el propietario puede desactivar el enlace compartido.':'Only the owner can disable the shared link.');
    return;
  }
  if(!confirm(es?'¿Dejar de compartir este viaje? El enlace actual dejará de funcionar para todos los participantes. Tu copia local se conservará.':'Stop sharing this trip? The current link will stop working for every participant. Your local copy will be kept.')) return;
  try{
    const r=await fetch(`${tr.syncServer}/api/trips/${encodeURIComponent(tr.shareId)}`,{
      method:'DELETE',
      headers:{'X-Owner-Key':tr.ownerKey}
    });
    if(!r.ok) throw new Error('revoke '+r.status);
    closeLiveStream(tr.id);
    tr.liveSync=false; tr.collabOwner=false;
    delete tr.editKey; delete tr.viewKey; delete tr.ownerKey; delete tr.syncServer; delete tr.syncRevision; delete tr.lastSyncedAt;
    delete tr.shareId; delete tr.collabParticipants; delete tr.chatUnread; delete tr.collabRole;
    await saveState(); render();
    showToast(es?'Colaboración desactivada. El enlace anterior ya no funciona.':'Collaboration stopped. The previous link no longer works.');
  }catch(e){
    console.error(e);
    showToast(es?'No se pudo desactivar la colaboración.':'Could not stop collaboration.');
  }
}
async function leaveLiveCollaboration(tripId){
  const tr=tripById(tripId); if(!tr) return;

  if(!confirm(es?'¿Salir de este viaje compartido? Conservarás una copia local, pero dejará de sincronizarse.':'Leave this shared trip? You will keep a local copy, but it will stop syncing.')) return;

  delete tr.editKey; delete tr.viewKey; delete tr.ownerKey; delete tr.syncServer; delete tr.syncRevision; delete tr.lastSyncedAt;
  delete tr.shareId; delete tr.collabParticipants; delete tr.chatUnread; delete tr.collabRole;
  await saveState(); render();
  showToast(es?'Saliste de la colaboración.':'You left the collaboration.');
}

async function startLiveCollaboration(tripId){
  const tr=tripById(tripId); if(!tr) return;
  const es=waypointLang()==='es';
  const participantName=ensureChatName(tripId);
  if(!participantName) return;

  if(tr.liveSync&&tr.syncServer&&tr.shareId&&collabAccessKey(tr)){
    await shareCollaborationRole(tripId,collabRole(tr)==='viewer'?'viewer':'editor');
    return;
  }

  let server=tr.syncServer||collabServer();
  if(!server){server=prompt(es?'Ingresa la URL de tu servidor Waypoint Sync:':'Enter your Waypoint Sync server URL:','')||'';}
  server=server.trim().replace(/\/$/,''); if(!server)return;

  setCollabServer(server);
  ensureShareId(tr);
  tr.editKey=tr.editKey||randomKey();
  tr.viewKey=tr.viewKey||randomKey();
  tr.ownerKey=tr.ownerKey||randomKey();
  tr.collabOwner=true; tr.collabRole='owner';
  tr.collabParticipantName=participantName;
  tr.collabParticipantId=tr.collabParticipantId||chatParticipantId();
  tr.syncServer=server;
  tr.liveSync=true;
  tr.syncRevision=Number(tr.syncRevision||0);

  await window.storage.set('waypoint-simple-data',JSON.stringify(state),false);
  const ok=await pushTripToCloud(tr,false); if(!ok)return;
  await registerCollabParticipant(tr);
  ensureLiveStream(tr);
  await shareCollaborationRole(tripId,'editor');
  render();
}

    },

function uniqById(remote,local){
  const m=new Map();
  (remote||[]).forEach(x=>x&&x.id&&m.set(x.id,JSON.parse(JSON.stringify(x))));
  (local||[]).forEach(x=>x&&x.id&&m.set(x.id,JSON.parse(JSON.stringify(x))));
  return [...m.values()];
}
function unionIds(a,b){ return [...new Set([...(a||[]),...(b||[])])]; }
function mergeLivePayload(local,remote){
  local=local||{}; remote=remote||{};
  const deleted={
    days:unionIds(remote.deleted&&remote.deleted.days,local.deleted&&local.deleted.days),
    activities:unionIds(remote.deleted&&remote.deleted.activities,local.deleted&&local.deleted.activities),
    bookings:unionIds(remote.deleted&&remote.deleted.bookings,local.deleted&&local.deleted.bookings),
    expenses:unionIds(remote.deleted&&remote.deleted.expenses,local.deleted&&local.deleted.expenses),
    checklists:unionIds(remote.deleted&&remote.deleted.checklists,local.deleted&&local.deleted.checklists),
    docs:unionIds(remote.deleted&&remote.deleted.docs,local.deleted&&local.deleted.docs),
    ideas:unionIds(remote.deleted&&remote.deleted.ideas,local.deleted&&local.deleted.ideas),
    polls:unionIds(remote.deleted&&remote.deleted.polls,local.deleted&&local.deleted.polls)
  };
  const remoteDays=remote.days||[], localDays=local.days||[];
  const byDay=new Map();
  remoteDays.forEach(d=>{if(d&&d.id)byDay.set(d.id,JSON.parse(JSON.stringify(d)));});
  localDays.forEach(d=>{
    if(!d||!d.id)return;
    const prev=byDay.get(d.id)||{};
    const merged=Object.assign({},prev,JSON.parse(JSON.stringify(d)));
    merged.activities=uniqById(prev.activities||[],d.activities||[]).filter(a=>!deleted.activities.includes(a.id));
    merged.activities.sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
    byDay.set(d.id,merged);
  });
  const days=[...byDay.values()].filter(d=>!deleted.days.includes(d.id));
  const bookings=uniqById(remote.bookings||[],local.bookings||[]).filter(b=>!deleted.bookings.includes(b.id));
  const expenses=uniqById(remote.expenses||[],local.expenses||[]).filter(e=>!deleted.expenses.includes(e.id));
  const settlements=uniqById(remote.settlements||[],local.settlements||[]);
  const categoryBudgets=Object.assign({},remote.categoryBudgets||{},local.categoryBudgets||{});
  const checklists=uniqById(remote.checklists||[],local.checklists||[]).filter(i=>!deleted.checklists.includes(i.id));
  const docs=uniqById(remote.docs||[],local.docs||[]).filter(d=>!deleted.docs.includes(d.id));
  const ideas=uniqById(remote.ideas||[],local.ideas||[]).filter(d=>!deleted.ideas.includes(d.id));
  const polls=uniqById(remote.polls||[],local.polls||[]).filter(d=>!deleted.polls.includes(d.id));
  return {
    waypointLive:3,
    shareId:local.shareId||remote.shareId,
    trip:Object.assign({},remote.trip||{},local.trip||{}),
    days,bookings,expenses,settlements,categoryBudgets,checklists,docs,ideas,polls,
    reminders:Object.assign({},remote.reminders||{},local.reminders||{}),
    deleted
  };
}
function applyLivePayload(tr,d){
  d=d||{};
  Object.assign(tr,d.trip||{});
  tr.collabDeleted=d.deleted||tr.collabDeleted||{days:[],activities:[],bookings:[],expenses:[],checklists:[],docs:[],ideas:[],polls:[]};
  state.itineraries[tr.id]=d.days||[];
  state.bookings[tr.id]=d.bookings||[];
  const remoteExpenses=(d.expenses||[]).map(e=>({...e,tripId:tr.id}));
  state.expenses=[...(state.expenses||[]).filter(e=>e.tripId!==tr.id),...remoteExpenses];
  const remoteSettlements=(d.settlements||[]).map(e=>({...e,tripId:tr.id}));
  state.settlements=[...(state.settlements||[]).filter(e=>e.tripId!==tr.id),...remoteSettlements];
  state.categoryBudgets[tr.id]=d.categoryBudgets||state.categoryBudgets[tr.id]||{};
  state.checklists[tr.id]=d.checklists||[];
  state.tripDocs[tr.id]=d.docs||[];
  state.ideas[tr.id]=d.ideas||[];
  state.polls[tr.id]=d.polls||[];
  state.reminders[tr.id]=d.reminders||state.reminders[tr.id]||{enabled:false,leadMinutes:30};
}
let syncBusy=false, syncDebounce=null, syncPoll=null;

let liveStreams=new Map();
function closeLiveStream(tripId){
  const es=liveStreams.get(tripId);
  if(es){ try{es.close();}catch(e){} liveStreams.delete(tripId); }
}
function ensureLiveStream(tr){
  if(!tr||!tr.liveSync||!tr.syncServer||!tr.shareId||!collabAccessKey(tr)||typeof EventSource==='undefined') return;
  if(liveStreams.has(tr.id)) return;
  try{
    const url=`${tr.syncServer}/api/trips/${encodeURIComponent(tr.shareId)}/events?key=${encodeURIComponent(collabAccessKey(tr))}`;
    const es=new EventSource(url);
    liveStreams.set(tr.id,es);
    es.addEventListener('revision',async ev=>{
      try{
        const msg=JSON.parse(ev.data||'{}');
        if(Number(msg.revision||0)>Number(tr.syncRevision||0)) await pullTripFromCloud(tr);
      }catch(e){}
    });
    es.addEventListener('chat',async ev=>{
      try{
        const msg=JSON.parse(ev.data||'{}');
        const isMine=msg.participantId===(tr.collabParticipantId||chatParticipantId());
        if(ui.modal==='tripChat'&&ui.chatTripId===tr.id){
          await loadTripChat(tr.id,true);
          if(!isMine)await markTripChatRead(tr.id);
        }else if(!isMine){
          tr.chatUnread=Math.min(99,Number(tr.chatUnread||0)+1);
          render();
        }
      }catch(e){}
    });
    es.addEventListener('read',async ()=>{
      try{
        await loadCollabParticipants(tr.id);
        if(ui.modal==='tripChat'&&ui.chatTripId===tr.id)renderChatMessagesInPlace();
      }catch(e){}
    });
    es.addEventListener('typing',ev=>{
      try{
        const data=JSON.parse(ev.data||'{}');
        if(ui.modal==='tripChat'&&ui.chatTripId===tr.id) updateTypingLine(data.names||[]);
      }catch(e){}
    });
    es.addEventListener('participants',async ()=>{
      try{
        await loadCollabParticipants(tr.id);
        if(ui.modal==='tripChat'||(ui.modal==='tripParticipants'&&ui.participantsTripId===tr.id)) render();
      }catch(e){}
    });
    es.addEventListener('activity',async ()=>{
      try{
        if(ui.modal==='tripChat'&&ui.chatTripId===tr.id) await loadTripChat(tr.id,true);
        else if(ui.screen==='trip'&&ui.currentTripId===tr.id&&ui.tripSubTab==='activity') await loadTripActivity(tr.id);
      }catch(e){}
    });
    es.onerror=()=>{
      // EventSource reconnects automatically; polling remains active as a fallback.
    };
  }catch(e){}
}
function refreshLiveStreams(){
  const active=new Set();
  state.trips.filter(x=>x.liveSync).forEach(tr=>{ active.add(tr.id); ensureLiveStream(tr); });
  [...liveStreams.keys()].forEach(id=>{ if(!active.has(id)) closeLiveStream(id); });
}

async function pushTripToCloud(tr,force=false){
  if(!tr||!tr.liveSync||!tr.syncServer||!tr.shareId||!tr.editKey||!canEditTrip(tr)) return false;
  try{
    const local=livePayload(tr);
    let r=await fetch(`${tr.syncServer}/api/trips/${encodeURIComponent(tr.shareId)}`,{method:'PUT',headers:{'Content-Type':'application/json','X-Edit-Key':tr.editKey,...(tr.ownerKey?{'X-Owner-Key':tr.ownerKey}:{}),...(tr.viewKey?{'X-View-Key':tr.viewKey}:{}),'X-Participant-Id':tr.collabParticipantId||chatParticipantId()},body:JSON.stringify({data:local,clientRevision:Number(tr.syncRevision||0),force:!!force})});
    if(r.status===409){
      const conflict=await r.json();
      const merged=mergeLivePayload(local,conflict.data||{});
      applyLivePayload(tr,merged);
      tr.syncRevision=Number(conflict.revision||0);
      r=await fetch(`${tr.syncServer}/api/trips/${encodeURIComponent(tr.shareId)}`,{method:'PUT',headers:{'Content-Type':'application/json','X-Edit-Key':tr.editKey,...(tr.ownerKey?{'X-Owner-Key':tr.ownerKey}:{}),...(tr.viewKey?{'X-View-Key':tr.viewKey}:{}),'X-Participant-Id':tr.collabParticipantId||chatParticipantId()},body:JSON.stringify({data:merged,clientRevision:tr.syncRevision,force:false})});
    }
    if(!r.ok) throw new Error('sync '+r.status);
    const j=await r.json();
    tr.syncRevision=j.revision||tr.syncRevision;
    tr.lastSyncedAt=new Date().toISOString(); tr.pendingSync=false;
    await window.storage.set('waypoint-simple-data',JSON.stringify(state),false);
    return true;
  }catch(e){ console.error(e); showToast(state.lang==='es'?'No se pudo sincronizar con la nube':'Cloud sync failed'); return false; }
}
async function pullTripFromCloud(tr){
  if(!tr||!tr.liveSync||!tr.syncServer||!tr.shareId||!collabAccessKey(tr)) return false;
  try{
    const r=await fetch(`${tr.syncServer}/api/trips/${encodeURIComponent(tr.shareId)}?key=${encodeURIComponent(collabAccessKey(tr))}`);
    if(r.status===404){
      closeLiveStream(tr.id);
      tr.liveSync=false; tr.collabOwner=false;
      delete tr.editKey; delete tr.viewKey; delete tr.ownerKey; delete tr.syncServer; delete tr.syncRevision; delete tr.shareId; delete tr.collabRole;
      await saveState(); render();
      showToast(state.lang==='es'?'El propietario dejó de compartir este viaje. Conservas una copia local.':'The owner stopped sharing this trip. You still have a local copy.');
      return false;
    }
    if(!r.ok) throw new Error('pull '+r.status); const j=await r.json();
    if(Number(j.revision||0)>Number(tr.syncRevision||0)){
      const d=j.data||{}; applyLivePayload(tr,d); tr.syncRevision=j.revision; tr.lastSyncedAt=new Date().toISOString(); await window.storage.set('waypoint-simple-data',JSON.stringify(state),false); render(); showToast(state.lang==='es'?'Cambios colaborativos actualizados':'Collaborative changes updated');
    }
    return true;
  }catch(e){ return false; }
}
async function syncTripNow(id){ const tr=tripById(id); if(!tr) return; await pullTripFromCloud(tr); if(canEditTrip(tr))await pushTripToCloud(tr); render(); }
async function syncAllLiveTrips(){ if(syncBusy) return; syncBusy=true; try{ for(const tr of state.trips.filter(x=>x.liveSync)) await pullTripFromCloud(tr); }finally{syncBusy=false;} }
async function handleCollabLink(){
  const h=new URLSearchParams(location.hash.replace(/^#/,''));
  const shareId=h.get('collab'), key=h.get('key'), requestedRole=h.get('role')==='viewer'?'viewer':'editor', server=(h.get('server')||'').replace(/\/$/,'');
  if(!shareId||!key||!server) return;
  setCollabServer(server);
  const es=waypointLang()==='es';
  try{
    const r=await fetch(`${server}/api/trips/${encodeURIComponent(shareId)}?key=${encodeURIComponent(key)}`);
    if(!r.ok) throw new Error('join');
    const j=await r.json(); const d=j.data||{}; const role=j.accessRole||requestedRole;
    let tr=state.trips.find(x=>x.shareId===shareId);
    if(!tr){
      const id=uid();
      tr={id,name:(d.trip&&d.trip.name)||'Shared trip',destination:(d.trip&&d.trip.destination)||'',tripType:(d.trip&&d.trip.tripType)||'',start:(d.trip&&d.trip.start)||'',end:(d.trip&&d.trip.end)||'',budgetGoal:0,currency:state.profile.currency||'USD',passportExpiry:'',notes:'',coverPhoto:'',shareId};
      state.trips.push(tr);
    }
    applyLivePayload(tr,d);
    delete tr.editKey; delete tr.viewKey;
    if(role==='viewer')tr.viewKey=key; else tr.editKey=key;
    tr.collabRole=role; tr.syncServer=server; tr.liveSync=true; tr.collabOwner=false;
    tr.syncRevision=j.revision||0; tr.lastSyncedAt=new Date().toISOString();
    tr.collabParticipantId=tr.collabParticipantId||chatParticipantId();

  }catch(e){

async function shareItineraryFile(tripId){
  const t=tt();
  const tr = tripById(tripId);
  if(!tr) return;
  const payload = buildItineraryPayload(tr);
  const json = JSON.stringify(payload, null, 2);
  const slug = (tr.name||'trip').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'trip';
  const filename = `${slug}-itinerary.json`;
  const blob = new Blob([json], {type:'application/json'});
  let file=null;
  try{ file = new File([blob], filename, {type:'application/json'}); }catch(e){}
  try{
    if(file && navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:t.itinerary.shareTitle.replace('{name}', tr.name), text:t.itinerary.shareText});
      return;
    }
  }catch(e){
    if(e && e.name==='AbortError') return;
  }
  const summary = `${t.itinerary.shareTitle.replace('{name}',tr.name)}\n${tr.destination||''}\n${tr.start||''} → ${tr.end||''}`;
  try{
    if(navigator.share){
      await navigator.share({title:tr.name,text:summary});
      downloadItineraryBlob(blob,filename,false);
      showToast(state.lang==='es'?'También se descargó el archivo editable del itinerario':'The editable itinerary file was also downloaded');
      return;
    }
  }catch(e){
    if(e && e.name==='AbortError') return;
  }
  const ok=downloadItineraryBlob(blob,filename,true);
  if(!ok) openShareFallback(tr.name, summary+'\n\n'+json);
}
function downloadItineraryBlob(blob,filename,notify=true){
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=filename; a.style.display='none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    if(notify) showToast(tt().itinerary.fileSaved);
    return true;
  }catch(e){ return false; }
}

function deleteTrip(id){
  ui.modal=null;
  const t=tt();
  askConfirm(t.home.confirmDelete, ()=>doDeleteTrip(id), true);
}
function doDeleteTrip(id){
  const t=tt();
  const idx = state.trips.findIndex(x=>x.id===id);
  if(idx===-1) return;
  const removedTrip = state.trips[idx];
  const removedExpenses=state.expenses.filter(x=>x.tripId===id);
  const removedSettlements=state.settlements.filter(x=>x.tripId===id);
  const removedCategoryBudgets=state.categoryBudgets[id];
  const removedChecklist=state.checklists[id];
  const removedItin = state.itineraries[id];
  const removedDocs = state.tripDocs[id];
  const removedBookings=state.bookings[id];
  const removedIdeas=state.ideas[id], removedPolls=state.polls[id], removedReminders=state.reminders[id];
  state.trips = state.trips.filter(x=>x.id!==id);
  state.expenses=state.expenses.filter(x=>x.tripId!==id);
  state.settlements=state.settlements.filter(x=>x.tripId!==id);
  delete state.categoryBudgets[id];delete state.checklists[id];delete state.itineraries[id];delete state.tripDocs[id];delete state.bookings[id];delete state.ideas[id];delete state.polls[id];delete state.reminders[id];
  if(ui.currentTripId===id){ ui.screen='home'; ui.currentTripId=null; }
  saveState(); render();
  showToast(t.home.deleted, ()=>{
    state.trips.splice(idx,0,removedTrip);
    state.expenses.push(...removedExpenses);
    state.settlements.push(...removedSettlements);
    if(removedCategoryBudgets)state.categoryBudgets[id]=removedCategoryBudgets;
    if(removedChecklist)state.checklists[id]=removedChecklist;
    if(removedItin) state.itineraries[id]=removedItin;
    if(removedDocs) state.tripDocs[id]=removedDocs;
    if(removedBookings)state.bookings[id]=removedBookings;
    if(removedIdeas)state.ideas[id]=removedIdeas;if(removedPolls)state.polls[id]=removedPolls;if(removedReminders)state.reminders[id]=removedReminders;
    saveState(); render();
  });
}

/* currency select helper */
function currencySelectHtml(id, selected){
  const opts = CURRENCIES.map(c=>{
    const label = `${c.flag} ${c.code} — ${state.lang==='es'?c.es:c.en}`;
    return `<option value="${c.code}" ${selected===c.code?'selected':''}>${label}</option>`;
  }).join('');
  const otherLabel = state.lang==='es'? '✎ Otra (escribir código)':'✎ Other (type code)';
  const isOther = selected && !CURRENCIES.some(c=>c.code===selected);
  return `<select id="${id}" onchange="handleCurrencySelect('${id}')">
    ${opts}<option value="OTHER" ${isOther?'selected':''}>${otherLabel}</option>
  </select>
  <input id="${id}-custom" placeholder="${state.lang==='es'?'Código, ej. THB':'Code, e.g. THB'}" maxlength="4"
    style="text-transform:uppercase;margin-top:8px;display:${isOther?'block':'none'};" value="${isOther?escapeHtml(selected):''}">`;
}
function handleCurrencySelect(id){
  const sel = document.getElementById(id); const custom = document.getElementById(id+'-custom');
  if(!sel||!custom) return;
  custom.style.display = sel.value==='OTHER'? 'block':'none';
  if(sel.value==='OTHER') custom.focus();
}
function readCurrencyField(id){
  const sel = document.getElementById(id); if(!sel) return 'USD';
  if(sel.value==='OTHER'){ const c=document.getElementById(id+'-custom'); return (c&&c.value.trim().toUpperCase())||'USD'; }
  return sel.value;
}
