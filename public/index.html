function timeToMinutes(value){
  const t=normalizeTime24(value);const m=t.match(/^(\d{2}):(\d{2})$/);return m?Number(m[1])*60+Number(m[2]):null;
}
function activityDurationMinutes(a){return Math.max(0,Number(a?.durationMinutes||60));}
function scheduleConflicts(tr,date){
  const items=tripTimelineItems(tr,date).filter(x=>x.time);
  const out=[];
  for(let i=0;i<items.length-1;i++){
    const a=items[i],b=items[i+1],start=timeToMinutes(a.time),next=timeToMinutes(b.time);
    if(start==null||next==null)continue;
    const dur=Math.max(0,Number(a.durationMinutes||(a.kind==='activity'?60:0)));
    const buffer=Math.max(0,Number(a.travelBufferMinutes||0));
    const end=start+dur+buffer;
    if(end>next)out.push({a,b,minutes:end-next});
  }
  return out;
}
function countdownToTrip(tr){
  if(!tr?.start)return null;
  const now=new Date(),start=new Date(`${tr.start}T00:00:00`);
  const diff=start-now;
  if(diff>0)return {kind:'before',days:Math.ceil(diff/86400000)};
  if(tr.end){
    const end=new Date(`${tr.end}T23:59:59`);
    if(now<=end){
      const day=Math.max(1,Math.floor((now-start)/86400000)+1);
      const total=Math.max(1,Math.floor((end-start)/86400000)+1);
      return {kind:'during',day,total};
    }
    return {kind:'after',days:Math.floor((now-end)/86400000)};
  }
  return null;
}
function nextItemCountdown(tr){
  const date=tripFocusDate(tr),items=tripTimelineItems(tr,date).filter(x=>x.time);
  if(date!==todayIsoLocal()||!items.length)return null;
  const now=new Date(),mins=now.getHours()*60+now.getMinutes();
  const next=items.find(x=>timeToMinutes(x.time)>=mins);
  if(!next)return null;
  return {item:next,minutes:Math.max(0,timeToMinutes(next.time)-mins)};
}
function dayRouteUrl(tr,date){
  const day=(state.itineraries[tr.id]||[]).find(d=>d.date===date);
  const points=[];
  for(const a of day?.activities||[])if(a.location)points.push(a.location);
  for(const b of (state.bookings[tr.id]||[]).filter(b=>b.date===date))if(b.location)points.push(b.location);
  const uniq=[...new Set(points.map(x=>String(x).trim()).filter(Boolean))];
  if(!uniq.length)return googleMapsSearchUrl(tr.destinationCanonical||tr.destination||'');
  if(uniq.length===1)return googleMapsSearchUrl(uniq[0]);
  const origin=uniq[0],destination=uniq[uniq.length-1],waypoints=uniq.slice(1,-1).slice(0,8).join('|');
  return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}${waypoints?`&waypoints=${encodeURIComponent(waypoints)}`:''}&travelmode=driving`;
}

function tripTimelineItems(tr,date){
  const out=[];
  const day=(state.itineraries[tr.id]||[]).find(d=>d.date===date);
  for(const a of (day?.activities||[])) out.push({kind:'activity',time:a.time||'',title:a.title||'',location:a.location||'',id:a.id,durationMinutes:Number(a.durationMinutes||60),travelBufferMinutes:Number(a.travelBufferMinutes||0)});
  for(const b of (state.bookings[tr.id]||[]).filter(b=>b.date===date)) out.push({kind:'booking',time:b.time||'',title:b.title||b.provider||'',location:b.location||'',id:b.id,durationMinutes:Number(b.durationMinutes||0),travelBufferMinutes:Number(b.travelBufferMinutes||0)});
  return out.sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
}
function tripFocusDate(tr){

  if(today>=String(tr.start||'')&&today<=String(tr.end||''))return today;

  return dates.find(x=>x>=today)||dates[0]||tr.start||today;

function timelineNowClass(date,time){

  const now=new Date(); const mins=now.getHours()*60+now.getMinutes();
  const [h,m]=String(time).split(':').map(Number); const v=h*60+(m||0);
  return Math.abs(v-mins)<=45?'now':'';

async function loadTripWeather(tripId,force=false){
  const tr=tripById(tripId); if(!tr?.destination)return;
  const cached=ui.weatherCache?.[tripId];
  if(!force&&cached&&Date.now()-Number(cached._ts||0)<30*60*1000)return;
  try{
    const hasCoords=Number.isFinite(Number(tr.destinationLat))&&Number.isFinite(Number(tr.destinationLon));
    const params=new URLSearchParams({location:tr.destinationCanonical||tr.destination});
    if(hasCoords){
      params.set('lat',String(Number(tr.destinationLat)));
      params.set('lon',String(Number(tr.destinationLon)));
    }
    const r=await fetch(`/api/weather?${params.toString()}`,{cache:'no-store'});
    const j=await r.json();
    ui.weatherCache=ui.weatherCache||{};
    ui.weatherCache[tripId]={...j,_ts:Date.now()};
    if(j.enabled&&!j.error){
      tr.autoTimezone=j.timezone||tr.autoTimezone||'';
      tr.resolvedLocation=j.location||tr.resolvedLocation||'';
      tr.detectedCountry=j.country||tr.destinationCountry||tr.detectedCountry||'';
      tr.autoPractical=j.practical||tr.autoPractical||{};
      tr.practicalUpdatedAt=new Date().toISOString();
      if(!tr.destinationCanonical)tr.destinationCanonical=j.location||tr.destination;
      try{await window.storage.set('waypoint-simple-data',JSON.stringify(state),false);}catch(e){}
    }
    if(ui.currentTripId===tripId&&['today','overview','travel'].includes(ui.tripSubTab))render();
  }catch(e){
    ui.weatherCache=ui.weatherCache||{};ui.weatherCache[tripId]={enabled:false,error:true,_ts:Date.now()};
  }
}

function checkDueReminders(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const now=Date.now();
  for(const tr of state.trips){
    const cfg=state.reminders?.[tr.id]; if(!cfg?.enabled)continue;
    const lead=Number(cfg.leadMinutes||30)*60000;
    const items=[];
    for(const d of state.itineraries[tr.id]||[])for(const a of d.activities||[])if(d.date&&a.time)items.push({id:a.id,title:a.title,date:d.date,time:a.time});
    for(const b of state.bookings[tr.id]||[])if(b.date&&b.time)items.push({id:b.id,title:b.title||b.provider,date:b.date,time:b.time});
    for(const x of items){
      const at=Date.parse(`${x.date}T${x.time}:00`); if(!Number.isFinite(at))continue;
      const fire=at-lead; const key=`waypoint-reminded:${tr.id}:${x.id}:${x.date}:${x.time}`;
      if(now>=fire&&now<at+60000&&!localStorage.getItem(key)){
        showWaypointNotification(`Waypoint · ${tr.name}`,`${x.title} · ${formatTime12(x.time)}`);

function tripDurationDays(tr){
  if(!tr?.start||!tr?.end) return 0;
  const a=new Date(`${tr.start}T12:00:00`), b=new Date(`${tr.end}T12:00:00`);
  if(Number.isNaN(a.getTime())||Number.isNaN(b.getTime())||b<a) return 0;
  return Math.floor((b-a)/86400000)+1;
}
function clamp01(n){ return Math.max(0,Math.min(1,Number(n)||0)); }
function pct01(n){ return Math.round(clamp01(n)*100); }
function computeTripReadiness(tr){
  const es=state.lang==='es';
  const days=Array.isArray(state.itineraries[tr.id])?state.itineraries[tr.id]:[];
  const bookings=Array.isArray(state.bookings[tr.id])?state.bookings[tr.id]:[];
  const packing=Array.isArray(state.checklists[tr.id])?state.checklists[tr.id]:[];
  const docs=Array.isArray(state.tripDocs[tr.id])?state.tripDocs[tr.id]:[];
  const expenses=Array.isArray(state.expenses)?state.expenses.filter(x=>x.tripId===tr.id):[];
  const duration=tripDurationDays(tr);

  // 1) Core trip information — 10%
  const coreChecks=[
    Boolean(String(tr.name||'').trim()),
    Boolean(String(tr.destination||'').trim()),
    Boolean(tr.start),
    Boolean(tr.end),
    Boolean(duration>0)
  ];
  const core=coreChecks.filter(Boolean).length/coreChecks.length;

  // 2) Itinerary — 25%
  // Measures both day coverage and actual activity coverage across the trip.
  const datedDays=new Set(days.map(d=>d?.date).filter(Boolean));
  const daysWithActivities=days.filter(d=>Array.isArray(d?.activities)&&d.activities.length>0);
  const totalActivities=days.reduce((n,d)=>n+(Array.isArray(d?.activities)?d.activities.length:0),0);
  const expectedDays=duration||Math.max(days.length,1);
  const plannedDayCoverage=clamp01((duration?datedDays.size:days.length)/expectedDays);
  const activeDayCoverage=clamp01(daysWithActivities.length/expectedDays);
  const activityDepth=daysWithActivities.length
    ? clamp01(totalActivities/(daysWithActivities.length*2)) // 2 activities/day = fully developed day
    : 0;
  const itinerary=clamp01(plannedDayCoverage*.35 + activeDayCoverage*.45 + activityDepth*.20);

  // 3) Bookings — 20%
  // Each saved booking is graded for completeness. No booking = 0 because the section is not prepared yet.
  const bookingCompleteness=(b)=>{
    const parts=[
      {v:Boolean(b?.type),w:.10},
      {v:Boolean(String(b?.title||'').trim()),w:.25},
      {v:Boolean(b?.date),w:.20},
      {v:Boolean(String(b?.provider||'').trim()),w:.15},
      {v:Boolean(String(b?.confirmation||'').trim()),w:.20},
      {v:Boolean(String(b?.location||'').trim()),w:.10}
    ];
    return parts.reduce((s,p)=>s+(p.v?p.w:0),0);
  };
  const bookingsScore=bookings.length
    ? clamp01(bookings.reduce((s,b)=>s+bookingCompleteness(b),0)/bookings.length)
    : 0;

  // 4) Packing — 20%
  // Quantity-aware: 3 shirts count as 3 units, not one row.
  const packingTotals=packing.reduce((acc,it)=>{
    const qty=Math.max(1,Number(it?.qty)||1);
    acc.total+=qty;
    if(it?.done) acc.done+=qty;
    return acc;
  },{total:0,done:0});
  const packingScore=packingTotals.total?clamp01(packingTotals.done/packingTotals.total):0;

  // 5) Budget — 15%
  // A defined budget is ready while within limit; overspending proportionally reduces readiness.
  const budget=Number(tr.budgetGoal||0);
  const spent=tripSpent(tr.id);
  let budgetScore=0;
  if(budget>0){
    budgetScore=spent<=budget?1:clamp01(budget/spent);
  }

  // 6) Travel information / documents — 10%
  // Notes/doc entries are scored by completeness. Passport validity contributes when supplied.
  const completeDocs=docs.filter(d=>String(d?.label||'').trim()&&String(d?.value||'').trim()).length;
  const docBase=docs.length?completeDocs/docs.length:0;
  let passportFactor=null;
  if(tr.passportExpiry){
    const warning=passportWarning(tr);
    passportFactor=warning?0:1;
  }
  // If passport is supplied, combine it with notes; otherwise notes determine this section.
  const docsScore=passportFactor===null?clamp01(docBase):clamp01(docBase*.65+passportFactor*.35);

  const specs=[
    {
      key:'details',weight:10,score:core,title:es?'Datos del viaje':'Trip details',
      sub:core===1?(es?'Destino y fechas válidas completos.':'Destination and valid dates complete.'):(es?'Completa nombre, destino y fechas válidas.':'Complete name, destination and valid dates.'),
      tab:null
    },
    {
      key:'itinerary',weight:25,score:itinerary,title:es?'Itinerario':'Itinerary',
      sub:es
        ?`${days.length}/${expectedDays} días creados · ${daysWithActivities.length} con actividades · ${totalActivities} actividades`
        :`${days.length}/${expectedDays} days created · ${daysWithActivities.length} with activities · ${totalActivities} activities`,
      tab:'itinerary'
    },
    {
      key:'bookings',weight:20,score:bookingsScore,title:es?'Reservas':'Bookings',
      sub:bookings.length
        ?(es?`${bookings.length} reservas · ${pct01(bookingsScore)}% completas`:`${bookings.length} bookings · ${pct01(bookingsScore)}% complete`)
        :(es?'Agrega y completa tus reservas.':'Add and complete your bookings.'),
      tab:'bookings'
    },
    {
      key:'packing',weight:20,score:packingScore,title:es?'Equipaje':'Packing',
      sub:packingTotals.total
        ?(es?`${packingTotals.done} de ${packingTotals.total} unidades listas`:`${packingTotals.done} of ${packingTotals.total} units packed`)
        :(es?'Crea tu lista y marca lo empacado.':'Create your list and mark packed items.'),
      tab:'checklist'
    },
    {
      key:'budget',weight:15,score:budgetScore,title:es?'Presupuesto':'Budget',
      sub:budget>0
        ?(spent<=budget
          ?(es?`${money(spent,tr.currency)} de ${money(budget,tr.currency)} · dentro del presupuesto`:`${money(spent,tr.currency)} of ${money(budget,tr.currency)} · within budget`)
          :(es?`Excedido por ${money(spent-budget,tr.currency)}`:`Over by ${money(spent-budget,tr.currency)}`))
        :(es?'Define un presupuesto total.':'Set a total trip budget.'),
      tab:'budget'
    },
    {
      key:'docs',weight:10,score:docsScore,title:es?'Información y documentos':'Travel info & documents',
      sub:docs.length
        ?(es?`${completeDocs}/${docs.length} notas completas${tr.passportExpiry?' · pasaporte revisado':''}`:`${completeDocs}/${docs.length} notes complete${tr.passportExpiry?' · passport checked':''}`)
        :(tr.passportExpiry
          ?(es?'Pasaporte revisado; agrega confirmaciones o datos útiles.':'Passport checked; add confirmations or useful travel info.')
          :(es?'Agrega confirmaciones, documentos o información importante.':'Add confirmations, documents or important travel information.')),
      tab:'notes'
    }
  ];

  const total=specs.reduce((sum,s)=>sum+s.weight*clamp01(s.score),0);
  return {
    ready:Math.round(total),
    steps:specs.map(s=>({
      ...s,
      contribution:Math.round(s.weight*clamp01(s.score)*10)/10,
      pct:pct01(s.score),
      done:s.score>=.999,
      partial:s.score>0&&s.score<.999
    })),
    packingTotals,
    totalActivities,
    daysWithActivities:daysWithActivities.length,
    expectedDays,
    expensesCount:expenses.length
  };
}

function findNextActivity(tr){
  const days=(state.itineraries[tr.id]||[]).slice();
  const now=new Date();
  const items=[];
  days.forEach((d,idx)=>(d.activities||[]).forEach(a=>{
    let dt=null;
    if(d.date){
      const time=(a.time&&/^\\d{1,2}:\\d{2}/.test(a.time))?a.time:'23:59';
      dt=new Date(d.date+'T'+time);
    }
    items.push({dayLabel:displayDayLabel(d,idx),date:d.date||'',dt,...a});
  }));
  const future=items.filter(x=>x.dt && x.dt>=now).sort((a,b)=>a.dt-b.dt);
  if(future.length) return future[0];
  return items[0]||null;
}

function normalizeTime24(value){
  if(!value) return '';
  const s=String(value).trim();
  let m=s.match(/^(\d{1,2}):(\d{2})$/);
  if(m){
    const h=Math.max(0,Math.min(23,Number(m[1])));
    const min=Math.max(0,Math.min(59,Number(m[2])));
    return String(h).padStart(2,'0')+':'+String(min).padStart(2,'0');
  }
  m=s.match(/^(\d{1,2})(?::(\d{2}))?\s*(AM|PM)$/i);
  if(m){
    let h=Number(m[1]); const min=Number(m[2]||0); const ap=m[3].toUpperCase();
    if(h<1||h>12||min<0||min>59) return '';
    if(ap==='AM'&&h===12) h=0;
    if(ap==='PM'&&h!==12) h+=12;
    return String(h).padStart(2,'0')+':'+String(min).padStart(2,'0');
  }
  return s;
}
function formatTime12(value){
  const t=normalizeTime24(value);
  const m=t.match(/^(\d{2}):(\d{2})$/);
  if(!m) return value||'';
  let h=Number(m[1]); const min=m[2]; const ap=h>=12?'PM':'AM';
  h=h%12||12;
  return `${h}:${min} ${ap}`;
}
function time12PickerHtml(prefix, value=''){
  const norm=normalizeTime24(value);
  let h24=norm&&/^\d{2}:\d{2}$/.test(norm)?Number(norm.slice(0,2)):9;
  let min=norm&&/^\d{2}:\d{2}$/.test(norm)?norm.slice(3,5):'00';
  const ap=h24>=12?'PM':'AM';
  const h12=h24%12||12;
  const hours=Array.from({length:12},(_,i)=>i+1).map(h=>`<option value="${h}" ${h===h12?'selected':''}>${h}</option>`).join('');
  const mins=['00','05','10','15','20','25','30','35','40','45','50','55'].map(v=>`<option value="${v}" ${v===min?'selected':''}>${v}</option>`).join('');
  return `<div class="time12-picker">
    <select class="hour" id="${prefix}-hour" aria-label="Hour">${hours}</select>
    <span>:</span>
    <select class="minute" id="${prefix}-minute" aria-label="Minute">${mins}</select>
    <select class="ampm" id="${prefix}-ampm" aria-label="AM or PM">
      <option value="AM" ${ap==='AM'?'selected':''}>AM</option>
      <option value="PM" ${ap==='PM'?'selected':''}>PM</option>
    </select>
  </div>`;
}
function getTime12PickerValue(prefix){
  const hEl=document.getElementById(prefix+'-hour');
  const mEl=document.getElementById(prefix+'-minute');
  const aEl=document.getElementById(prefix+'-ampm');
  if(!hEl||!mEl||!aEl) return '';
  let h=Number(hEl.value); const min=mEl.value; const ap=aEl.value;
  if(ap==='AM'&&h===12) h=0;
  if(ap==='PM'&&h!==12) h+=12;
  return String(h).padStart(2,'0')+':'+String(min).padStart(2,'0');
}

function localizedDateLabel(iso){
  if(!iso) return '';
  const parts=String(iso).split('-').map(Number);
  if(parts.length!==3 || parts.some(Number.isNaN)) return iso;
  const d=new Date(parts[0],parts[1]-1,parts[2]);
  try{
    return new Intl.DateTimeFormat(state.lang==='es'?'es-ES':'en-US',{
      weekday:'long', month:'long', day:'numeric', year:'numeric'
    }).format(d);
  }catch(e){ return iso; }
}
function displayDayLabel(day,index=0){
  const raw=String(day?.label||'').trim();
  const generated=/^(Day|Día)\s+\d+\s*[—-]\s*\d{4}-\d{2}-\d{2}$/i.test(raw);
  if(day?.date && (generated || !raw)){
    return `${state.lang==='es'?'Día':'Day'} ${index+1} — ${localizedDateLabel(day.date)}`;
  }
  return raw || `${state.lang==='es'?'Día':'Day'} ${index+1}${day?.date?' — '+localizedDateLabel(day.date):''}`;
}

function generateDays(){
  const tr = tripById(ui.currentTripId);

  if(!state.itineraries[tr.id]) state.itineraries[tr.id]=[];
  const s = new Date(tr.start), e = new Date(tr.end);
  const existingDates = new Set(state.itineraries[tr.id].map(d=>d.date));
  let n=1;
  for(let d=new Date(s); d<=e; d.setDate(d.getDate()+1)){
    const iso = d.toISOString().slice(0,10);
    if(!existingDates.has(iso)){ state.itineraries[tr.id].push({id:uid(), label:`${state.lang==='es'?'Día':'Day'} ${n} — ${iso}`, date:iso, activities:[]}); }
    n++;
  }

}

function expenseBalances(tr){
  const balances={};
  const add=(n,v)=>{if(!n)return;balances[n]=(balances[n]||0)+Number(v||0);};
  for(const e of state.expenses.filter(x=>x.tripId===tr.id)){
    const amount=Number(e.amount||0); if(!amount)continue;
    const paid=String(e.paidBy||currentParticipantName(tr));
    const split=Array.isArray(e.splitWith)&&e.splitWith.length?e.splitWith:[paid];
    add(paid,amount);
    if(e.splitMode==='custom'&&e.splitShares&&Object.keys(e.splitShares).length){split.forEach(n=>add(n,-amount*(Number(e.splitShares[n]||0)/100)));}else{const share=amount/split.length;split.forEach(n=>add(n,-share));}
  }
  const settled=settlementEffect(tr);Object.entries(settled).forEach(([n,v])=>add(n,v));
  Object.keys(balances).forEach(k=>balances[k]=Math.round((balances[k]+Number.EPSILON)*100)/100);
  return balances;
}
function expenseSettlementSuggestions(tr){
  const b=expenseBalances(tr);
  const creditors=Object.entries(b).filter(([,v])=>v>.009).map(([n,v])=>({n,v})).sort((a,b)=>b.v-a.v);
  const debtors=Object.entries(b).filter(([,v])=>v<-.009).map(([n,v])=>({n,v:-v})).sort((a,b)=>b.v-a.v);
  const out=[];let i=0,j=0;
  while(i<debtors.length&&j<creditors.length){
    const amount=Math.min(debtors[i].v,creditors[j].v);
    if(amount>.009)out.push({from:debtors[i].n,to:creditors[j].n,amount:roundMoney(amount)});
    debtors[i].v-=amount;creditors[j].v-=amount;
    if(debtors[i].v<.01)i++;if(creditors[j].v<.01)j++;
  }
  return out;
}

function ensureConverterDefaults(){
  if(!ui.convDraft) ui.convDraft={amount:"100",from:"",to:"",rate:"1",mode:"auto",rateDate:"",loading:false,error:"",rateSource:""};
  const tr=ui.currentTripId?tripById(ui.currentTripId):null;
  const preferred=(tr?.currency||state.profile?.currency||'USD').toUpperCase();
  if(!ui.convDraft.from) ui.convDraft.from=preferred;
  if(!ui.convDraft.to){
    const fallback=(CURRENCIES||[]).map(c=>c.code).find(c=>c!==preferred) || 'EUR';
    ui.convDraft.to=fallback;
  }
  if(ui.convDraft.from===ui.convDraft.to){
    const fallback=(CURRENCIES||[]).map(c=>c.code).find(c=>c!==ui.convDraft.from) || (ui.convDraft.from==='EUR'?'USD':'EUR');
    ui.convDraft.to=fallback;
  }
}

async function fetchDailyRate(){
  ensureConverterDefaults();
  syncConverterDraftFromFields(false);
  const from=String(ui.convDraft.from||'').toUpperCase();
  const to=String(ui.convDraft.to||'').toUpperCase();
  if(!from||!to) return;

  if(from===to){
    ui.convDraft.rate='1';
    ui.convDraft.rateDate=new Date().toISOString().slice(0,10);
    ui.convDraft.loading=false;
    ui.convDraft.error='';
    ui.convDraft.rateSource='identity';
    ui.convResult={value:parseMoneyInput(ui.convDraft.amount),to,rate:1,date:ui.convDraft.rateDate||''};
    render();
    return;
  }

  const cacheKey=`waypoint-fx:${from}:${to}`;
  const saveCachedRate=(data)=>{
    try{
      localStorage.setItem(cacheKey,JSON.stringify({
        rate:Number(data.rate),
        date:data.date||'',
        source:data.source||'',
        savedAt:Date.now()
      }));
    }catch(e){}
  };
  const readCachedRate=()=>{
    try{
      const raw=localStorage.getItem(cacheKey);
      if(!raw) return null;
      const x=JSON.parse(raw);
      return Number(x.rate)>0?x:null;
    }catch(e){ return null; }
  };
  const applyRate=(data,source)=>{
    const rate=Number(data.rate);
    if(!Number.isFinite(rate)||rate<=0) throw new Error('invalid rate');
    ui.convDraft.rate=String(rate);
    ui.convDraft.rateDate=data.date||new Date().toISOString().slice(0,10);
    ui.convDraft.loading=false;
    ui.convDraft.error='';
    ui.convDraft.rateSource=source||data.source||'live';
    const amount=parseMoneyInput(ui.convDraft.amount);
    ui.convResult={value:roundMoney(amount*rate),to,rate,date:ui.convDraft.rateDate||''};
    saveCachedRate({rate,date:ui.convDraft.rateDate,source:ui.convDraft.rateSource});
    render();
  };

  ui.convDraft.loading=true;
  ui.convDraft.error='';
  render();

  // Route 1: Waypoint production server (best for deployed app).
  try{
    if(location.protocol==='http:' || location.protocol==='https:'){
      const r=await fetch(`/api/fx/rate?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`,{cache:'no-store'});
      if(r.ok){
        const data=await r.json();
        if(Number(data.rate)>0){
          applyRate(data,'Waypoint');
          return;
        }
      }
    }
  }catch(e){}

  // Route 2: direct public provider (works for standalone HTML/PWA when allowed by network/browser).
  try{
    const url=`https://api.frankfurter.dev/v2/rate/${encodeURIComponent(from.toLowerCase())}/${encodeURIComponent(to.toLowerCase())}`;
    const r=await fetch(url,{headers:{'accept':'application/json'},cache:'no-store'});
    if(r.ok){
      const data=await r.json();
      if(Number(data.rate)>0){
        applyRate({rate:Number(data.rate),date:data.date||'',source:'Frankfurter'},'Frankfurter');
        return;
      }
    }
  }catch(e){}

  // Route 3: try rates endpoint as a compatibility fallback.
  try{
    const url=`https://api.frankfurter.dev/v2/rates?base=${encodeURIComponent(from.toLowerCase())}&quotes=${encodeURIComponent(to.toLowerCase())}`;
    const r=await fetch(url,{headers:{'accept':'application/json'},cache:'no-store'});
    if(r.ok){
      const rows=await r.json();
      const row=Array.isArray(rows)?rows.find(x=>String(x.quote||'').toUpperCase()===to):null;
      if(row&&Number(row.rate)>0){
        applyRate({rate:Number(row.rate),date:row.date||'',source:'Frankfurter'},'Frankfurter');
        return;
      }
    }
  }catch(e){}

  // Route 4: last known valid rate from this device.
  const cached=readCachedRate();
  if(cached){
    ui.convDraft.rate=String(cached.rate);
    ui.convDraft.rateDate=cached.date||'';
    ui.convDraft.loading=false;
    ui.convDraft.error=state.lang==='es'
      ?'Sin conexión con la tasa en vivo. Mostrando la última tasa disponible en este dispositivo.'
      :'Live rate unavailable. Showing the last rate saved on this device.';
    ui.convDraft.rateSource='cache';
    const amount=parseMoneyInput(ui.convDraft.amount);
    ui.convResult={value:roundMoney(amount*Number(cached.rate)),to,rate:Number(cached.rate),date:cached.date||''};
    render();
    return;
  }

  ui.convDraft.loading=false;
  ui.convDraft.error=state.lang==='es'
    ?'No pudimos obtener una tasa en vivo para este par. Verifica tu conexión o usa una tasa manual.'
    :'We could not retrieve a live rate for this pair. Check your connection or use a manual rate.';
  ui.convDraft.rateSource='';
  render();
}

function saveExpenseForm(){
  const tr=tripById(ui.currentTripId); if(!tr||!canEditTrip(tr))return;
  const g=id=>document.getElementById(id)?.value||'';
  const paidBy=g('e-paid-by')||currentParticipantName(tr);
  const splitWith=[...document.querySelectorAll('input[name="e-split"]:checked')].map(x=>x.value);
  const mode=g('e-split-mode')||'equal';let splitShares={};
  if(mode==='custom'&&splitWith.length){let remaining=100;for(let i=0;i<splitWith.length;i++){const n=splitWith[i];const def=i===splitWith.length-1?remaining:Math.round(100/splitWith.length);const v=Math.max(0,Math.min(100,Number(prompt(`${n} %`,def)||def)));splitShares[n]=v;remaining=Math.max(0,remaining-v);}}
  state.expenses.push({id:uid(), tripId:ui.currentTripId, category:g('e-cat'), desc:g('e-desc').trim(), amount:parseMoneyInput(g('e-amount')), date:g('e-date'), paidBy, splitWith:splitWith.length?splitWith:[paidBy],splitMode:mode,splitShares});
  ui.modal=null; ui.expenseDraft=null;
  saveState(); render();
}
function deleteExpense(id){
  const t=tt();
  const idx=state.expenses.findIndex(e=>e.id===id);
  const removed=state.expenses[idx];
  const tr=removed?tripById(removed.tripId):null;
  if(tr&&tr.liveSync){
    if(!tr.collabDeleted)tr.collabDeleted={days:[],activities:[],bookings:[],expenses:[],checklists:[],docs:[],ideas:[],polls:[]};
    if(!tr.collabDeleted.expenses.includes(id))tr.collabDeleted.expenses.push(id);
  }
  state.expenses=state.expenses.filter(e=>e.id!==id);
  saveState(); render();
  showToast(t.budget.deleted, ()=>{
    if(removed){
      state.expenses.splice(Math.max(0,idx),0,removed);
      if(tr?.collabDeleted)tr.collabDeleted.expenses=tr.collabDeleted.expenses.filter(x=>x!==id);
      saveState(); render();
    }
  });
}

/* ---- checklist sub ---- */
function packingCategoryOf(it){
  return PACKING_CATEGORIES.includes(it.category)?it.category:'other';
}
function packingCategoryLabel(cat){ return PACKING_CATEGORY_LABELS[state.lang][cat]||cat; }

function smartPackingSuggestions(tr){
  const es=state.lang==='es',p=practicalForTrip(tr),w=weatherForTrip(tr),out=[];
  const add=(name,cat='other')=>{if(!out.some(x=>x.name===name))out.push({name,cat});};
  if(p.power&&p.power!=='No disponible')add(es?'Adaptador de enchufe':'Plug adapter','electronics');
  if((w?.current?.precipitation_probability||0)>=40)add(es?'Paraguas compacto':'Compact umbrella','clothing');
  if((w?.current?.temperature_2m||25)<15)add(es?'Chaqueta / abrigo':'Jacket / coat','clothing');
  if(state.profile.country&&tr.destinationCountry&&tr.destinationCountry!==state.profile.country)add(es?'Pasaporte / documentos de viaje':'Passport / travel documents','documents');
  add(es?'Cargador del teléfono':'Phone charger','electronics');
  add(es?'Medicamentos personales':'Personal medications','health');
  return out;
}
function addSmartPackingSuggestions(tripId){
  const tr=tripById(tripId);if(!tr)return;const items=state.checklists[tripId]||[];
  for(const s of smartPackingSuggestions(tr)){if(!items.some(x=>String(x.name||'').toLowerCase()===s.name.toLowerCase()))items.push({id:uid(),name:s.name,category:s.cat,qty:1,done:false,assignedTo:''});}
  state.checklists[tripId]=items;saveState();render();
}

function addChecklistItem(){
  const el=document.getElementById('ck-item'); if(!el||!ui.currentTripId) return;
  const val=el.value.trim(); if(!val) return;
  const cat=document.getElementById('ck-cat')?.value||'other';
  const qty=Math.max(1,Math.min(99,Number(document.getElementById('ck-qty')?.value||1)));
  const assignedTo=document.getElementById('ck-assignee')?.value||'';
  if(!state.checklists[ui.currentTripId]) state.checklists[ui.currentTripId]=[];
  state.checklists[ui.currentTripId].push({id:uid(),text:val,done:false,category:cat,qty,assignedTo});
  saveState(); render();
}
function normalizePackingPreset(x){ return typeof x==='string'?{text:x,category:'other',qty:1}:{text:x.text,category:x.category||'other',qty:x.qty||1}; }
function addPresetItems(){
  if(!ui.currentTripId) return;
  if(!state.checklists[ui.currentTripId]) state.checklists[ui.currentTripId]=[];
  const existing=new Set(state.checklists[ui.currentTripId].map(i=>(i.text||'').toLowerCase()));
  PRESET_ITEMS[state.lang].map(normalizePackingPreset).forEach(x=>{if(!existing.has(x.text.toLowerCase())) state.checklists[ui.currentTripId].push({id:uid(),text:x.text,done:false,category:x.category,qty:x.qty});});
  saveState(); render();
}
function addTypePresetItems(){
  const tr=tripById(ui.currentTripId);
  if(!tr||!tr.tripType||!TRIP_TYPE_PACKING[tr.tripType]) return;
  if(!state.checklists[ui.currentTripId]) state.checklists[ui.currentTripId]=[];
  const existing=new Set(state.checklists[ui.currentTripId].map(i=>(i.text||'').toLowerCase()));
  TRIP_TYPE_PACKING[tr.tripType][state.lang].map(normalizePackingPreset).forEach(x=>{if(!existing.has(x.text.toLowerCase())) state.checklists[ui.currentTripId].push({id:uid(),text:x.text,done:false,category:x.category,qty:x.qty});});
  saveState(); render();
}
function toggleChecklistItem(id){
  const it=(state.checklists[ui.currentTripId]||[]).find(i=>i.id===id);
  if(it){it.done=!it.done;saveState();render();}
}
function markAllPacked(done){
  (state.checklists[ui.currentTripId]||[]).forEach(i=>i.done=Boolean(done));
  saveState();render();
}
function deleteChecklistItem(id){
  const tr=tripById(ui.currentTripId);
  if(tr&&tr.liveSync){
    if(!tr.collabDeleted)tr.collabDeleted={days:[],activities:[],bookings:[],expenses:[],checklists:[],docs:[],ideas:[],polls:[]};
    if(!tr.collabDeleted.checklists.includes(id))tr.collabDeleted.checklists.push(id);
  }
  state.checklists[ui.currentTripId]=(state.checklists[ui.currentTripId]||[]).filter(i=>i.id!==id);
  saveState();render();
}

function addDoc(tripId){
  const label = document.getElementById('doc-label').value.trim();
  const value = document.getElementById('doc-value').value.trim();
  if(!label || !value) return;
  if(!state.tripDocs[tripId]) state.tripDocs[tripId]=[];
  state.tripDocs[tripId].push({id:uid(),label,value,type:document.getElementById('doc-type')?.value||'document',important:document.getElementById('doc-important')?.value==='1'});
  saveState(); render();
}
function quickAddDoc(label){
  const el = document.getElementById('doc-label');
  if(el){ el.value = label; document.getElementById('doc-value').focus(); }
}
function deleteDoc(tripId,docId){
  const tr=tripById(tripId);
  if(tr&&tr.liveSync){
    if(!tr.collabDeleted)tr.collabDeleted={days:[],activities:[],bookings:[],expenses:[],checklists:[],docs:[],ideas:[],polls:[]};
    if(!tr.collabDeleted.docs.includes(docId))tr.collabDeleted.docs.push(docId);
  }
  state.tripDocs[tripId]=(state.tripDocs[tripId]||[]).filter(d=>d.id!==docId);
  saveState();render();
}

async function runDiagnostics(){
  ui.diag={loading:true};render();
  const out={time:new Date().toISOString(),online:navigator.onLine,storage:true,health:null,features:null};
  try{const r=await fetch('/health',{cache:'no-store'});out.health=await r.json();out.healthOk=r.ok;}catch(e){out.healthOk=false;}
  try{const r=await fetch('/api/features',{cache:'no-store'});out.features=await r.json();out.featuresOk=r.ok;}catch(e){out.featuresOk=false;}
  ui.diag=out;render();
}
function diagnosticsHtml(){
  const d=ui.diag,es=state.lang==='es';

  const row=(name,ok,val='')=>`<div class="diag-row"><span>${name}</span><span class="${ok?'status-ok':'status-bad'}">${ok?'✓':'✕'} ${escapeHtml(String(val||''))}</span></div>`;

}

function exportData(){
  const t=tt();
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='waypoint-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  showToast(t.settings.exported);
}
function importData(evt){
  const t=tt();
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data || !Array.isArray(data.trips)) throw new Error('bad format');
      askConfirm(t.settings.importConfirm, ()=>{
        state = Object.assign({lang:state.lang, trips:[], expenses:[], settlements:[], checklists:{}, itineraries:{}, tripDocs:{}, bookings:{}, ideas:{}, polls:{}, reminders:{}, categoryBudgets:{}}, data);
        saveState(); render();
        showToast(t.settings.imported);
      }, true, t.common.continueLabel);
    }catch(e){ showToast(t.settings.importError); }
  };
  reader.readAsText(file);
  evt.target.value = '';
}

      await reg.update();
      let reloading=false;
      navigator.serviceWorker.addEventListener('controllerchange',()=>{
        if(reloading)return;
        reloading=true;
        location.reload();
      });
    }catch(e){}
  });
}

loadState();
setTimeout(()=>{ const s=document.getElementById('splash'); if(s) s.remove(); }, 1600);
</script>
</body>
</html>
