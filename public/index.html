<title>Waypoint — Trip Planner</title>
<meta name="waypoint-version" content="4.3.5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1D30; --ink-2:#081525; --teal:#123B3B;
  --brass:#C9A227; --brass-light:#EFCB5E; --paper:#F6EFDF; --paper-dim:#EAE0C8;
  --coral:#C1502E; --green:#4C9A6A;
  --ink-text:#EDF1F4; --muted:rgba(237,241,244,0.56);
  --paper-text:#20261F; --paper-muted:#5b5646;
  --radius:16px;
  --font-display:'Big Shoulders Display',sans-serif;
  --font-body:'IBM Plex Sans',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--ink);color:var(--ink-text);font-family:var(--font-body);min-height:100vh;-webkit-font-smoothing:antialiased;}
body::before{content:"";position:fixed;inset:0;
  background:radial-gradient(circle at 12% 6%, rgba(201,162,39,0.12), transparent 38%),
             radial-gradient(circle at 92% 18%, rgba(76,154,106,0.07), transparent 40%),
             radial-gradient(circle at 50% 100%, rgba(18,59,59,0.55), transparent 55%),
             linear-gradient(180deg, #0B1D30 0%, #081525 100%);
  pointer-events:none;z-index:0;}
#app{position:relative;z-index:1;max-width:720px;margin:0 auto;padding-bottom:40px;min-height:100vh;}
h1,h2,h3,.display{font-family:var(--font-display);font-weight:700;letter-spacing:0.01em;}
button{font-family:var(--font-body);cursor:pointer;}
input,select,textarea{font-family:var(--font-body);}
main{padding:0 18px 24px;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 40%, #163049, #081525 75%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  animation:splashOut .5s ease .9s forwards;}
#splash .smark{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--brass),var(--brass-light));
  display:flex;align-items:center;justify-content:center;animation:splashPop .5s cubic-bezier(.2,1.4,.4,1);box-shadow:0 14px 40px rgba(201,162,39,0.35);}
#splash .sname{font-family:var(--font-display);font-size:25px;letter-spacing:0.08em;color:var(--paper);}
@keyframes splashPop{0%{transform:scale(0.4) rotate(-14deg);opacity:0;}100%{transform:scale(1) rotate(-6deg);opacity:1;}}
@keyframes splashOut{to{opacity:0;visibility:hidden;pointer-events:none;}}

/* ---------- header ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;row-gap:8px;
  padding:14px 16px;background:rgba(11,29,48,0.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,0.07);}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brass),var(--brass-light));
  display:flex;align-items:center;justify-content:center;transform:rotate(-6deg);flex:0 0 auto;}
.brand-mark svg{width:18px;height:18px;}
.brand h1{font-size:20px;margin:0;line-height:1;color:var(--paper);}
.header-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.icon-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink-text);overflow:hidden;}
.icon-btn:hover{background:rgba(255,255,255,0.13);}
.lang-toggle{display:flex;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:3px;gap:2px;}
.lang-toggle button{border:none;background:transparent;color:var(--muted);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;}
.lang-toggle button.active{background:var(--brass);color:var(--ink);}
@media(max-width:380px){.lang-toggle button{padding:5px 9px;font-size:10.5px;}.brand h1{font-size:17px;}}

.back-row{display:flex;align-items:center;gap:10px;padding:14px 16px 0;}
.back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--brass-light);font-size:13px;font-weight:600;padding:6px 4px;}

.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 14px;flex-wrap:wrap;gap:10px;}
.section-head h2{font-size:26px;margin:0;color:var(--paper);}
.section-head p.sub{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin:2px 0 0;letter-spacing:0.03em;}

.btn{border-radius:9px;padding:10px 18px;font-weight:600;font-size:13.5px;border:none;display:inline-flex;align-items:center;gap:6px;transition:transform .12s, background .15s;}
.btn:active{transform:scale(0.96);}
.btn-brass{background:var(--brass);color:var(--ink);}
.btn-brass:hover{background:var(--brass-light);}
.btn-ghost{background:rgba(255,255,255,0.07);color:var(--ink-text);border:1px solid rgba(255,255,255,0.15);}
.btn-ghost:hover{background:rgba(255,255,255,0.13);}
.btn-danger{background:rgba(193,80,46,0.16);color:#E8A186;border:1px solid rgba(193,80,46,0.4);}
.btn-sm{padding:7px 12px;font-size:12px;}
.btn-block{width:100%;justify-content:center;}

.panel{background:var(--teal);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr;}}
.stat{background:var(--teal);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius);padding:14px 16px;}
.stat .label{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);}
.stat .value{font-family:var(--font-display);font-size:28px;color:var(--paper);margin-top:3px;line-height:1;}
.stat .value.green{color:var(--green);} .stat .value.coral{color:var(--coral);}
.stat .foot{font-size:11px;color:var(--muted);margin-top:5px;}

/* trip card */
.pass{display:flex;background:linear-gradient(180deg,var(--paper),var(--paper-dim));border-radius:var(--radius);overflow:hidden;
  margin-bottom:14px;box-shadow:0 10px 24px rgba(0,0,0,0.26);transition:transform .15s;cursor:pointer;}
.pass:hover{transform:translateY(-2px);}
.pass-main{flex:1;padding:16px 18px;position:relative;color:var(--paper-text);min-width:0;}
.trip-header{background:linear-gradient(180deg,var(--paper),var(--paper-dim));box-shadow:0 10px 24px rgba(0,0,0,0.26);}
.pass-main.has-cover{color:#fff;background-size:cover;background-position:center;}
.pass-main.has-cover .route,.pass-main.has-cover .dates{color:rgba(246,239,223,0.8);}
.pass-main.has-cover h3{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,0.4);}
.pass-main.has-cover .kebab-btn{background:rgba(0,0,0,0.35);color:#fff;}
.route{font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--paper-muted);margin-bottom:3px;}
.shared-badge{background:rgba(76,154,106,0.16);color:#3f8f60;border:1px solid rgba(76,154,106,0.35);border-radius:5px;padding:2px 6px;font-size:9.5px;letter-spacing:0.04em;}
.pass-main.has-cover .shared-badge{background:rgba(76,154,106,0.85);color:#fff;border-color:transparent;}
.pass-main h3{font-size:23px;margin:0 0 5px;}
.dates{font-family:var(--font-mono);font-size:11.5px;color:var(--paper-muted);}
.kebab-btn{position:absolute;top:10px;right:10px;z-index:5;width:28px;height:28px;border-radius:8px;background:rgba(0,0,0,0.07);
  border:none;color:var(--paper-muted);font-size:15px;display:flex;align-items:center;justify-content:center;}
.pass-stub{width:120px;flex:0 0 120px;background:var(--brass);color:var(--ink);padding:14px 12px;display:flex;flex-direction:column;justify-content:center;position:relative;}
.pass-stub::before{content:"";position:absolute;left:-8px;top:0;bottom:0;width:16px;
  background-image:radial-gradient(circle,var(--ink) 4px,transparent 4.1px);background-size:16px 16px;background-position:center;}
.countdown-num{font-family:var(--font-display);font-size:32px;line-height:0.9;font-weight:800;}
.countdown-label{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:0.08em;margin-top:3px;}
.passport-warn{margin-top:6px;font-size:10.5px;font-weight:600;color:#C1502E;background:rgba(193,80,46,0.12);
  border:1px solid rgba(193,80,46,0.3);border-radius:6px;padding:4px 7px;display:inline-block;}
.pass-main.has-cover .passport-warn{background:rgba(193,80,46,0.85);color:#fff;border-color:transparent;}

.pbar{height:8px;border-radius:5px;background:rgba(255,255,255,0.1);overflow:hidden;}
.pbar > div{height:100%;border-radius:5px;background:var(--green);transition:width .4s;}
.pbar.over > div{background:var(--coral);}

.field{margin-bottom:12px;}
.field label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:0.03em;text-transform:uppercase;font-family:var(--font-mono);}
.field input,.field select,.field textarea{width:100%;background:rgba(255,255,255,0.09);border:1px solid rgba(255,255,255,0.22);border-radius:8px;padding:10px 11px;color:var(--ink-text);font-size:14px;}
.field select{-webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%23EDF1F4'><path d='M5.5 7.5l4.5 4.5 4.5-4.5' stroke='%23EDF1F4' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;background-size:15px;padding-right:34px;}
.field select option{background:#132A42;color:#EDF1F4;}
.field textarea{resize:vertical;min-height:56px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brass);outline-offset:1px;}
.field-hint{font-size:10.5px;color:var(--muted);margin:4px 0 0;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:520px){.form-row{grid-template-columns:1fr;}}
.form-actions{display:flex;gap:10px;margin-top:6px;}

.row-list{display:flex;flex-direction:column;gap:2px;}
.li{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,0.07);}
.li:last-child{border-bottom:none;}
.li .main{display:flex;flex-direction:column;min-width:0;}
.li .main .t{font-size:13.5px;font-weight:600;}
.li .main .s{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);}
.li .amt{font-family:var(--font-mono);font-weight:600;font-size:13.5px;white-space:nowrap;}
.li .amt.neg{color:var(--coral);}
.li button.del{background:none;border:none;color:var(--muted);font-size:15px;padding:2px 6px;}
.li button.del:hover{color:var(--coral);}

.empty{padding:34px 18px;text-align:center;color:var(--muted);}
.empty .ic{font-size:32px;display:block;margin-bottom:10px;}
.empty h3{color:var(--paper);font-size:18px;margin:0 0 6px;}
.empty p{font-size:13px;margin:0 0 16px;}

.chk{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid rgba(255,255,255,0.07);}
.chk input[type=checkbox]{width:18px;height:18px;accent-color:var(--brass);}
.chk .txt{flex:1;font-size:13.5px;}
.chk .txt.done{text-decoration:line-through;color:var(--muted);}

.seg{display:flex;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:11px;padding:3px;gap:2px;}
.seg button{flex:1;border:none;background:transparent;color:var(--muted);padding:9px 6px;border-radius:8px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;}
.seg button .ic{font-size:15px;}
.seg button.active{background:var(--brass);color:var(--ink);}

.trip-cover-preview{width:76px;height:52px;border-radius:9px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.16);
  display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;flex:0 0 auto;}
.trip-cover-preview img{width:100%;height:100%;object-fit:cover;display:block;}
.hidden-file{display:none;}

.day-card{background:var(--teal);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:13px 15px;margin-bottom:11px;}
.day-card .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;gap:8px;}
.day-card .dh .lbl{font-family:var(--font-display);font-size:18px;color:var(--paper);}
.day-card .dh .ctl{display:flex;gap:4px;flex:0 0 auto;}
.day-card .dh .ctl button{width:26px;height:26px;padding:0;border-radius:7px;justify-content:center;}
.act-row{display:flex;align-items:center;gap:9px;padding:7px 2px;border-bottom:1px solid rgba(255,255,255,0.06);}
.act-row:last-child{border-bottom:none;}
.act-row .time{font-family:var(--font-mono);font-size:11px;color:var(--brass-light);min-width:48px;}
.act-row .title{flex:1;font-size:13px;}
.add-act-row{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap;}
.add-act-row input{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.16);border-radius:7px;color:var(--ink-text);padding:7px 9px;font-size:12px;min-width:0;}
.add-act-row input.time-in{width:68px;flex:0 0 68px;}
.add-act-row input.title-in{flex:1 1 120px;min-width:0;}
.add-act-row button{flex:0 0 auto;}
.time12-picker{display:flex;align-items:center;gap:5px;flex:0 0 auto;}
.time12-picker select{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.16);
  border-radius:7px;
  color:var(--ink-text);
  padding:7px 6px;
  font-size:12px;
  min-width:0;
}
.time12-picker select option{background:#132A42;color:#EDF1F4;}
.time12-picker .hour{width:52px;}
.time12-picker .minute{width:56px;}
.time12-picker .ampm{width:58px;}
@media(max-width:520px){
  .time12-picker{width:100%;}
  .time12-picker select{flex:1;}
}


.chip{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);border-radius:999px;padding:6px 11px;font-size:12px;display:inline-flex;align-items:center;gap:7px;margin:0 6px 6px 0;}
.chip button{background:none;border:none;color:var(--muted);font-size:12px;}
.chip button:hover{color:var(--coral);}
.chips-wrap{display:flex;flex-wrap:wrap;}

.theme-grid{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
.theme-opt{width:70px;text-align:center;cursor:pointer;}
.theme-swatch{width:70px;height:42px;border-radius:9px;border:2px solid transparent;margin-bottom:5px;}
.theme-opt.sel .theme-swatch{border-color:var(--paper);}
.theme-opt .lbl{font-size:10px;color:var(--muted);}

.avatar-grid{display:flex;gap:9px;flex-wrap:wrap;margin:6px 0;}
.avatar-opt{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.06);border:2px solid transparent;
  display:flex;align-items:center;justify-content:center;font-size:18px;}
.avatar-opt.sel{border-color:var(--brass);background:rgba(201,162,39,0.16);}
.photo-circle{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.16);
  display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;flex:0 0 auto;}
.photo-circle img{width:100%;height:100%;object-fit:cover;}

.fab{position:fixed;bottom:24px;right:20px;z-index:40;width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,var(--brass),var(--brass-light));color:var(--ink);border:none;font-size:25px;font-weight:700;
  box-shadow:0 10px 26px rgba(201,162,39,0.42);display:flex;align-items:center;justify-content:center;}
.fab:active{transform:scale(0.94);}

#toast-container{position:fixed;left:0;right:0;bottom:22px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none;}
.toast{pointer-events:auto;background:var(--ink-2);border:1px solid rgba(255,255,255,0.15);color:var(--ink-text);
  padding:11px 14px;border-radius:10px;font-size:13px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 22px rgba(0,0,0,0.35);animation:toastIn .2s ease;}
.toast.out{animation:toastOut .3s ease forwards;}
@keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px);}}
.toast button{background:none;border:none;color:var(--brass-light);font-weight:700;font-size:12px;}

.modal-bg{position:fixed;inset:0;background:rgba(6,15,25,0.72);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s ease;}
@media(min-width:640px){.modal-bg{align-items:center;}}
.modal{background:var(--ink-2);border:1px solid rgba(255,255,255,0.12);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;}
@media(min-width:640px){.modal{border-radius:16px;}}
.modal h3{margin:0 0 14px;font-size:20px;color:var(--paper);}

.hero-path{width:100%;height:36px;margin-top:10px;display:block;}
.hero-path .dash{stroke-dasharray:5 7;animation:dashMove 3.2s linear infinite;}
@keyframes dashMove{to{stroke-dashoffset:-24;}}

/* themes */
[data-theme="sunset"]{--ink:#2B1710;--ink-2:#20110C;--teal:#4A2A1C;--brass:#E07A3F;--brass-light:#F4A15F;--green:#4C9A6A;--coral:#D9432B;}
[data-theme="sunset"] body::before{background:radial-gradient(circle at 12% 6%, rgba(224,122,63,0.15), transparent 38%),radial-gradient(circle at 92% 18%, rgba(76,154,106,0.08), transparent 40%),radial-gradient(circle at 50% 100%, rgba(74,42,28,0.6), transparent 55%),linear-gradient(180deg,#2B1710 0%,#20110C 100%);}
[data-theme="forest"]{--ink:#0E1F16;--ink-2:#0A1710;--teal:#1B3A29;--brass:#B7A345;--brass-light:#D8C56B;--green:#5EAE7C;--coral:#C1502E;}
[data-theme="forest"] body::before{background:radial-gradient(circle at 12% 6%, rgba(183,163,69,0.13), transparent 38%),radial-gradient(circle at 92% 18%, rgba(94,174,124,0.09), transparent 40%),radial-gradient(circle at 50% 100%, rgba(27,58,41,0.6), transparent 55%),linear-gradient(180deg,#0E1F16 0%,#0A1710 100%);}
[data-theme="rose"]{--ink:#2A1930;--ink-2:#1E1224;--teal:#432A4E;--brass:#D68FB0;--brass-light:#F0B8D0;--green:#4C9A6A;--coral:#C1502E;}
[data-theme="rose"] body::before{background:radial-gradient(circle at 12% 6%, rgba(214,143,176,0.14), transparent 38%),radial-gradient(circle at 92% 18%, rgba(76,154,106,0.06), transparent 40%),radial-gradient(circle at 50% 100%, rgba(67,42,78,0.6), transparent 55%),linear-gradient(180deg,#2A1930 0%,#1E1224 100%);}
body{transition:background .3s;}

/* collaboration */
.collab-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:rgba(76,154,106,.12);border:1px solid rgba(76,154,106,.3);border-radius:12px;padding:10px 12px;margin:0 0 14px;}
.collab-status{font-size:12px;color:var(--ink-text);display:flex;align-items:center;gap:7px;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(76,154,106,.12);}
.sync-dot.off{background:var(--muted);box-shadow:none;}

/* enhanced preparation + packing */
.prep-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.prep-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:rgba(255,255,255,.035);}
.prep-item .prep-icon{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:0 0 24px;font-size:12px;font-weight:800;background:rgba(255,255,255,.08);color:var(--muted);}
.prep-item.done .prep-icon{background:rgba(76,154,106,.2);color:#8fd1a7;}
.prep-item.partial .prep-icon{background:rgba(201,162,39,.18);color:var(--brass-light);}
.prep-item .prep-copy{flex:1;min-width:0;}
.prep-item .prep-title{font-size:12.5px;font-weight:650;}
.prep-item .prep-sub{font-size:10.5px;color:var(--muted);margin-top:2px;}
.prep-item button{border:0;background:none;color:var(--brass-light);font-size:11px;font-weight:700;padding:4px 0;}
.packing-summary{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;}
.packing-count{font-family:var(--font-display);font-size:28px;color:var(--paper);line-height:1;}
.packing-group{margin-bottom:12px;}
.packing-group-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 7px;}
.packing-group-title{font-size:12px;font-weight:700;color:var(--paper);}
.packing-group-count{font-family:var(--font-mono);font-size:10px;color:var(--muted);}
.packing-item{display:flex;align-items:center;gap:9px;padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.07);}
.packing-item:last-child{border-bottom:none;}
.packing-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--brass);}
.packing-item .packing-text{flex:1;font-size:13.5px;min-width:0;}
.packing-item .packing-text.done{text-decoration:line-through;color:var(--muted);}
.qty-badge{font-family:var(--font-mono);font-size:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);border-radius:999px;padding:3px 7px;color:var(--muted);}
.packing-add-grid{display:grid;grid-template-columns:minmax(0,1fr) 130px 72px auto;gap:8px;align-items:end;}
@media(max-width:600px){.packing-add-grid{grid-template-columns:1fr 1fr;}.packing-add-grid .packing-name{grid-column:1/-1;}.packing-add-grid .packing-add-btn{grid-column:1/-1;}}

/* ---------- printable itinerary preview ---------- */
#print-preview-root{position:fixed;inset:0;z-index:150;background:#eef1f4;color:#16202a;display:flex;flex-direction:column;}
.print-preview-toolbar{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px 14px;background:var(--ink-2);color:var(--ink-text);border-bottom:1px solid rgba(255,255,255,.12);flex-wrap:wrap;}
.print-preview-title{font-family:var(--font-display);font-size:20px;color:var(--paper);}
.print-preview-actions{display:flex;gap:8px;flex-wrap:wrap;}
.print-preview-scroll{overflow:auto;flex:1;padding:20px;}
.print-sheet{background:#fff;max-width:820px;margin:0 auto;padding:36px 42px;box-shadow:0 8px 30px rgba(0,0,0,.16);min-height:90vh;}
.print-hero{border-bottom:3px solid #C9A227;padding-bottom:18px;margin-bottom:22px}.print-brand{font-size:12px;letter-spacing:.18em;font-weight:700;color:#8a6d10}.print-hero h1{font-family:Arial,sans-serif;font-size:30px;margin:6px 0}.print-meta{font-size:14px;color:#59636d;display:flex;gap:16px;flex-wrap:wrap}.print-section{break-inside:avoid;margin:0 0 24px}.print-section h2{font-family:Arial,sans-serif;font-size:18px;margin:0 0 6px;border-bottom:1px solid #ddd;padding-bottom:6px}.print-date,.print-muted,.print-loc{color:#68737d;font-size:12px}.print-date{margin-bottom:8px}.print-sheet table{width:100%;border-collapse:collapse}.print-sheet td{padding:8px 6px;border-bottom:1px solid #ececec;vertical-align:top;font-size:13px}.print-time{width:78px;font-weight:700;color:#8a6d10}.print-footer{margin-top:30px;padding-top:12px;border-top:1px solid #ddd;font-size:10px;color:#7a838c;text-align:center}
@media(max-width:600px){.print-preview-toolbar{align-items:stretch}.print-preview-title{order:-1;width:100%}.print-preview-actions{width:100%}.print-preview-actions .btn{flex:1}.print-preview-scroll{padding:10px}.print-sheet{padding:24px 18px}.print-hero h1{font-size:25px}}

/* print */
@media print{
  body.print-preview-active{background:#fff !important;}
  body.print-preview-active::before, body.print-preview-active #app, body.print-preview-active #toast-container, body.print-preview-active .print-preview-toolbar{display:none !important;}
  body.print-preview-active #print-preview-root{display:block !important;position:static !important;background:#fff !important;}
  body.print-preview-active .print-preview-scroll{display:block !important;overflow:visible !important;padding:0 !important;}
  body.print-preview-active .print-sheet{display:block !important;max-width:none !important;margin:0 !important;padding:0 !important;box-shadow:none !important;min-height:0 !important;}
  body:not(.print-preview-active)::before, body:not(.print-preview-active) .topbar, body:not(.print-preview-active) .fab, body:not(.print-preview-active) #toast-container, body:not(.print-preview-active) .kebab-btn, body:not(.print-preview-active) .add-act-row{display:none !important;}
}

/* ===== Waypoint V2 enhancements ===== */
.seg{overflow-x:auto;justify-content:flex-start;scrollbar-width:none;}
.seg::-webkit-scrollbar{display:none;}
.seg button{min-width:86px;flex:1 0 auto;}
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
@media(max-width:620px){.metric-grid{grid-template-columns:1fr 1fr;}}
.metric-card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:13px;}
.metric-card .k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.metric-card .v{font-family:var(--font-display);font-size:24px;color:var(--paper);margin-top:3px;}
.overview-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;}
@media(max-width:620px){.overview-grid{grid-template-columns:1fr;}}
.quick-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.quick-actions .btn{justify-content:flex-start;}
.readiness{display:flex;align-items:center;gap:14px;}
.readiness-ring{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--brass) var(--ready),rgba(255,255,255,.08) 0);}
.readiness-ring::after{content:"";width:52px;height:52px;border-radius:50%;background:var(--teal);position:absolute;}
.readiness-ring{position:relative;}
.readiness-ring span{position:relative;z-index:1;font-family:var(--font-display);font-size:18px;color:var(--paper);}
.booking-card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:14px;margin-bottom:10px;}
.booking-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.booking-type{font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--brass-light);}
.booking-title{font-weight:700;margin-top:3px;}
.booking-meta{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5;}
.activity-meta{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:2px;}
.activity-meta a{color:var(--brass-light);text-decoration:none;}
.add-act-row .place-in{flex:1 1 150px;}
.progress-line{height:7px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-top:8px;}
.progress-line > div{height:100%;background:var(--brass);border-radius:999px;}


.readiness-card{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:16px;margin-bottom:14px;}
.readiness-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px;}
.readiness-score-wrap{display:flex;align-items:center;gap:14px;}
.readiness-ring{--p:0;position:relative;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--brass) calc(var(--p)*1%),rgba(255,255,255,.08) 0);}
.readiness-ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--ink-2);}
.readiness-ring strong{position:relative;z-index:1;font-family:var(--font-display);font-size:24px;color:var(--paper);}
.readiness-meta .eyebrow{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);}
.readiness-meta .status{font-family:var(--font-display);font-size:22px;color:var(--paper);margin-top:2px;}
.readiness-meta .caption{font-size:12px;color:var(--muted);margin-top:3px;max-width:420px;}
.readiness-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:560px){.readiness-grid{grid-template-columns:1fr;}.readiness-head{align-items:flex-start;}.readiness-ring{width:64px;height:64px;}}
.readiness-item{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:12px;}
.readiness-item-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px;}
.readiness-item-title{font-size:13px;font-weight:700;color:var(--ink-text);}
.readiness-item-pct{font-family:var(--font-mono);font-size:11px;color:var(--brass-light);}
.readiness-item-sub{font-size:11px;color:var(--muted);line-height:1.4;margin-top:7px;}
.readiness-item .pbar{height:6px;}
.readiness-item-actions{margin-top:9px;}
.readiness-item-actions button{padding:5px 9px;font-size:10.5px;}
.readiness-next{margin-top:12px;padding:12px;border-radius:12px;background:rgba(201,162,39,.08);border:1px solid rgba(201,162,39,.18);}
.readiness-next .title{font-size:11px;font-weight:700;color:var(--brass-light);text-transform:uppercase;letter-spacing:.05em;}
.readiness-next .text{font-size:12px;color:var(--ink-text);margin-top:4px;line-height:1.4;}


/* live collaboration chat */
.chat-modal{max-width:560px;}
.chat-shell{display:flex;flex-direction:column;gap:10px;}
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}

function tt(){ return T[state.lang]; }
function fmt(n){
  const value=Number(n);
  const safe=Number.isFinite(value)?Math.round((value+Number.EPSILON)*100)/100:0;
  return safe.toLocaleString(state.lang==='es'?'es-ES':'en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function money(n,cur){ return (cur||"USD")+" "+fmt(n); }

function roundMoney(n){
  const value=Number(n);
  if(!Number.isFinite(value)) return 0;
  return Math.round((value+Number.EPSILON)*100)/100;
}
function parseMoneyInput(value){
  if(value===null||value===undefined||value==='') return 0;
  const normalized=String(value).replace(/,/g,'').trim();
  return roundMoney(Number(normalized));
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ===================== storage ===================== */
if (typeof window.storage === 'undefined') {
  window.storage = {
    async get(key, shared){
      const k = (shared?'shared:':'priv:') + key;
      const v = window.localStorage.getItem(k);
      if (v === null) throw new Error('not found');
      return {key, value: v, shared: !!shared};
    },
    async set(key, value, shared){
      const k = (shared?'shared:':'priv:') + key;
      window.localStorage.setItem(k, value);
      return {key, value, shared: !!shared};
    },
    async delete(key, shared){
      const k = (shared?'shared:':'priv:') + key;
      window.localStorage.removeItem(k);
      return {key, deleted: true, shared: !!shared};
    },
    async list(prefix, shared){
      const pfx = (shared?'shared:':'priv:') + (prefix||'');
      const keys = Object.keys(window.localStorage).filter(k=>k.startsWith(pfx)).map(k=>k.slice((shared?'shared:':'priv:').length));
      return {keys};
    }
  };
}
async function loadState(){
  try{
    const r = await window.storage.get('waypoint-simple-data', false);
    if(r && r.value){ state = Object.assign(state, JSON.parse(r.value)); }
    if(!state.bookings) state.bookings={};
  }catch(e){ /* first run */ }
  render();
  setTimeout(handleCollabLink,50);
  if(!syncPoll) syncPoll=setInterval(syncAllLiveTrips,15000);
  setTimeout(refreshLiveStreams,150);
}
async function saveState(){
  try{ await window.storage.set('waypoint-simple-data', JSON.stringify(state), false); }catch(e){ console.error('save failed', e); }
  clearTimeout(syncDebounce);
  syncDebounce=setTimeout(()=>{ state.trips.filter(x=>x.liveSync).forEach(tr=>pushTripToCloud(tr)); },700);
}

/* ===================== helpers ===================== */
function daysBetween(d1,d2){ return Math.ceil((new Date(d2)-new Date(d1))/86400000); }
function tripById(id){ return state.trips.find(t=>t.id===id); }
function tripSpent(tripId){ return state.expenses.filter(e=>e.tripId===tripId).reduce((s,e)=>s+Number(e.amount),0); }
function catSpent(tripId,cat){ return state.expenses.filter(e=>e.tripId===tripId&&e.category===cat).reduce((s,e)=>s+Number(e.amount),0); }
function passportWarning(tr){
  if(!tr.passportExpiry) return null;
  const t=tt();
  const end = new Date(tr.end||tr.start);
  const expiry = new Date(tr.passportExpiry);
  const sixBefore = new Date(expiry); sixBefore.setMonth(sixBefore.getMonth()-6);
  if(expiry < end) return t.home.passportExpired || t.trip.passportExpired;
  if(sixBefore < end) return t.trip.passportSoon;
  return null;
}
function avatarInner(size){
  if(state.profile.photo) return `<img src="${state.profile.photo}" alt="" style="width:100%;height:100%;object-fit:cover;">`;
  return escapeHtml(state.profile.avatar||'✈');
}

/* ===================== toast ===================== */
function showToast(msg, undoFn){
  const t=tt();
  const c = document.getElementById('toast-container');
  const el = document.createElement('div'); el.className='toast';
  el.innerHTML = `<span>${msg}</span>` + (undoFn? `<button class="toast-undo">${t.common.undo}</button>`:'');
  if(undoFn){ el.querySelector('.toast-undo').onclick=()=>{ undoFn(); el.remove(); }; }
  c.appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),300); }, 5000);
}

/* ===================== confirm modal ===================== */
function askConfirm(message, onConfirm, danger, confirmLabel){
  ui.modal='confirm'; ui.confirmMessage=message; ui.confirmAction=onConfirm; ui.confirmDanger=!!danger; ui.confirmLabel=confirmLabel||null;
  render();
}
function cancelConfirm(){ ui.modal=null; ui.confirmAction=null; render(); }
function runConfirmAction(){ const fn=ui.confirmAction; ui.modal=null; ui.confirmAction=null; if(fn) fn(); else render(); }

/* ===================== image resize ===================== */
function resizeImageFile(file, maxSize, cb){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      let w=img.width, h=img.height;
      if(w>=h){ if(w>maxSize){ h=Math.round(h*maxSize/w); w=maxSize; } } else { if(h>maxSize){ w=Math.round(w*maxSize/h); h=maxSize; } }
      const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg',0.85));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function copyTextRobust(text){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}
  try{
    const ta=document.createElement('textarea');
    ta.value=text; ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.left='-9999px'; ta.style.top='0';
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,ta.value.length);
    const ok=document.execCommand('copy'); ta.remove();
    return !!ok;
  }catch(e){ return false; }
}

async function loadTripChat(tripId,quiet=false){
  const tr=tripById(tripId);
  if(!tr||!tr.liveSync||!tr.syncServer||!tr.shareId||!tr.editKey) return;
  try{
    const r=await fetch(`${tr.syncServer}/api/trips/${encodeURIComponent(tr.shareId)}/chat?key=${encodeURIComponent(tr.editKey)}`,{cache:'no-store'});
    if(!r.ok) throw new Error('chat '+r.status);
    const j=await r.json();
    ui.chatTripId=tripId;
    ui.chatMessages=Array.isArray(j.messages)?j.messages:[];
    tr.chatUnread=0;
    ui.chatLoading=false;
    if(ui.modal==='tripChat') render();
  }catch(e){
    ui.chatLoading=false;
    if(!quiet) showToast(state.lang==='es'?'No se pudo cargar el chat':'Could not load chat');
    if(ui.modal==='tripChat') render();
  }
}
function openTripChat(tripId){
  const tr=tripById(tripId);
  if(!tr||!tr.liveSync){
    showToast(state.lang==='es'?'Activa primero la colaboración en vivo':'Enable live collaboration first');
    return;
  }
  ui.chatTripId=tripId;
  ui.chatMessages=[];
  ui.chatLoading=true;
  tr.chatUnread=0;
  ui.modal='tripChat';
  render();
  loadTripChat(tripId);
}
async function sendTripChat(tripId){
  const tr=tripById(tripId);
  const input=document.getElementById('chat-input');
  const btn=document.getElementById('chat-send-btn');
  if(!tr||!input) return;

  const text=String(input.value||'').trim();
  if(!text){
    input.focus();
    return;
  }
  if(text.length>500){
    showToast(state.lang==='es'?'El mensaje puede tener máximo 500 caracteres':'Messages can be up to 500 characters');
    input.focus();
    return;
  }

  const name=ensureChatName(tripId);
  if(!name){
    input.focus();
    return;
  }

  input.disabled=true;
  if(btn) btn.disabled=true;

  try{
    const r=await fetch(`${tr.syncServer}/api/trips/${encodeURIComponent(tr.shareId)}/chat`,{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Edit-Key':tr.editKey},
      body:JSON.stringify({
        text,
        name,
        participantId:chatParticipantId()
      })
    });

    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||`chat ${r.status}`);

    input.value='';
    await loadTripChat(tripId,true);
  }catch(e){
    console.error('Waypoint chat send failed:',e);
    showToast(state.lang==='es'?'No se pudo enviar el mensaje':'Could not send message');
  }finally{
    const current=document.getElementById('chat-input');
    const currentBtn=document.getElementById('chat-send-btn');
    if(current){
      current.disabled=false;
      current.focus();
    }
    if(currentBtn) currentBtn.disabled=false;
  }
}
function chatKeydown(e,tripId){
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    sendTripChat(tripId);
  }
}


async function registerCollabParticipant(tr){
  if(!tr||!tr.liveSync||!tr.shareId||!tr.editKey) return false;
  const name=ensureChatName(tr.id);
  if(!name) return false;
  tr.collabParticipantName=name;
  tr.collabParticipantId=tr.collabParticipantId||chatParticipantId();
  try{
    const r=await fetch(`${tr.syncServer}/api/trips/${encodeURIComponent(tr.shareId)}/participants`,{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Edit-Key':tr.editKey},
      body:JSON.stringify({name,participantId:tr.collabParticipantId})
    });
    if(!r.ok) throw new Error('participant '+r.status);
    const j=await r.json();
    tr.collabParticipants=Array.isArray(j.participants)?j.participants:[];
    await saveState();
    return true;
  }catch(e){
    console.error(e);
    return false;
  }
}
async function loadCollabParticipants(tripId){
  const tr=tripById(tripId);
  if(!tr||!tr.liveSync) return [];
  try{
    const r=await fetch(`${tr.syncServer}/api/trips/${encodeURIComponent(tr.shareId)}/participants?key=${encodeURIComponent(tr.editKey)}`,{cache:'no-store'});
    if(!r.ok) return [];
    const j=await r.json();
    tr.collabParticipants=Array.isArray(j.participants)?j.participants:[];
    return tr.collabParticipants;
  }catch(e){ return []; }
}
function collabParticipantsText(tr){
  const names=(tr?.collabParticipants||[]).map(p=>p.name).filter(Boolean);
  if(!names.length) return '';
  return names.slice(0,4).join(' · ')+(names.length>4?` +${names.length-4}`:'');
}
async function stopLiveCollaboration(tripId){
  const tr=tripById(tripId); if(!tr) return;
  const es=waypointLang()==='es';
  if(!tr.collabOwner||!tr.ownerKey){
    showToast(es?'Solo el propietario puede desactivar el enlace compartido.':'Only the owner can disable the shared link.');
    return;
  }
  if(!confirm(es?'¿Dejar de compartir este viaje? El enlace actual dejará de funcionar para todos los participantes. Tu copia local se conservará.':'Stop sharing this trip? The current link will stop working for every participant. Your local copy will be kept.')) return;
  try{
    const r=await fetch(`${tr.syncServer}/api/trips/${encodeURIComponent(tr.shareId)}`,{
      method:'DELETE',
      headers:{'X-Owner-Key':tr.ownerKey}
    });
    if(!r.ok) throw new Error('revoke '+r.status);
    closeLiveStream(tr.id);
    tr.liveSync=false; tr.collabOwner=false;
    delete tr.editKey; delete tr.ownerKey; delete tr.syncServer; delete tr.syncRevision; delete tr.lastSyncedAt;
    delete tr.shareId; delete tr.collabParticipants; delete tr.chatUnread;
    await saveState(); render();
    showToast(es?'Colaboración desactivada. El enlace anterior ya no funciona.':'Collaboration stopped. The previous link no longer works.');
  }catch(e){
    console.error(e);
    showToast(es?'No se pudo desactivar la colaboración.':'Could not stop collaboration.');
  }
}
async function leaveLiveCollaboration(tripId){
  const tr=tripById(tripId); if(!tr) return;
  const es=waypointLang()==='es';
  if(!confirm(es?'¿Salir de este viaje compartido? Conservarás una copia local, pero dejará de sincronizarse.':'Leave this shared trip? You will keep a local copy, but it will stop syncing.')) return;
  closeLiveStream(tr.id);
  tr.liveSync=false; tr.collabOwner=false;

  delete tr.shareId; delete tr.collabParticipants; delete tr.chatUnread;

}

async function startLiveCollaboration(tripId){
  const tr=tripById(tripId); if(!tr) return;
  const es=waypointLang()==='es';
  const participantName=ensureChatName(tripId);
  if(!participantName) return;

  let server=tr.syncServer||collabServer();
  if(!server){ server=prompt(es?'Ingresa la URL de tu servidor Waypoint Sync:':'Enter your Waypoint Sync server URL:','')||''; }
  server=server.trim().replace(/\/$/,''); if(!server) return;

  setCollabServer(server);
  ensureShareId(tr);
  if(!tr.editKey) tr.editKey=randomKey();
  if(!tr.ownerKey) tr.ownerKey=randomKey();
  tr.collabOwner=true;
  tr.collabParticipantName=participantName;
  tr.collabParticipantId=tr.collabParticipantId||chatParticipantId();
  tr.syncServer=server;
  tr.liveSync=true;
  tr.syncRevision=Number(tr.syncRevision||0);

  await saveState();
  const ok=await pushTripToCloud(tr,false); if(!ok) return;
  await registerCollabParticipant(tr);
  ensureLiveStream(tr);

  const base=location.origin && location.origin!=='null' ? location.origin+location.pathname : location.href.split('#')[0];
  // Owner key is deliberately NOT included in the invitation.
  const link=`${base}#collab=${encodeURIComponent(tr.shareId)}&key=${encodeURIComponent(tr.editKey)}&server=${encodeURIComponent(server)}`;

  try{
    if(navigator.share){
      await navigator.share({title:tr.name,text:es?'Te invito a colaborar conmigo en este viaje de Waypoint. Al abrir el enlace, identifícate con tu nombre:':'I’m inviting you to collaborate on this Waypoint trip. When you open the link, identify yourself with your name:',url:link});
    }else{
      await copyTextRobust(link);
      showToast(es?'Enlace colaborativo copiado':'Collaboration link copied');
    }
  }catch(e){
    if(e && e.name==='AbortError') return;
    try{ await copyTextRobust(link); showToast(es?'Enlace colaborativo copiado':'Collaboration link copied'); }
    catch(_){ showCopyFallback(link,es?'Enlace de colaboración':'Collaboration link'); }
  }
  render();
}
function livePayload(tr){
  if(!tr.collabDeleted) tr.collabDeleted={days:[],activities:[],bookings:[]};
  return {waypointLive:1,shareId:tr.shareId,trip:{name:tr.name,destination:tr.destination,tripType:tr.tripType||'',start:tr.start,end:tr.end},days:state.itineraries[tr.id]||[],bookings:state.bookings[tr.id]||[],deleted:tr.collabDeleted};
}
function uniqById(remote,local){
  const m=new Map();
  (remote||[]).forEach(x=>x&&x.id&&m.set(x.id,JSON.parse(JSON.stringify(x))));
  (local||[]).forEach(x=>x&&x.id&&m.set(x.id,JSON.parse(JSON.stringify(x))));
  return [...m.values()];
}
function unionIds(a,b){ return [...new Set([...(a||[]),...(b||[])])]; }
function mergeLivePayload(local,remote){
  local=local||{}; remote=remote||{};
  const deleted={
    days:unionIds(remote.deleted&&remote.deleted.days,local.deleted&&local.deleted.days),
    activities:unionIds(remote.deleted&&remote.deleted.activities,local.deleted&&local.deleted.activities),
    bookings:unionIds(remote.deleted&&remote.deleted.bookings,local.deleted&&local.deleted.bookings)
  };
  const remoteDays=remote.days||[], localDays=local.days||[];
  const byDay=new Map();
  remoteDays.forEach(d=>{ if(d&&d.id) byDay.set(d.id,JSON.parse(JSON.stringify(d))); });
  localDays.forEach(d=>{
    if(!d||!d.id) return;
    const prev=byDay.get(d.id)||{};
    const merged=Object.assign({},prev,JSON.parse(JSON.stringify(d)));
    merged.activities=uniqById(prev.activities||[],d.activities||[]).filter(a=>!deleted.activities.includes(a.id));
    merged.activities.sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
    byDay.set(d.id,merged);
  });
  const days=[...byDay.values()].filter(d=>!deleted.days.includes(d.id));
  const bookings=uniqById(remote.bookings||[],local.bookings||[]).filter(b=>!deleted.bookings.includes(b.id));
  return {waypointLive:1,shareId:local.shareId||remote.shareId,trip:Object.assign({},remote.trip||{},local.trip||{}),days,bookings,deleted};
}
function applyLivePayload(tr,d){
  d=d||{};
  Object.assign(tr,d.trip||{});
  tr.collabDeleted=d.deleted||tr.collabDeleted||{days:[],activities:[],bookings:[]};
  state.itineraries[tr.id]=d.days||[];
  state.bookings[tr.id]=d.bookings||[];
}
let syncBusy=false, syncDebounce=null, syncPoll=null;

let liveStreams=new Map();
function closeLiveStream(tripId){
  const es=liveStreams.get(tripId);
  if(es){ try{es.close();}catch(e){} liveStreams.delete(tripId); }
}
function ensureLiveStream(tr){
  if(!tr||!tr.liveSync||!tr.syncServer||!tr.shareId||!tr.editKey||typeof EventSource==='undefined') return;
  if(liveStreams.has(tr.id)) return;
  try{
    const url=`${tr.syncServer}/api/trips/${encodeURIComponent(tr.shareId)}/events?key=${encodeURIComponent(tr.editKey)}`;
    const es=new EventSource(url);
    liveStreams.set(tr.id,es);
    es.addEventListener('revision',async ev=>{
      try{
        const msg=JSON.parse(ev.data||'{}');
        if(Number(msg.revision||0)>Number(tr.syncRevision||0)) await pullTripFromCloud(tr);
      }catch(e){}
    });
    es.addEventListener('chat',async ev=>{
      try{
        if(ui.modal==='tripChat'&&ui.chatTripId===tr.id){
          await loadTripChat(tr.id,true);
        }else{
          tr.chatUnread=Number(tr.chatUnread||0)+1;
          render();
        }
      }catch(e){}
    });
    es.addEventListener('participants',async ()=>{
      try{
        await loadCollabParticipants(tr.id);
        if(ui.modal==='tripChat') render();
      }catch(e){}
    });
    es.onerror=()=>{
      // EventSource reconnects automatically; polling remains active as a fallback.
    };
  }catch(e){}
}
function refreshLiveStreams(){
  const active=new Set();
  state.trips.filter(x=>x.liveSync).forEach(tr=>{ active.add(tr.id); ensureLiveStream(tr); });
  [...liveStreams.keys()].forEach(id=>{ if(!active.has(id)) closeLiveStream(id); });
}

async function pushTripToCloud(tr,force=false){
  if(!tr||!tr.liveSync||!tr.syncServer||!tr.shareId||!tr.editKey) return false;
  try{
    const local=livePayload(tr);
    let r=await fetch(`${tr.syncServer}/api/trips/${encodeURIComponent(tr.shareId)}`,{method:'PUT',headers:{'Content-Type':'application/json','X-Edit-Key':tr.editKey,...(tr.ownerKey?{'X-Owner-Key':tr.ownerKey}:{})},body:JSON.stringify({data:local,clientRevision:Number(tr.syncRevision||0),force:!!force})});
    if(r.status===409){
      const conflict=await r.json();
      const merged=mergeLivePayload(local,conflict.data||{});
      applyLivePayload(tr,merged);
      tr.syncRevision=Number(conflict.revision||0);
      r=await fetch(`${tr.syncServer}/api/trips/${encodeURIComponent(tr.shareId)}`,{method:'PUT',headers:{'Content-Type':'application/json','X-Edit-Key':tr.editKey,...(tr.ownerKey?{'X-Owner-Key':tr.ownerKey}:{})},body:JSON.stringify({data:merged,clientRevision:tr.syncRevision,force:false})});
    }
    if(!r.ok) throw new Error('sync '+r.status);
    const j=await r.json();
    tr.syncRevision=j.revision||tr.syncRevision;
    tr.lastSyncedAt=new Date().toISOString();
    await window.storage.set('waypoint-simple-data',JSON.stringify(state),false);
    return true;
  }catch(e){ console.error(e); showToast(state.lang==='es'?'No se pudo sincronizar con la nube':'Cloud sync failed'); return false; }
}
async function pullTripFromCloud(tr){
  if(!tr||!tr.liveSync||!tr.syncServer||!tr.shareId||!tr.editKey) return false;
  try{
    const r=await fetch(`${tr.syncServer}/api/trips/${encodeURIComponent(tr.shareId)}?key=${encodeURIComponent(tr.editKey)}`);
    if(r.status===404){
      closeLiveStream(tr.id);
      tr.liveSync=false; tr.collabOwner=false;
      delete tr.editKey; delete tr.ownerKey; delete tr.syncServer; delete tr.syncRevision; delete tr.shareId;
      await saveState(); render();
      showToast(state.lang==='es'?'El propietario dejó de compartir este viaje. Conservas una copia local.':'The owner stopped sharing this trip. You still have a local copy.');
      return false;
    }
    if(!r.ok) throw new Error('pull '+r.status); const j=await r.json();
    if(Number(j.revision||0)>Number(tr.syncRevision||0)){
      const d=j.data||{}; applyLivePayload(tr,d); tr.syncRevision=j.revision; tr.lastSyncedAt=new Date().toISOString(); await window.storage.set('waypoint-simple-data',JSON.stringify(state),false); render(); showToast(state.lang==='es'?'Cambios colaborativos actualizados':'Collaborative changes updated');
    }
    return true;
  }catch(e){ return false; }
}
async function syncTripNow(id){ const tr=tripById(id); if(!tr) return; await pullTripFromCloud(tr); await pushTripToCloud(tr); render(); }
async function syncAllLiveTrips(){ if(syncBusy) return; syncBusy=true; try{ for(const tr of state.trips.filter(x=>x.liveSync)) await pullTripFromCloud(tr); }finally{syncBusy=false;} }
async function handleCollabLink(){
  const h=new URLSearchParams(location.hash.replace(/^#/,''));
  const shareId=h.get('collab'), key=h.get('key'), server=(h.get('server')||'').replace(/\/$/,'');
  if(!shareId||!key||!server) return;
  setCollabServer(server);
  const es=waypointLang()==='es';
  try{
    const r=await fetch(`${server}/api/trips/${encodeURIComponent(shareId)}?key=${encodeURIComponent(key)}`);
    if(!r.ok) throw new Error('join');
    const j=await r.json(); const d=j.data||{};
    let tr=state.trips.find(x=>x.shareId===shareId);
    if(!tr){
      const id=uid();
      tr={id,name:(d.trip&&d.trip.name)||'Shared trip',destination:(d.trip&&d.trip.destination)||'',tripType:(d.trip&&d.trip.tripType)||'',start:(d.trip&&d.trip.start)||'',end:(d.trip&&d.trip.end)||'',budgetGoal:0,currency:state.profile.currency||'USD',passportExpiry:'',notes:'',coverPhoto:'',shareId};
      state.trips.push(tr);
    }
    applyLivePayload(tr,d);
    tr.editKey=key; tr.syncServer=server; tr.liveSync=true; tr.collabOwner=false;
    tr.syncRevision=j.revision||0; tr.lastSyncedAt=new Date().toISOString();
    tr.collabParticipantId=tr.collabParticipantId||chatParticipantId();

    // Identify the participant before joining so chat already knows who they are.
    let name=String(tr.collabParticipantName||state.profile?.name||localStorage.getItem('waypoint-chat-name')||'').trim().slice(0,60);
    if(!name){
      name=(prompt('Antes de unirte al viaje, escribe tu nombre para que los demás participantes sepan quién eres.\n\nBefore joining the trip, enter your name so the other participants know who you are.','')||'').trim().slice(0,60);
    }
    if(!name) throw new Error('name required');
    tr.collabParticipantName=name;
    localStorage.setItem('waypoint-chat-name',name);

    await window.storage.set('waypoint-simple-data',JSON.stringify(state),false);
    await registerCollabParticipant(tr);
    history.replaceState(null,'',location.pathname+location.search);
    ensureLiveStream(tr);
    openTrip(tr.id);
    showToast(es?`Te uniste al viaje como ${name}`:`Joined the trip as ${name}`);
  }catch(e){
    console.error(e);
    showToast(es?'No se pudo abrir el viaje compartido':'Could not open shared trip');
  }
}

async function shareItineraryFile(tripId){
  const t=tt();
  const tr = tripById(tripId);
  if(!tr) return;
  const payload = buildItineraryPayload(tr);
  const json = JSON.stringify(payload, null, 2);
  const slug = (tr.name||'trip').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'trip';
  const filename = `${slug}-itinerary.json`;
  const blob = new Blob([json], {type:'application/json'});
  let file=null;
  try{ file = new File([blob], filename, {type:'application/json'}); }catch(e){}
  try{
    if(file && navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:t.itinerary.shareTitle.replace('{name}', tr.name), text:t.itinerary.shareText});
      return;
    }
  }catch(e){
    if(e && e.name==='AbortError') return;
  }
  const summary = `${t.itinerary.shareTitle.replace('{name}',tr.name)}\n${tr.destination||''}\n${tr.start||''} → ${tr.end||''}`;
  try{
    if(navigator.share){
      await navigator.share({title:tr.name,text:summary});
      downloadItineraryBlob(blob,filename,false);
      showToast(state.lang==='es'?'También se descargó el archivo editable del itinerario':'The editable itinerary file was also downloaded');
      return;
    }
  }catch(e){
    if(e && e.name==='AbortError') return;
  }
  const ok=downloadItineraryBlob(blob,filename,true);
  if(!ok) openShareFallback(tr.name, summary+'\n\n'+json);
}
function downloadItineraryBlob(blob,filename,notify=true){
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=filename; a.style.display='none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    if(notify) showToast(tt().itinerary.fileSaved);
    return true;
  }catch(e){ return false; }
}
function triggerImportItinerary(){ document.getElementById('import-itinerary-file').click(); }
function importItineraryFile(evt){
  const t=tt();
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data || !data.waypointShare || !data.shareId) throw new Error('bad format');
      const existing = state.trips.find(x=>x.shareId===data.shareId);
      if(existing){
        askConfirm(t.itinerary.importUpdateConfirm.replace('{name}', existing.name), ()=>{
          existing.name = data.name; existing.destination = data.destination; existing.tripType = data.tripType||existing.tripType;
          existing.start = data.start; existing.end = data.end;
          state.itineraries[existing.id] = data.days||[]; state.bookings[existing.id] = data.bookings||state.bookings[existing.id]||[];
          saveState(); render();
          showToast(t.itinerary.importUpdated);
          openTrip(existing.id);
        }, false, t.common.continueLabel);
      } else {
        const newId = uid();
        state.trips.push({id:newId, name:data.name||'Shared trip', destination:data.destination||'', tripType:data.tripType||'',
          start:data.start||'', end:data.end||'', budgetGoal:0, currency:state.profile.currency||'USD',
          passportExpiry:'', notes:'', coverPhoto:'', shareId:data.shareId});
        state.itineraries[newId] = data.days||[]; state.bookings[newId] = data.bookings||[];
        saveState(); render();
        showToast(t.itinerary.importAdded);
        openTrip(newId);
      }
    }catch(e){ showToast(t.itinerary.importError); }
  };
  reader.readAsText(file);
  evt.target.value = '';
}
function deleteTrip(id){
  ui.modal=null;
  const t=tt();
  askConfirm(t.home.confirmDelete, ()=>doDeleteTrip(id), true);
}
function doDeleteTrip(id){
  const t=tt();
  const idx = state.trips.findIndex(x=>x.id===id);
  if(idx===-1) return;
  const removedTrip = state.trips[idx];
  const removedExpenses = state.expenses.filter(x=>x.tripId===id);
  const removedChecklist = state.checklists[id];
  const removedItin = state.itineraries[id];
  const removedDocs = state.tripDocs[id];
  const removedBookings = state.bookings[id];
  state.trips = state.trips.filter(x=>x.id!==id);
  state.expenses = state.expenses.filter(x=>x.tripId!==id);
  delete state.checklists[id]; delete state.itineraries[id]; delete state.tripDocs[id]; delete state.bookings[id];
  if(ui.currentTripId===id){ ui.screen='home'; ui.currentTripId=null; }
  saveState(); render();
  showToast(t.home.deleted, ()=>{
    state.trips.splice(idx,0,removedTrip);
    state.expenses.push(...removedExpenses);
    if(removedChecklist) state.checklists[id]=removedChecklist;
    if(removedItin) state.itineraries[id]=removedItin;
    if(removedDocs) state.tripDocs[id]=removedDocs;
    if(removedBookings) state.bookings[id]=removedBookings;
    saveState(); render();
  });
}

/* currency select helper */
function currencySelectHtml(id, selected){
  const opts = CURRENCIES.map(c=>{
    const label = `${c.flag} ${c.code} — ${state.lang==='es'?c.es:c.en}`;
    return `<option value="${c.code}" ${selected===c.code?'selected':''}>${label}</option>`;
  }).join('');
  const otherLabel = state.lang==='es'? '✎ Otra (escribir código)':'✎ Other (type code)';
  const isOther = selected && !CURRENCIES.some(c=>c.code===selected);
  return `<select id="${id}" onchange="handleCurrencySelect('${id}')">
    ${opts}<option value="OTHER" ${isOther?'selected':''}>${otherLabel}</option>
  </select>
  <input id="${id}-custom" placeholder="${state.lang==='es'?'Código, ej. THB':'Code, e.g. THB'}" maxlength="4"
    style="text-transform:uppercase;margin-top:8px;display:${isOther?'block':'none'};" value="${isOther?escapeHtml(selected):''}">`;
}
function handleCurrencySelect(id){
  const sel = document.getElementById(id); const custom = document.getElementById(id+'-custom');
  if(!sel||!custom) return;
  custom.style.display = sel.value==='OTHER'? 'block':'none';
  if(sel.value==='OTHER') custom.focus();
}
function readCurrencyField(id){
  const sel = document.getElementById(id); if(!sel) return 'USD';
  if(sel.value==='OTHER'){ const c=document.getElementById(id+'-custom'); return (c&&c.value.trim().toUpperCase())||'USD'; }
  return sel.value;
}

function tripDurationDays(tr){
  if(!tr?.start||!tr?.end) return 0;
  const a=new Date(`${tr.start}T12:00:00`), b=new Date(`${tr.end}T12:00:00`);
  if(Number.isNaN(a.getTime())||Number.isNaN(b.getTime())||b<a) return 0;
  return Math.floor((b-a)/86400000)+1;
}
function clamp01(n){ return Math.max(0,Math.min(1,Number(n)||0)); }
function pct01(n){ return Math.round(clamp01(n)*100); }
function computeTripReadiness(tr){
  const es=state.lang==='es';
  const days=Array.isArray(state.itineraries[tr.id])?state.itineraries[tr.id]:[];
  const bookings=Array.isArray(state.bookings[tr.id])?state.bookings[tr.id]:[];
  const packing=Array.isArray(state.checklists[tr.id])?state.checklists[tr.id]:[];
  const docs=Array.isArray(state.tripDocs[tr.id])?state.tripDocs[tr.id]:[];
  const expenses=Array.isArray(state.expenses)?state.expenses.filter(x=>x.tripId===tr.id):[];
  const duration=tripDurationDays(tr);

  // 1) Core trip information — 10%
  const coreChecks=[
    Boolean(String(tr.name||'').trim()),
    Boolean(String(tr.destination||'').trim()),
    Boolean(tr.start),
    Boolean(tr.end),
    Boolean(duration>0)
  ];
  const core=coreChecks.filter(Boolean).length/coreChecks.length;

  // 2) Itinerary — 25%
  // Measures both day coverage and actual activity coverage across the trip.
  const datedDays=new Set(days.map(d=>d?.date).filter(Boolean));
  const daysWithActivities=days.filter(d=>Array.isArray(d?.activities)&&d.activities.length>0);
  const totalActivities=days.reduce((n,d)=>n+(Array.isArray(d?.activities)?d.activities.length:0),0);
  const expectedDays=duration||Math.max(days.length,1);
  const plannedDayCoverage=clamp01((duration?datedDays.size:days.length)/expectedDays);
  const activeDayCoverage=clamp01(daysWithActivities.length/expectedDays);
  const activityDepth=daysWithActivities.length
    ? clamp01(totalActivities/(daysWithActivities.length*2)) // 2 activities/day = fully developed day
    : 0;
  const itinerary=clamp01(plannedDayCoverage*.35 + activeDayCoverage*.45 + activityDepth*.20);

  // 3) Bookings — 20%
  // Each saved booking is graded for completeness. No booking = 0 because the section is not prepared yet.
  const bookingCompleteness=(b)=>{
    const parts=[
      {v:Boolean(b?.type),w:.10},
      {v:Boolean(String(b?.title||'').trim()),w:.25},
      {v:Boolean(b?.date),w:.20},
      {v:Boolean(String(b?.provider||'').trim()),w:.15},
      {v:Boolean(String(b?.confirmation||'').trim()),w:.20},
      {v:Boolean(String(b?.location||'').trim()),w:.10}
    ];
    return parts.reduce((s,p)=>s+(p.v?p.w:0),0);
  };
  const bookingsScore=bookings.length
    ? clamp01(bookings.reduce((s,b)=>s+bookingCompleteness(b),0)/bookings.length)
    : 0;

  // 4) Packing — 20%
  // Quantity-aware: 3 shirts count as 3 units, not one row.
  const packingTotals=packing.reduce((acc,it)=>{
    const qty=Math.max(1,Number(it?.qty)||1);
    acc.total+=qty;
    if(it?.done) acc.done+=qty;
    return acc;
  },{total:0,done:0});
  const packingScore=packingTotals.total?clamp01(packingTotals.done/packingTotals.total):0;

  // 5) Budget — 15%
  // A defined budget is ready while within limit; overspending proportionally reduces readiness.
  const budget=Number(tr.budgetGoal||0);
  const spent=tripSpent(tr.id);
  let budgetScore=0;
  if(budget>0){
    budgetScore=spent<=budget?1:clamp01(budget/spent);
  }

  // 6) Travel information / documents — 10%
  // Notes/doc entries are scored by completeness. Passport validity contributes when supplied.
  const completeDocs=docs.filter(d=>String(d?.label||'').trim()&&String(d?.value||'').trim()).length;
  const docBase=docs.length?completeDocs/docs.length:0;
  let passportFactor=null;
  if(tr.passportExpiry){
    const warning=passportWarning(tr);
    passportFactor=warning?0:1;
  }
  // If passport is supplied, combine it with notes; otherwise notes determine this section.
  const docsScore=passportFactor===null?clamp01(docBase):clamp01(docBase*.65+passportFactor*.35);

  const specs=[
    {
      key:'details',weight:10,score:core,title:es?'Datos del viaje':'Trip details',
      sub:core===1?(es?'Destino y fechas válidas completos.':'Destination and valid dates complete.'):(es?'Completa nombre, destino y fechas válidas.':'Complete name, destination and valid dates.'),
      tab:null
    },
    {
      key:'itinerary',weight:25,score:itinerary,title:es?'Itinerario':'Itinerary',
      sub:es
        ?`${days.length}/${expectedDays} días creados · ${daysWithActivities.length} con actividades · ${totalActivities} actividades`
        :`${days.length}/${expectedDays} days created · ${daysWithActivities.length} with activities · ${totalActivities} activities`,
      tab:'itinerary'
    },
    {
      key:'bookings',weight:20,score:bookingsScore,title:es?'Reservas':'Bookings',
      sub:bookings.length
        ?(es?`${bookings.length} reservas · ${pct01(bookingsScore)}% completas`:`${bookings.length} bookings · ${pct01(bookingsScore)}% complete`)
        :(es?'Agrega y completa tus reservas.':'Add and complete your bookings.'),
      tab:'bookings'
    },
    {
      key:'packing',weight:20,score:packingScore,title:es?'Equipaje':'Packing',
      sub:packingTotals.total
        ?(es?`${packingTotals.done} de ${packingTotals.total} unidades listas`:`${packingTotals.done} of ${packingTotals.total} units packed`)
        :(es?'Crea tu lista y marca lo empacado.':'Create your list and mark packed items.'),
      tab:'checklist'
    },
    {
      key:'budget',weight:15,score:budgetScore,title:es?'Presupuesto':'Budget',
      sub:budget>0
        ?(spent<=budget
          ?(es?`${money(spent,tr.currency)} de ${money(budget,tr.currency)} · dentro del presupuesto`:`${money(spent,tr.currency)} of ${money(budget,tr.currency)} · within budget`)
          :(es?`Excedido por ${money(spent-budget,tr.currency)}`:`Over by ${money(spent-budget,tr.currency)}`))
        :(es?'Define un presupuesto total.':'Set a total trip budget.'),
      tab:'budget'
    },
    {
      key:'docs',weight:10,score:docsScore,title:es?'Información y documentos':'Travel info & documents',
      sub:docs.length
        ?(es?`${completeDocs}/${docs.length} notas completas${tr.passportExpiry?' · pasaporte revisado':''}`:`${completeDocs}/${docs.length} notes complete${tr.passportExpiry?' · passport checked':''}`)
        :(tr.passportExpiry
          ?(es?'Pasaporte revisado; agrega confirmaciones o datos útiles.':'Passport checked; add confirmations or useful travel info.')
          :(es?'Agrega confirmaciones, documentos o información importante.':'Add confirmations, documents or important travel information.')),
      tab:'notes'
    }
  ];

  const total=specs.reduce((sum,s)=>sum+s.weight*clamp01(s.score),0);
  return {
    ready:Math.round(total),
    steps:specs.map(s=>({
      ...s,
      contribution:Math.round(s.weight*clamp01(s.score)*10)/10,
      pct:pct01(s.score),
      done:s.score>=.999,
      partial:s.score>0&&s.score<.999
    })),
    packingTotals,
    totalActivities,
    daysWithActivities:daysWithActivities.length,
    expectedDays,
    expensesCount:expenses.length
  };
}


function readinessStatusText(score){
  const es=state.lang==='es';
  if(score>=100) return {
    title:es?'Listo para viajar':'Ready to go',
    caption:es?'Tu planificación está completa según la información registrada.':'Your trip plan is complete based on the information you’ve added.'
  };
  if(score>=85) return {
    title:es?'Casi listo':'Almost ready',
    caption:es?'La mayor parte del viaje está preparada. Solo quedan algunos detalles.':'Most of your trip is prepared. Only a few details remain.'
  };
  if(score>=60) return {
    title:es?'Buen progreso':'Good progress',
    caption:es?'Tu viaje va tomando forma. Completa las áreas pendientes para llegar listo.':'Your trip is taking shape. Finish the remaining areas to be fully prepared.'
  };
  if(score>=30) return {
    title:es?'En preparación':'In progress',
    caption:es?'Ya comenzaste a organizar el viaje, pero aún faltan varios elementos importantes.':'You’ve started planning, but several important items still need attention.'
  };
  return {
    title:es?'Comenzando':'Getting started',
    caption:es?'Completa la información principal para empezar a preparar el viaje.':'Add the key trip details to start building your travel plan.'
  };
}
function readinessNextAction(steps){
  const es=state.lang==='es';
  const pending=[...steps].filter(x=>x.pct<100).sort((a,b)=>(a.pct-b.pct)||(b.weight-a.weight));
  if(!pending.length) return es?'Todo está listo. Revisa los detalles finales antes de salir.':'Everything is ready. Review final details before departure.';
  const x=pending[0];
  const map={
    details:es?'Completa los datos principales del viaje.':'Complete the main trip details.',
    itinerary:es?'Continúa organizando los días y actividades del itinerario.':'Continue planning your itinerary days and activities.',
    bookings:es?'Revisa y completa las reservas pendientes.':'Review and complete your outstanding bookings.',
    packing:es?'Avanza con el equipaje y marca lo que ya tienes listo.':'Continue packing and mark items as they’re ready.',
    budget:es?'Define o revisa el presupuesto del viaje.':'Set or review your trip budget.',
    docs:es?'Agrega la información y documentos importantes para el viaje.':'Add important travel information and documents.'
  };
  return map[x.key]||x.sub;
}

function findNextActivity(tr){
  const days=(state.itineraries[tr.id]||[]).slice();
  const now=new Date();
  const items=[];
  days.forEach((d,idx)=>(d.activities||[]).forEach(a=>{
    let dt=null;
    if(d.date){
      const time=(a.time&&/^\\d{1,2}:\\d{2}/.test(a.time))?a.time:'23:59';
      dt=new Date(d.date+'T'+time);
    }
    items.push({dayLabel:displayDayLabel(d,idx),date:d.date||'',dt,...a});
  }));
  const future=items.filter(x=>x.dt && x.dt>=now).sort((a,b)=>a.dt-b.dt);
  if(future.length) return future[0];
  return items[0]||null;
}

function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const rawData=atob(base64);
  return Uint8Array.from([...rawData].map(ch=>ch.charCodeAt(0)));
}
async function getPushSubscription(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)) throw new Error('push_unsupported');
  let permission=Notification.permission;
  if(permission==='default') permission=await Notification.requestPermission();
  if(permission!=='granted') throw new Error('permission_denied');
  const keyRes=await fetch('/api/notifications/vapid-public-key',{cache:'no-store'});
  if(!keyRes.ok) throw new Error('push_not_configured');
  const keyData=await keyRes.json();
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(keyData.publicKey)});
  return sub.toJSON();
}
async function enableFlightAlerts(tripId,booking){
  const es=state.lang==='es';
  if(!booking?.flightNumber||!booking?.date){
    showToast(es?'Para activar alertas necesitas número de vuelo y fecha.':'Flight number and date are required for alerts.');
    return false;
  }
  try{
    const subscription=await getPushSubscription();
    const token=booking.flightWatchToken||randomKey()+randomKey();
    const r=await fetch('/api/flight-watches',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        token,
        flightNumber:booking.flightNumber.trim().toUpperCase(),
        date:booking.date,
        origin:(booking.origin||'').trim().toUpperCase(),
        destination:(booking.destination||'').trim().toUpperCase(),
        bookingTitle:booking.title||booking.flightNumber,
        subscription
      })
    });
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||'watch_failed');
    booking.flightWatchId=j.id;
    booking.flightWatchToken=token;
    booking.flightAlertsActive=true;
    booking.flightAlertProvider=j.provider||'FlightAware';
    booking.flightAlertStatus=j.status||'active';
    await saveState();
    render();
    showToast(es?'Alertas de vuelo activadas.':'Flight alerts enabled.');
    return true;
  }catch(e){
    console.error(e);
    const msg=String(e.message||e);
    if(msg.includes('permission_denied')) showToast(es?'Debes permitir notificaciones para recibir alertas de vuelo.':'Allow notifications to receive flight alerts.');
    else if(msg.includes('push_unsupported')) showToast(es?'Este dispositivo no admite notificaciones web en este modo. En iPhone instala Waypoint en la pantalla de inicio.':'This device does not support web notifications in this mode. On iPhone, install Waypoint to the Home Screen.');
    else if(msg.includes('flight_provider_not_configured')) showToast(es?'Las alertas están listas en Waypoint, pero falta conectar la API de vuelos en Railway.':'Waypoint is ready for flight alerts, but the flight API still needs to be connected in Railway.');
    else showToast(es?'No se pudieron activar las alertas de vuelo.':'Could not enable flight alerts.');
    return false;
  }
}

function normalizeTime24(value){
  if(!value) return '';
  const s=String(value).trim();
  let m=s.match(/^(\d{1,2}):(\d{2})$/);
  if(m){
    const h=Math.max(0,Math.min(23,Number(m[1])));
    const min=Math.max(0,Math.min(59,Number(m[2])));
    return String(h).padStart(2,'0')+':'+String(min).padStart(2,'0');
  }
  m=s.match(/^(\d{1,2})(?::(\d{2}))?\s*(AM|PM)$/i);
  if(m){
    let h=Number(m[1]); const min=Number(m[2]||0); const ap=m[3].toUpperCase();
    if(h<1||h>12||min<0||min>59) return '';
    if(ap==='AM'&&h===12) h=0;
    if(ap==='PM'&&h!==12) h+=12;
    return String(h).padStart(2,'0')+':'+String(min).padStart(2,'0');
  }
  return s;
}
function formatTime12(value){
  const t=normalizeTime24(value);
  const m=t.match(/^(\d{2}):(\d{2})$/);
  if(!m) return value||'';
  let h=Number(m[1]); const min=m[2]; const ap=h>=12?'PM':'AM';
  h=h%12||12;
  return `${h}:${min} ${ap}`;
}
function time12PickerHtml(prefix, value=''){
  const norm=normalizeTime24(value);
  let h24=norm&&/^\d{2}:\d{2}$/.test(norm)?Number(norm.slice(0,2)):9;
  let min=norm&&/^\d{2}:\d{2}$/.test(norm)?norm.slice(3,5):'00';
  const ap=h24>=12?'PM':'AM';
  const h12=h24%12||12;
  const hours=Array.from({length:12},(_,i)=>i+1).map(h=>`<option value="${h}" ${h===h12?'selected':''}>${h}</option>`).join('');
  const mins=['00','05','10','15','20','25','30','35','40','45','50','55'].map(v=>`<option value="${v}" ${v===min?'selected':''}>${v}</option>`).join('');
  return `<div class="time12-picker">
    <select class="hour" id="${prefix}-hour" aria-label="Hour">${hours}</select>
    <span>:</span>
    <select class="minute" id="${prefix}-minute" aria-label="Minute">${mins}</select>
    <select class="ampm" id="${prefix}-ampm" aria-label="AM or PM">
      <option value="AM" ${ap==='AM'?'selected':''}>AM</option>
      <option value="PM" ${ap==='PM'?'selected':''}>PM</option>
    </select>
  </div>`;
}
function getTime12PickerValue(prefix){
  const hEl=document.getElementById(prefix+'-hour');
  const mEl=document.getElementById(prefix+'-minute');
  const aEl=document.getElementById(prefix+'-ampm');
  if(!hEl||!mEl||!aEl) return '';
  let h=Number(hEl.value); const min=mEl.value; const ap=aEl.value;
  if(ap==='AM'&&h===12) h=0;
  if(ap==='PM'&&h!==12) h+=12;
  return String(h).padStart(2,'0')+':'+String(min).padStart(2,'0');
}

function localizedDateLabel(iso){
  if(!iso) return '';
  const parts=String(iso).split('-').map(Number);
  if(parts.length!==3 || parts.some(Number.isNaN)) return iso;
  const d=new Date(parts[0],parts[1]-1,parts[2]);
  try{
    return new Intl.DateTimeFormat(state.lang==='es'?'es-ES':'en-US',{
      weekday:'long', month:'long', day:'numeric', year:'numeric'
    }).format(d);
  }catch(e){ return iso; }
}
function displayDayLabel(day,index=0){
  const raw=String(day?.label||'').trim();
  const generated=/^(Day|Día)\s+\d+\s*[—-]\s*\d{4}-\d{2}-\d{2}$/i.test(raw);
  if(day?.date && (generated || !raw)){
    return `${state.lang==='es'?'Día':'Day'} ${index+1} — ${localizedDateLabel(day.date)}`;
  }
  return raw || `${state.lang==='es'?'Día':'Day'} ${index+1}${day?.date?' — '+localizedDateLabel(day.date):''}`;
}

function generateDays(){
  const tr = tripById(ui.currentTripId);
  if(!tr || !tr.start || !tr.end) return;
  if(!state.itineraries[tr.id]) state.itineraries[tr.id]=[];
  const s = new Date(tr.start), e = new Date(tr.end);
  const existingDates = new Set(state.itineraries[tr.id].map(d=>d.date));
  let n=1;
  for(let d=new Date(s); d<=e; d.setDate(d.getDate()+1)){
    const iso = d.toISOString().slice(0,10);
    if(!existingDates.has(iso)){ state.itineraries[tr.id].push({id:uid(), label:`${state.lang==='es'?'Día':'Day'} ${n} — ${iso}`, date:iso, activities:[]}); }
    n++;
  }
  saveState(); render();
}

function setConverterMode(mode){
  syncConverterDraftFromFields();
  ui.convDraft.mode=mode;
  ui.convDraft.error='';
  ui.convResult=null;
  render();
  if(mode==='auto') setTimeout(fetchDailyRate,0);
}
async function fetchDailyRate(){
  ensureConverterDefaults();
  syncConverterDraftFromFields(false);
  const from=String(ui.convDraft.from||'').toUpperCase();
  const to=String(ui.convDraft.to||'').toUpperCase();
  if(!from||!to) return;

  if(from===to){
    ui.convDraft.rate='1';
    ui.convDraft.rateDate=new Date().toISOString().slice(0,10);
    ui.convDraft.loading=false;
    ui.convDraft.error='';
    ui.convDraft.rateSource='identity';
    ui.convResult={value:parseMoneyInput(ui.convDraft.amount),to,rate:1,date:ui.convDraft.rateDate||''};
    render();
    return;
  }

  const cacheKey=`waypoint-fx:${from}:${to}`;
  const saveCachedRate=(data)=>{
    try{
      localStorage.setItem(cacheKey,JSON.stringify({
        rate:Number(data.rate),
        date:data.date||'',
        source:data.source||'',
        savedAt:Date.now()
      }));
    }catch(e){}
  };
  const readCachedRate=()=>{
    try{
      const raw=localStorage.getItem(cacheKey);
      if(!raw) return null;
      const x=JSON.parse(raw);
      return Number(x.rate)>0?x:null;
    }catch(e){ return null; }
  };
  const applyRate=(data,source)=>{
    const rate=Number(data.rate);
    if(!Number.isFinite(rate)||rate<=0) throw new Error('invalid rate');
    ui.convDraft.rate=String(rate);
    ui.convDraft.rateDate=data.date||new Date().toISOString().slice(0,10);
    ui.convDraft.loading=false;
    ui.convDraft.error='';
    ui.convDraft.rateSource=source||data.source||'live';
    const amount=parseMoneyInput(ui.convDraft.amount);
    ui.convResult={value:roundMoney(amount*rate),to,rate,date:ui.convDraft.rateDate||''};
    saveCachedRate({rate,date:ui.convDraft.rateDate,source:ui.convDraft.rateSource});
    render();
  };

  ui.convDraft.loading=true;
  ui.convDraft.error='';
  render();

  // Route 1: Waypoint production server (best for deployed app).
  try{
    if(location.protocol==='http:' || location.protocol==='https:'){
      const r=await fetch(`/api/fx/rate?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`,{cache:'no-store'});
      if(r.ok){
        const data=await r.json();
        if(Number(data.rate)>0){
          applyRate(data,'Waypoint');
          return;
        }
      }
    }
  }catch(e){}

  // Route 2: direct public provider (works for standalone HTML/PWA when allowed by network/browser).
  try{
    const url=`https://api.frankfurter.dev/v2/rate/${encodeURIComponent(from.toLowerCase())}/${encodeURIComponent(to.toLowerCase())}`;
    const r=await fetch(url,{headers:{'accept':'application/json'},cache:'no-store'});
    if(r.ok){
      const data=await r.json();
      if(Number(data.rate)>0){
        applyRate({rate:Number(data.rate),date:data.date||'',source:'Frankfurter'},'Frankfurter');
        return;
      }
    }
  }catch(e){}

  // Route 3: try rates endpoint as a compatibility fallback.
  try{
    const url=`https://api.frankfurter.dev/v2/rates?base=${encodeURIComponent(from.toLowerCase())}&quotes=${encodeURIComponent(to.toLowerCase())}`;
    const r=await fetch(url,{headers:{'accept':'application/json'},cache:'no-store'});
    if(r.ok){
      const rows=await r.json();
      const row=Array.isArray(rows)?rows.find(x=>String(x.quote||'').toUpperCase()===to):null;
      if(row&&Number(row.rate)>0){
        applyRate({rate:Number(row.rate),date:row.date||'',source:'Frankfurter'},'Frankfurter');
        return;
      }
    }
  }catch(e){}

  // Route 4: last known valid rate from this device.
  const cached=readCachedRate();
  if(cached){
    ui.convDraft.rate=String(cached.rate);
    ui.convDraft.rateDate=cached.date||'';
    ui.convDraft.loading=false;
    ui.convDraft.error=state.lang==='es'
      ?'Sin conexión con la tasa en vivo. Mostrando la última tasa disponible en este dispositivo.'
      :'Live rate unavailable. Showing the last rate saved on this device.';
    ui.convDraft.rateSource='cache';
    const amount=parseMoneyInput(ui.convDraft.amount);
    ui.convResult={value:roundMoney(amount*Number(cached.rate)),to,rate:Number(cached.rate),date:cached.date||''};
    render();
    return;
  }

  ui.convDraft.loading=false;
  ui.convDraft.error=state.lang==='es'
    ?'No pudimos obtener una tasa en vivo para este par. Verifica tu conexión o usa una tasa manual.'
    :'We could not retrieve a live rate for this pair. Check your connection or use a manual rate.';
  ui.convDraft.rateSource='';
  render();
}
