function calcConvert(){
  syncConverterDraftFromFields(true);
  const amount=parseMoneyInput(ui.convDraft.amount);
  const rate=parseFloat(ui.convDraft.rate)||0;
  ui.convResult={value:roundMoney(amount*rate),to:ui.convDraft.to||'—',rate,date:ui.convDraft.rateDate||''};
  render();
}

}

function deleteExpense(id){
  const t=tt();
  const idx = state.expenses.findIndex(e=>e.id===id);
  const removed = state.expenses[idx];
  state.expenses = state.expenses.filter(e=>e.id!==id);
  saveState(); render();
  showToast(t.budget.deleted, ()=>{ state.expenses.splice(idx,0,removed); saveState(); render(); });
}

function packingCategoryOf(it){
  return PACKING_CATEGORIES.includes(it.category)?it.category:'other';
}
function packingCategoryLabel(cat){ return PACKING_CATEGORY_LABELS[state.lang][cat]||cat; }
function viewChecklistSub(tr){
  const t=tt(), es=state.lang==='es';
  const items = state.checklists[tr.id]||[];
  const packed=items.filter(x=>x.done).length;
  const pct=items.length?Math.round(packed/items.length*100):0;
  const groups=PACKING_CATEGORIES.map(cat=>({cat,items:items.filter(x=>packingCategoryOf(x)===cat)})).filter(g=>g.items.length);
  return `
    <div class="panel">
      <div class="packing-summary">
        <div><div style="font-family:var(--font-mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;">${es?'Progreso del equipaje':'Packing progress'}</div>
        <div class="packing-count">${packed}/${items.length}</div><div style="font-size:11px;color:var(--muted);">${es?'artículos preparados':'items packed'}</div></div>
        <div style="min-width:120px;flex:1;max-width:260px;"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px;"><span>${es?'Completado':'Complete'}</span><strong>${pct}%</strong></div><div class="progress-line"><div style="width:${pct}%"></div></div></div>
      </div>
      <div class="packing-add-grid">
        <div class="packing-name field" style="margin:0;"><label>${es?'Artículo':'Item'}</label><input id="ck-item" placeholder="${t.checklist.itemPlaceholder}" onkeydown="if(event.key==='Enter')addChecklistItem()"></div>
        <div class="field" style="margin:0;"><label>${es?'Categoría':'Category'}</label><select id="ck-cat">${PACKING_CATEGORIES.map(c=>`<option value="${c}">${packingCategoryLabel(c)}</option>`).join('')}</select></div>
        <div class="field" style="margin:0;"><label>${es?'Cantidad':'Qty'}</label><input id="ck-qty" type="number" min="1" max="99" value="1"></div>
        <button class="btn btn-brass btn-sm packing-add-btn" onclick="addChecklistItem()">+ ${t.common.add}</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
      <button class="btn btn-ghost btn-sm" onclick="addPresetItems()">+ ${es?'Esenciales de viaje':'Travel essentials'}</button>
      ${tr.tripType && TRIP_TYPE_PACKING[tr.tripType]? `<button class="btn btn-ghost btn-sm" onclick="addTypePresetItems()">+ ${TRIP_TYPE_LABELS[state.lang][tr.tripType]}</button>`:''}
      ${items.length?`<button class="btn btn-ghost btn-sm" onclick="markAllPacked(${packed===items.length?'false':'true'})">${packed===items.length?(es?'Desmarcar todo':'Unpack all'):(es?'Marcar todo listo':'Pack all')}</button>`:''}
    </div>
    ${groups.length?groups.map(g=>`<div class="panel packing-group">
      <div class="packing-group-head"><div class="packing-group-title">${packingCategoryLabel(g.cat)}</div><div class="packing-group-count">${g.items.filter(x=>x.done).length}/${g.items.length}</div></div>
      ${g.items.map(it=>`<div class="packing-item"><input type="checkbox" ${it.done?'checked':''} onchange="toggleChecklistItem('${it.id}')"><span class="packing-text ${it.done?'done':''}">${escapeHtml(it.text)}</span>${Number(it.qty||1)>1?`<span class="qty-badge">×${Number(it.qty||1)}</span>`:''}<button class="del" onclick="deleteChecklistItem('${it.id}')">✕</button></div>`).join('')}
    </div>`).join(''):`<div class="panel"><div class="empty"><span class="ic">🧳</span><h3>${es?'Tu maleta empieza aquí':'Your packing list starts here'}</h3><p>${es?'Agrega tus artículos o usa una lista sugerida para comenzar.':'Add items or use a suggested list to get started.'}</p></div></div>`}
  `;
}
function addChecklistItem(){
  const el=document.getElementById('ck-item'); if(!el||!ui.currentTripId) return;
  const val=el.value.trim(); if(!val) return;
  const cat=document.getElementById('ck-cat')?.value||'other';
  const qty=Math.max(1,Math.min(99,Number(document.getElementById('ck-qty')?.value||1)));
  if(!state.checklists[ui.currentTripId]) state.checklists[ui.currentTripId]=[];
  state.checklists[ui.currentTripId].push({id:uid(),text:val,done:false,category:cat,qty});
  saveState(); render();
}
function normalizePackingPreset(x){ return typeof x==='string'?{text:x,category:'other',qty:1}:{text:x.text,category:x.category||'other',qty:x.qty||1}; }
function addPresetItems(){
  if(!ui.currentTripId) return;
  if(!state.checklists[ui.currentTripId]) state.checklists[ui.currentTripId]=[];
  const existing=new Set(state.checklists[ui.currentTripId].map(i=>(i.text||'').toLowerCase()));
  PRESET_ITEMS[state.lang].map(normalizePackingPreset).forEach(x=>{if(!existing.has(x.text.toLowerCase())) state.checklists[ui.currentTripId].push({id:uid(),text:x.text,done:false,category:x.category,qty:x.qty});});
  saveState(); render();
}
function addTypePresetItems(){
  const tr=tripById(ui.currentTripId);
  if(!tr||!tr.tripType||!TRIP_TYPE_PACKING[tr.tripType]) return;
  if(!state.checklists[ui.currentTripId]) state.checklists[ui.currentTripId]=[];
  const existing=new Set(state.checklists[ui.currentTripId].map(i=>(i.text||'').toLowerCase()));
  TRIP_TYPE_PACKING[tr.tripType][state.lang].map(normalizePackingPreset).forEach(x=>{if(!existing.has(x.text.toLowerCase())) state.checklists[ui.currentTripId].push({id:uid(),text:x.text,done:false,category:x.category,qty:x.qty});});
  saveState(); render();
}
function toggleChecklistItem(id){
  const it=(state.checklists[ui.currentTripId]||[]).find(i=>i.id===id);
  if(it){it.done=!it.done;saveState();render();}
}
function markAllPacked(done){
  (state.checklists[ui.currentTripId]||[]).forEach(i=>i.done=Boolean(done));
  saveState();render();
}
function deleteChecklistItem(id){
  state.checklists[ui.currentTripId]=(state.checklists[ui.currentTripId]||[]).filter(i=>i.id!==id);
  saveState();render();
}

function addDoc(tripId){
  const label = document.getElementById('doc-label').value.trim();
  const value = document.getElementById('doc-value').value.trim();
  if(!label || !value) return;
  if(!state.tripDocs[tripId]) state.tripDocs[tripId]=[];
  state.tripDocs[tripId].push({id:uid(), label, value});
  saveState(); render();
}
function quickAddDoc(label){
  const el = document.getElementById('doc-label');
  if(el){ el.value = label; document.getElementById('doc-value').focus(); }
}
function deleteDoc(tripId,docId){
  state.tripDocs[tripId] = (state.tripDocs[tripId]||[]).filter(d=>d.id!==docId);
  saveState(); render();
}

}

function saveProfileName(v){ state.profile.name = v.trim(); saveState(); }

function handlePhotoUpload(evt){
  const file = evt.target.files[0]; if(!file) return;
  resizeImageFile(file, 200, (dataUrl)=>{ state.profile.photo=dataUrl; saveState(); render(); });
}
function removePhoto(){ state.profile.photo=''; saveState(); render(); }

function exportData(){
  const t=tt();
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='waypoint-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  showToast(t.settings.exported);
}
function importData(evt){
  const t=tt();
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data || !Array.isArray(data.trips)) throw new Error('bad format');
      askConfirm(t.settings.importConfirm, ()=>{
        state = Object.assign({lang:state.lang, trips:[], expenses:[], checklists:{}, itineraries:{}, tripDocs:{}, bookings:{}}, data);
        saveState(); render();
        showToast(t.settings.imported);
      }, true, t.common.continueLabel);
    }catch(e){ showToast(t.settings.importError); }
  };
  reader.readAsText(file);
  evt.target.value = '';
}
function resetAllData(){
  const t=tt();
  askConfirm(t.settings.resetConfirm, ()=>{
    const lang = state.lang;
    state = {lang, trips:[], expenses:[], checklists:{}, itineraries:{}, tripDocs:{}, bookings:{}, profile:{name:"", avatar:"✈", photo:"", currency:"USD", theme:"brass"}};
    ui = {screen:"home", currentTripId:null, tripSubTab:"overview", modal:null, editingTrip:null,
      tripSearch:"", tripView:"upcoming", newTripCover:"", expenseDraft:null,
      confirmMessage:"", confirmAction:null, confirmDanger:false, confirmLabel:null,
      convDraft:{amount:"100", from:"", to:"", rate:"1", mode:"auto", rateDate:"", loading:false, error:"", rateSource:""}, convResult:null};
    saveState(); render();
    showToast(t.settings.resetDone);
  }, true);
}

function renderModal(){
  let old = document.querySelector('.modal-bg'); if(old) old.remove();
  if(!ui.modal) return;
  const t=tt();
  const bg = document.createElement('div');
  bg.className='modal-bg';
  bg.onclick=(e)=>{ if(e.target===bg){ ui.modal=null; render(); } };
  let inner='';

  if(ui.modal==='trip'){
    const tr = ui.editingTrip? tripById(ui.editingTrip) : {};
    const coverPhoto = ui.editingTrip? tr.coverPhoto : ui.newTripCover;
    inner = `
      <h3>${ui.editingTrip? t.trip.editTripTitle : t.trip.newTripTitle}</h3>
      <div class="field"><label>${t.trip.coverPhoto}</label>
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="trip-cover-preview">${coverPhoto? `<img src="${coverPhoto}">` : '🖼'}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('trip-cover-file').click()">${t.trip.uploadPhoto}</button>
            <input type="file" id="trip-cover-file" accept="image/*" class="hidden-file" onchange="handleTripCoverUpload(event,'${ui.editingTrip||''}')">
            ${coverPhoto? `<button type="button" class="btn btn-ghost btn-sm" onclick="removeTripCover('${ui.editingTrip||''}')">${t.common.remove}</button>`:''}
          </div>
        </div>
      </div>
      <div class="field"><label>${t.trip.name}</label><input id="f-name" placeholder="${t.trip.namePlaceholder}" value="${escapeHtml(tr.name||'')}"></div>
      <div class="field"><label>${t.trip.destination}</label><input id="f-dest" placeholder="${t.trip.destPlaceholder}" value="${escapeHtml(tr.destination||'')}"></div>
      <div class="field"><label>${t.trip.tripType}</label><select id="f-type">
        <option value="">${t.trip.tripTypeNone}</option>
        ${TRIP_TYPES.map(tt2=>`<option value="${tt2}" ${tr.tripType===tt2?'selected':''}>${TRIP_TYPE_LABELS[state.lang][tt2]}</option>`).join('')}
      </select></div>
      <div class="form-row">
        <div class="field"><label>${t.trip.start}</label><input id="f-start" type="date" value="${tr.start||''}"></div>
        <div class="field"><label>${t.trip.end}</label><input id="f-end" type="date" value="${tr.end||''}"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>${t.trip.budgetGoal}</label><input id="f-budget" type="number" min="0" value="${tr.budgetGoal||''}" step="0.01" inputmode="decimal" onblur="if(this.value!==''){this.value=roundMoney(this.value).toFixed(2);}"></div>
        <div class="field"><label>${t.trip.currency}</label>${currencySelectHtml('f-currency', tr.currency||state.profile.currency||'USD')}</div>
      </div>
      <div class="field"><label>${t.trip.passportExpiry}</label><input id="f-passport" type="date" value="${tr.passportExpiry||''}">
        <p class="field-hint">${t.trip.passportHint}</p></div>
      <div class="field"><label>${t.trip.notes}</label><textarea id="f-notes">${escapeHtml(tr.notes||'')}</textarea></div>
      <div class="form-actions">
        <button class="btn btn-brass btn-block" onclick="saveTripForm()">${t.common.save}</button>
        <button class="btn btn-ghost" onclick="closeModal()">${t.common.cancel}</button>
      </div>`;
  }
  if(ui.modal==='tripChat'){
    const tr=tripById(ui.chatTripId);
    if(tr){
      const es=state.lang==='es';
      const messages=Array.isArray(ui.chatMessages)?ui.chatMessages:[];
      const me=chatParticipantId();
      inner=`
        <div class="chat-shell">
          <div class="chat-head">
            <div>
              <h3 style="margin-bottom:2px;">💬 ${es?'Chat del viaje':'Trip chat'}</h3>
              <div class="chat-trip">${escapeHtml(tr.name||'')}${collabParticipantsText(tr)?`<br>👥 ${escapeHtml(collabParticipantsText(tr))}`:''}</div>
            </div>
            <button type="button" class="btn btn-ghost btn-sm" onclick="loadTripChat('${tr.id}')">↻ ${es?'Actualizar':'Refresh'}</button>
          </div>

          <div class="chat-list" id="chat-list">
            ${ui.chatLoading
              ? `<div class="chat-empty">${es?'Cargando mensajes…':'Loading messages…'}</div>`
              : messages.length
                ? messages.map(m=>`
                    <div class="chat-msg ${m.participantId===me?'mine':''}">
                      <div class="chat-meta">${escapeHtml(m.name||(es?'Participante':'Participant'))} · ${escapeHtml(formatChatTime(m.createdAt))}</div>
                      <div class="chat-text">${escapeHtml(m.text||'')}</div>
                    </div>`).join('')
                : `<div class="chat-empty">${es?'Todavía no hay mensajes. Escribe el primero.':'No messages yet. Start the conversation.'}</div>`
            }
          </div>

          <div class="chat-compose">
            <textarea
              id="chat-input"
              maxlength="500"
              autocomplete="off"
              autocapitalize="sentences"
              enterkeyhint="send"
              placeholder="${es?'Escribe un mensaje…':'Write a message…'}"
              onkeydown="chatKeydown(event,'${tr.id}')"></textarea>
            <button type="button" id="chat-send-btn" class="btn btn-brass" onclick="sendTripChat('${tr.id}')">${es?'Enviar':'Send'}</button>
          </div>

          <div class="field-hint">${es?'Solo los participantes con acceso al viaje colaborativo pueden ver este chat.':'Only participants with access to this collaborative trip can view this chat.'}</div>
          <button type="button" class="btn btn-ghost btn-block" onclick="closeModal()">${t.common.close}</button>
        </div>`;

      setTimeout(()=>{
        const list=document.getElementById('chat-list');
        if(list) list.scrollTop=list.scrollHeight;
        const input=document.getElementById('chat-input');
        if(input && !ui.chatLoading) input.focus();
      },0);
    }
  }

  if(ui.modal==='shareCenter'){
    const tr=tripById(ui.actionsTripId);
    if(tr){
      const es=state.lang==='es';
      const liveReady=!!(tr.liveSync&&tr.syncServer&&tr.editKey&&tr.shareId);
      inner = `
        <h3>↗ ${es?'Compartir viaje':'Share trip'}</h3>
        <p class="field-hint" style="margin-bottom:14px;">${es?'Elige cómo quieres compartir este viaje. Waypoint usará la opción compatible con tu dispositivo.':'Choose how you want to share this trip. Waypoint will use the option supported by your device.'}</p>
        <button class="btn btn-brass btn-block" style="justify-content:flex-start;margin-bottom:8px;" onclick="nativeShareTrip('${tr.id}')">↗ &nbsp;${es?'Compartir del sistema':'System share'}</button>
        <button class="btn btn-ghost btn-block" style="justify-content:flex-start;margin-bottom:8px;" onclick="shareViaWhatsApp('${tr.id}')">💬 &nbsp;WhatsApp</button>
        <button class="btn btn-ghost btn-block" style="justify-content:flex-start;margin-bottom:8px;" onclick="shareViaSMS('${tr.id}')">💬 &nbsp;${es?'Mensajes / SMS':'Messages / SMS'}</button>
        <button class="btn btn-ghost btn-block" style="justify-content:flex-start;margin-bottom:8px;" onclick="shareViaEmail('${tr.id}')">✉️ &nbsp;${es?'Correo':'Email'}</button>
        <button class="btn btn-ghost btn-block" style="justify-content:flex-start;margin-bottom:8px;" onclick="copyTripShare('${tr.id}')">📋 &nbsp;${es?'Copiar resumen':'Copy summary'}</button>
        <button class="btn btn-ghost btn-block" style="justify-content:flex-start;margin-bottom:8px;" onclick="downloadEditableItinerary('${tr.id}')">⬇️ &nbsp;${es?'Descargar itinerario editable':'Download editable itinerary'}</button>
        <button class="btn btn-ghost btn-block" style="justify-content:flex-start;margin-bottom:8px;" onclick="startLiveCollaboration('${tr.id}')">👥 &nbsp;${liveReady?(es?'Compartir enlace colaborativo':'Share collaboration link'):(es?'Activar colaboración en vivo':'Enable live collaboration')}</button>
        <button class="btn btn-ghost btn-block" style="margin-top:12px;" onclick="closeModal()">${t.common.close}</button>`;
    }
  }

  if(ui.modal==='shareFallback'){
    const d=ui.shareFallback||{};
    inner = `
      <h3>↗ ${state.lang==='es'?'Compartir':'Share'}: ${escapeHtml(d.title||'')}</h3>
      <p class="field-hint">${state.lang==='es'?'Tu navegador no permitió abrir el menú de compartir. Copia este contenido y envíalo por WhatsApp, Mensajes, correo u otra app.':'Your browser did not allow the share menu. Copy this content and send it through Messages, email, or another app.'}</p>
      <div class="field"><textarea id="share-fallback-text" style="min-height:180px;">${escapeHtml(d.text||'')}</textarea></div>
      <div class="form-actions">
        <button class="btn btn-brass" onclick="copyShareFallback()">${state.lang==='es'?'Copiar':'Copy'}</button>
        <button class="btn btn-ghost" onclick="closeModal()">${t.common.close}</button>
      </div>`;
  }

  if(ui.modal==='tripActions'){
    const tr = tripById(ui.actionsTripId);
    inner = tr? `
      <h3>${escapeHtml(tr.name)}</h3>
      <button class="btn btn-ghost btn-block" style="justify-content:flex-start;margin-bottom:8px;" onclick="openTripForm('${tr.id}')">✎ &nbsp;${t.common.edit}</button>
      <button class="btn btn-ghost btn-block" style="justify-content:flex-start;margin-bottom:8px;" onclick="duplicateTrip('${tr.id}')">⧉ &nbsp;${t.home.duplicate}</button>
      <button class="btn btn-ghost btn-block" style="justify-content:flex-start;margin-bottom:8px;" onclick="shareTrip('${tr.id}')">↗ &nbsp;${t.home.share}</button>
      <button class="btn btn-danger btn-block" style="justify-content:flex-start;" onclick="deleteTrip('${tr.id}')">✕ &nbsp;${t.common.delete}</button>
    ` : '';
  }
  if(ui.modal==='day'){
    inner = `
      <h3>${t.itinerary.addDay}</h3>
      <div class="field"><label>${t.itinerary.dayLabel}</label><input id="d-label" placeholder="Day 1 — city arrival"></div>
      <div class="form-actions">
        <button class="btn btn-brass btn-block" onclick="saveDayForm()">${t.common.save}</button>
        <button class="btn btn-ghost" onclick="closeModal()">${t.common.cancel}</button>
      </div>`;
  }
  if(ui.modal==='expense'){
    const d = ui.expenseDraft || {cat:CATS[0], desc:'', amount:'', date:new Date().toISOString().slice(0,10)};
    inner = `
      <h3>${t.budget.addExpense}</h3>
      <div class="field"><label>${t.budget.category}</label><select id="e-cat">${CATS.map(c=>`<option value="${c}" ${d.cat===c?'selected':''}>${t.budget.cats[c]}</option>`).join('')}</select></div>
      <div class="field"><label>${t.budget.desc}</label><input id="e-desc" value="${escapeHtml(d.desc)}"></div>
      <div class="form-row">
        <div class="field"><label>${t.budget.amount}</label><input id="e-amount" type="number" min="0" value="${escapeHtml(d.amount)}" step="0.01" inputmode="decimal" onblur="if(this.value!==''){this.value=roundMoney(this.value).toFixed(2);}"></div>
        <div class="field"><label>${t.budget.date}</label><input id="e-date" type="date" value="${d.date}"></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-brass btn-block" onclick="saveExpenseForm()">${t.common.save}</button>
        <button class="btn btn-ghost" onclick="closeModal()">${t.common.cancel}</button>
      </div>`;
  }
  if(ui.modal==='booking'){
    const es=state.lang==='es';
    inner = `
      <h3>${es?'Nueva reserva':'New booking'}</h3>
      <div class="field"><label>${es?'Tipo':'Type'}</label><select id="b-type" onchange="toggleFlightFields()">
        <option value="flight">✈ ${es?'Vuelo':'Flight'}</option>
        <option value="hotel">🏨 Hotel</option>
        <option value="transport">🚗 ${es?'Transporte':'Transport'}</option>
        <option value="activity">🎟 ${es?'Actividad':'Activity'}</option>
        <option value="other">• ${es?'Otra':'Other'}</option>
      </select></div>
      <div id="flight-fields" class="panel" style="padding:12px;margin-bottom:12px;">
        <div class="form-row">
          <div class="field"><label>${es?'Número de vuelo':'Flight number'}</label><input id="b-flight-number" placeholder="AA123" autocapitalize="characters"></div>
          <div class="field"><label>${es?'Fecha del vuelo':'Flight date'}</label><div class="field-hint">${es?'Usa la fecha de la reserva indicada abajo.':'Uses the booking date below.'}</div></div>
        </div>
        <div class="form-row">
          <div class="field"><label>${es?'Origen (IATA)':'Origin (IATA)'}</label><input id="b-origin" maxlength="3" placeholder="MIA" style="text-transform:uppercase"></div>
          <div class="field"><label>${es?'Destino (IATA)':'Destination (IATA)'}</label><input id="b-destination" maxlength="3" placeholder="BOG" style="text-transform:uppercase"></div>
        </div>
        <label style="display:flex;align-items:flex-start;gap:9px;font-size:12px;color:var(--ink-text);">
          <input id="b-flight-alerts" type="checkbox" style="width:18px;height:18px;accent-color:var(--brass);margin-top:1px;">
          <span>🔔 ${es?'Recibir alertas del vuelo (salida, llegada, retrasos, cancelación y cambios disponibles)':'Receive flight alerts (departure, arrival, delays, cancellation and available changes)'}</span>
        </label>
        <div class="field-hint">${es?'En iPhone, Waypoint debe estar instalada en la pantalla de inicio para recibir Web Push.':'On iPhone, Waypoint must be installed on the Home Screen to receive Web Push.'}</div>
      </div>
      <div class="field"><label>${es?'Nombre / ruta':'Name / route'}</label><input id="b-title" placeholder="${es?'Ej. MIA → BOG / Hotel Cartagena':'e.g. MIA → BOG / Cartagena Hotel'}"></div>
      <div class="form-row">
        <div class="field"><label>${es?'Proveedor':'Provider'}</label><input id="b-provider" placeholder="${es?'Aerolínea, hotel…':'Airline, hotel…'}"></div>
        <div class="field"><label>${es?'Confirmación':'Confirmation'}</label><input id="b-confirm" placeholder="ABC123"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>${es?'Fecha':'Date'}</label><input id="b-date" type="date"></div>
        <div class="field"><label>${es?'Hora':'Time'}</label>${time12PickerHtml('b-time')}</div>
      </div>
      <div class="field"><label>${es?'Lugar / dirección':'Place / address'}</label><input id="b-location" placeholder="${es?'Aeropuerto, hotel, punto de encuentro…':'Airport, hotel, meeting point…'}"></div>
      <div class="field"><label>${es?'Notas':'Notes'}</label><textarea id="b-notes" placeholder="${es?'Terminal, equipaje, check-in, instrucciones…':'Terminal, baggage, check-in, instructions…'}"></textarea></div>
      <div class="form-actions">
        <button class="btn btn-brass btn-block" onclick="saveBookingForm()">${es?'Guardar':'Save'}</button>
        <button class="btn btn-ghost" onclick="closeModal()">${es?'Cancelar':'Cancel'}</button>
      </div>`;
  }
  if(ui.modal==='confirm'){
    inner = `
      <h3>${ui.confirmDanger? '⚠ ' : ''}${t.common.pleaseConfirm}</h3>
      <p style="color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 20px;">${escapeHtml(ui.confirmMessage||'')}</p>
      <div class="form-actions">
        <button class="btn ${ui.confirmDanger?'btn-danger':'btn-brass'} btn-block" onclick="runConfirmAction()">${ui.confirmLabel || (ui.confirmDanger? t.common.delete : t.common.save)}</button>
        <button class="btn btn-ghost" onclick="cancelConfirm()">${t.common.cancel}</button>
      </div>`;
  }
  bg.innerHTML = `<div class="modal ${ui.modal==='tripChat'?'chat-modal':''}">${inner}</div>`;
  document.body.appendChild(bg);
}
function closeModal(){ ui.modal=null; ui.editingTrip=null; render(); }

document.addEventListener('change', (e)=>{
  if(e.target && e.target.id==='f-currency'){ /* handled at save time */ }
});


if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(()=>{}));
}

loadState();
setTimeout(()=>{ const s=document.getElementById('splash'); if(s) s.remove(); }, 1600);
</script>
</body>
</html>
